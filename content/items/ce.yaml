    autorisés.
  prompt: Que demande l'auteur de la lettre ?
  options:
  - Un dédommagement financier.
  - L'arrêt définitif du chantier.
  - Le respect des horaires autorisés.
  answer: 2
- slug: ce-b2-sommeil
  cefr: B2
  passage: 'Loin d''être une perte de temps, la sieste courte améliorerait la vigilance et la mémoire.
