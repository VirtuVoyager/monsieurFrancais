  options:
  - Recruter de nouveaux employés.
  - Réduire l'impact environnemental.
  - Augmenter les salaires.
  answer: 1
- slug: ce-b1-lettre
  cefr: B1
  passage: Madame, Monsieur, je me permets de vous écrire concernant le bruit provenant du chantier voisin,
