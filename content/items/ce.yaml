    profond et de se réveiller plus fatigué qu''avant.'
  prompt: Selon le texte, à quelle condition la sieste est-elle bénéfique ?
  options:
  - Si elle ne dépasse pas vingt minutes.
  - Si elle dure plus d'une heure.
  - Si elle a lieu le soir.
  answer: 0
- slug: ce-b2-emploi
  cefr: B2
  passage: Si l'automatisation fait disparaître certaines tâches répétitives, elle crée parallèlement
    des besoins nouveaux en maintenance et en analyse de données. Le défi consiste donc moins à freiner
    le progrès qu'à accompagner la reconversion des salariés concernés.
  prompt: Quelle est la position de l'auteur ?
  options:
  - Il faut ralentir l'automatisation.
  - Il faut surtout former les salariés à de nouveaux métiers.
  - L'automatisation ne change rien à l'emploi.
  answer: 1
- slug: ce-b2-tourisme
  cefr: B2
  passage: Victime de son succès, la ville a instauré un quota quotidien de visiteurs dans son centre
    historique. Les commerçants, d'abord hostiles, reconnaissent aujourd'hui que la mesure a permis de
    retrouver une clientèle locale qui avait déserté le quartier.
  prompt: Comment les commerçants perçoivent-ils la mesure aujourd'hui ?
  options:
  - Ils demandent sa suppression.
  - Ils y restent opposés.
  - Ils en voient les effets positifs.
  answer: 2
