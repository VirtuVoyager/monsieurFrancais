    On a souvent présenté l’écran comme un instrument de liberté : chacun lit quand il veut, où il veut, selon son humeur et son temps disponible. Ce récit est séduisant, mais il oublie une transformation plus discrète. L’information numérique s’est installée dans les creux de la journée, là où la lecture n’était autrefois qu’une parenthèse. Dans le métro, avant un rendez-vous, entre deux cours, au fond d’une file d’attente, l’usager consulte moins qu’il ne comble.

