    Cette évolution ne demande pas de matériel particulier, mais elle suppose l’attention de chacun. Si vous avez besoin d’aide pour classer vos dossiers ou signer un document en ligne, l’équipe informatique restera disponible mardi et jeudi matin.

    Merci de votre coopération,
