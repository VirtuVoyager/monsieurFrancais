  passage: |-
    Dans beaucoup de familles, le repas commun reste présenté comme un refuge. On y parle de la journée, on y règle les petits soucis, on y transmet des habitudes. Mais le même moment peut aussi devenir une scène de friction, surtout quand chacun arrive avec ses horaires, sa fatigue, ses exigences, ses écrans et ses opinions. La table ne garantit pas l’harmonie ; elle offre seulement un lieu où le désaccord ne peut plus tout à fait se cacher.

    Certains regrettent ce qu’ils appellent la disparition du repas « comme avant ». Ils imaginent une époque où les mêmes personnes mangeaient la même chose au même moment dans un silence discipliné. Ce souvenir arrange souvent davantage qu’il ne décrit. Les familles d’hier n’étaient pas forcément plus unies ; elles étaient parfois plus contraintes de faire semblant de l’être. La convivialité contemporaine, avec son désordre, a au moins l’honnêteté de montrer que vivre ensemble suppose de composer, non d’imposer.

    C’est pourquoi les tentatives pour imposer une règle unique — tout le monde à table, tout le monde sans téléphone, tout le monde d’accord — échouent souvent à long terme. Elles confondent paix et suspension de la parole. Or une famille durable n’est pas celle qui évite les tensions, mais celle qui accepte de les traverser sans renoncer à la conversation. En ce sens, le repas ne vaut pas parce qu’il serait silencieux ou parfait ; il vaut parce qu’il rend possible une forme de présence commune qui n’exige pas l’effacement des différences.
