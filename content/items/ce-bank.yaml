    La semaine dernière, la revue Audio public a publié un dossier sur l’usage de voix synthétiques dans les podcasts d’information. Le constat, d’abord, est difficile à balayer : pour les rédactions modestes, ces outils permettent de traduire rapidement un reportage, de préserver la voix d’un journaliste empêché, ou encore de rendre accessibles des archives que personne n’aurait le temps de reconstituer à la main. Le dossier évite donc le réflexe du procès immédiat.

    Il souligne toutefois que l’efficacité d’une voix clonée n’est pas un argument suffisant. Une voix n’est pas seulement un instrument sonore ; elle porte une présence, une hésitation, une manière d’occuper l’espace qui participe à la confiance accordée par l’auditeur. Dès lors, le problème n’est pas tant de savoir si l’outil est « moderne » ou non, mais ce qu’il devient lorsqu’on cesse de dire qu’il est utilisé. L’article insiste sur un point qui traverse l’ensemble du dossier : la transparence n’est pas un détail administratif, elle fait partie de la relation éditoriale.

    Le ton n’est ni alarmiste ni technophile. L’auteur admet qu’un média a tout intérêt à explorer ces procédés, surtout quand ils permettent de mieux diffuser une information déjà vérifiée. Mais il ajoute aussitôt que le public pardonne rarement d’être impressionné plus longtemps qu’il ne se sent informé. Autrement dit, la prouesse peut servir la diffusion ; elle ne remplace ni la signature, ni le contexte, ni l’aveu des limites.
