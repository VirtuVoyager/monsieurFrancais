    Les chaînes d’information en continu se félicitent souvent d’offrir au public une présence permanente : un événement à peine commencé, et déjà des images, des réactions, des commentaires. L’auteur de l’article reconnaît volontiers que cette rapidité répond à une attente réelle. Pourtant, il estime qu’elle a un coût élevé. À force de vouloir être les premières, ces chaînes donnent parfois l’impression d’expliquer un pays sans jamais lui laisser le temps de respirer. Le spectateur passe d’un sujet à l’autre avant d’avoir compris ce qui est en jeu.

