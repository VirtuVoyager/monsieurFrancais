    Il y a, dans certaines villes, une tentation permanente de se laisser guider par l’application la plus précise, comme si la précision dispensait de regarder. On suit la flèche bleue, on tourne au bon moment, on arrive vite ; puis on se rend compte qu’on n’a rien vu d’autre que l’écran. C’est à partir de ce constat qu’une autre pratique du voyage gagne du terrain : marcher sans carte, ou du moins sans demander à la carte de tout décider.

    Le propos n’est pas de faire l’éloge d’une errance romantique. Personne n’a envie de s’égarer pendant deux heures sous la pluie pour le plaisir de se dire libre. Mais il arrive que le détour ouvre ce que l’itinéraire fermé aurait effacé. Dans un quartier que l’on ne cherchait pas, un atelier de réparation, une cour d’école, un café trop calme au milieu d’une avenue bruyante donnent à la ville une cohérence plus juste que les attractions déjà classées.

    L’auteur raconte ainsi avoir raté une station de métro à Lisbonne, puis découvert, vingt minutes plus loin, une place où des retraités jouaient aux cartes sous des orangers. Ce n’est pas l’accident en lui-même qui compte, mais ce qu’il autorise : un ralentissement, une attention moins utilitaire, une disponibilité aux signes modestes. À cet égard, l’exemple n’a rien d’anecdotique ; il résume la thèse du texte. Se perdre un instant ne revient pas à perdre son temps, mais à cesser de le mesurer uniquement en efficacité.
