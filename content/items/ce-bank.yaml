    On se trompe souvent sur le cadeau en le traitant comme un objet comptable : tant d’euros, tant d’effort, tant d’affection supposée. C’est oublier que le geste d’offrir commence bien avant l’emballage. Il commence au moment où l’on prête attention à ce que l’autre aime, redoute, collectionne, oublie, évite ou remet à plus tard. Le cadeau n’est donc pas d’abord une démonstration de richesse ; il est une manière de dire : « je t’ai observé sans te réduire à une formule ».

    Cette idée dérange les industries qui vivent du mécanisme inverse, car elles préfèrent un présent standard, rapide, identifiable, échangeable. Le marché adore les occasions où l’on se sent obligé d’offrir sans savoir quoi choisir : il transforme l’embarras en chiffre d’affaires. Or plus le cadeau devient automatique, plus il risque de perdre ce qui faisait sa portée symbolique. Un objet coûteux peut être admirable ; il n’en est pas pour autant émouvant.

    Bien sûr, il serait naïf de prétendre que le prix n’a aucune importance. Il peut signifier du temps de travail, du soin, parfois un vrai sacrifice. Mais ce qu’un cadeau transmet le plus sûrement, ce n’est ni sa valeur marchande ni sa rareté : c’est l’idée qu’une relation mérite une forme singulière d’attention. C’est pourquoi certains présents modestes restent inoubliables, tandis que d’autres, pourtant somptueux, paraissent aussitôt interchangeables. La logique du don commence là où la consommation cesse de fournir la mesure.
