    Les défenseurs du dispositif soulignent un avantage simple : pendant la pause de midi, on se fait prendre la tension, on reçoit un conseil, on repère un risque sans perdre une demi-journée de travail. Mais l’auteure du rapport rappelle un point essentiel : un dépistage qui se contente de distribuer des chiffres ne change rien. Quand les résultats sont transmis sans explication ou que les salariés ne savent pas vers qui se tourner ensuite, l’effet retombe très vite.

    Le texte ne présente donc pas ces campagnes comme une solution miracle. Il les juge utiles, à condition qu’elles soient organisées avec discrétion, qu’elles débouchent sur un vrai suivi médical et qu’elles ne servent pas seulement à afficher de bons chiffres de prévention.
