  passage: |-
    Le dernier baromètre de la vie associative dans la région de Valmer est sans appel : 61 % des petites associations ont le sentiment de n’apparaître dans les médias qu’au moment d’une crise, d’un conflit ou d’un appel aux dons. Pour beaucoup de responsables, cette visibilité ponctuelle ne reflète pas le travail réel accompli tout au long de l’année. C’est précisément ce que défend l’auteur de l’article. Selon lui, les médias locaux ne manquent pas de sujets ; ils manquent de temps accordé au quotidien des structures, à leurs petites réussites, à leurs difficultés ordinaires.

    L’article cite plusieurs exemples : une association d’aide aux devoirs qui suit cent vingt enfants, un atelier de réparation qui évite des centaines d’objets jetés, un groupe de lecteurs qui maintient du lien dans un quartier isolé. Pourtant, aucun de ces projets n’a eu droit à une couverture durable. L’auteur en déduit que l’enjeu n’est pas seulement de « parler des associations », mais de les regarder autrement. Il ne s’agit pas de les célébrer à tout prix, encore moins de les transformer en objets d’émotion passagère. Il s’agit de montrer leur rôle continu dans la vie locale. C’est, selon lui, une condition pour que le public leur fasse confiance.
  prompt: Que déplore l’auteur ?
  options:
  - Que les associations refusent toute visibilité.
  - Que les lecteurs préfèrent exclusivement les rubriques sportives.
  - Que les médias ne suivent les associations qu’en cas de crise.
  - Que les projets associatifs manquent d’intérêt public.
  answer: 2
  explanation: 'Le texte dit que les associations n’apparaissent dans les médias qu’au moment des crises,
    des conflits ou des appels aux dons. Les autres propositions ne correspondent pas : l’auteur ne reproche
