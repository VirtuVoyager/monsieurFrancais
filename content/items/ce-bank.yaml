    Quand ma sœur a décidé de s’occuper davantage de notre mère, personne n’a vraiment contesté sa décision. On a simplement commencé à s’en remettre à elle. C’est souvent ainsi que les responsabilités familiales se déposent sur une seule personne : d’abord par reconnaissance, puis par habitude, enfin par oubli des autres. Ma sœur faisait les courses, prenait les rendez-vous, rappelait les médicaments, écoutait les mêmes inquiétudes, reprenait les mêmes explications. De l’extérieur, tout semblait tenir. De l’intérieur, le déséquilibre devenait de plus en plus visible.

    Je me suis longtemps dit qu’il fallait admirer sa patience. C’était vrai, bien sûr. Mais l’admiration n’empêche pas la fatigue, et la fatigue n’excuse pas toujours le silence de ceux qui regardent faire. Dans les réunions de famille, on louait son dévouement avec une sincérité qui avait quelque chose d’élégant : les mots compensaient ce que les gestes n’avaient pas pris en charge. Chacun se montrait soulagé qu’elle sache faire, qu’elle sache prévoir, qu’elle sache encaisser.

    Un jour, elle a cessé de répondre tout de suite au téléphone. Ce n’était pas un caprice ; seulement la première fissure dans une organisation que nous appelions soutien parce qu’il était plus confortable de ne pas l’appeler par son nom : une prise en charge à sens unique. Alors j’ai compris qu’il existe des équilibres familiaux qui ne tiennent pas par la solidarité, mais par la politesse de ceux qui se taisent.
