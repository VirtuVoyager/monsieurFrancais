  - Parce que les magasins refusent les nouveautés.
  answer: 2
  explanation: 'L’auteur dit explicitement que l’occasion n’est plus seulement une nécessité, mais un
    choix qui donne une image de soi et une distinction discrète. Les autres réponses déforment le texte
