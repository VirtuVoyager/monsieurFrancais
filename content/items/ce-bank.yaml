    Le vrai enjeu n’est donc pas de sacraliser l’IA ni de la condamner en bloc, mais de distinguer les usages. Faut-il générer dix versions d’un même slogan ou réserver les calculs lourds à des tâches réellement utiles ? Faut-il exiger des fournisseurs qu’ils publient leur consommation électrique et la part d’énergies renouvelables utilisée ? C’est à ces questions qu’il faut répondre si l’on veut éviter que la technologie ne progresse en silence, tandis que sa facture écologique est supportée par tous.
