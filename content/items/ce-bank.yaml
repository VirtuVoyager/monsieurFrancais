    On voudrait parfois faire de la saisonnalité une règle morale. Au restaurant comme à la maison, l’argument revient avec une telle force qu’il finit par donner mauvaise conscience à ceux qui ne s’y conforment pas. Pourtant, la question n’est pas si simple. Oui, choisir des produits de saison a du sens : on limite certains transports inutiles, on retrouve des goûts plus francs, on apprend à cuisiner avec ce que la terre offre à un moment donné. Mais transformer ce principe en test de vertu relève d’une autre logique, plus discutable.

    Car une cuisine vraiment responsable ne se réduit pas à la date inscrite sur l’étal. Elle inclut la manière de produire, de conserver, de distribuer et, surtout, de consommer sans gaspiller. Qu’importe, au fond, la provenance d’une courgette si la moitié du panier finit à la poubelle ? Qu’importe la framboise locale si elle est cultivée sous serre chauffée toute l’année, au nom d’une pureté de façade ? L’auteur de ces lignes n’ignore pas les limites des circuits longs ; il se méfie seulement des récits trop confortables.

    À force d’opposer le « bon » et le « mauvais » choix, on oublie que la cuisine est aussi affaire de contexte : budget, climat, habitudes, santé, accès aux produits. Le vraisemblable n’est pas toujours le plus exemplaire, et l’exemplaire n’est pas toujours le plus réaliste. C’est pourquoi la saison ne devrait pas servir d’ultime verdict, mais de point de départ pour penser plus largement ce que l’on met dans son assiette.
