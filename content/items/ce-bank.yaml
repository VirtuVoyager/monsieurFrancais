  passage: |-
    Dans les kiosques de la ville d’Aubéval, le petit hebdomadaire Le Trait d’Union semble aller à contre-courant. Alors que 68 % des habitants disent s’informer d’abord sur les réseaux sociaux, le journal papier a pourtant gagné 12 % d’abonnés en deux ans. Pourquoi ? Parce qu’il ne cherche ni le buzz ni la polémique. Ses pages accueillent les annonces des associations, les comptes rendus des conseils de quartier et les portraits de bénévoles. Selon une enquête interne, 41 % des lecteurs disent avoir découvert au moins une initiative locale grâce à ce titre. Depuis que le journal réserve chaque semaine un encart gratuit aux associations, les inscriptions aux activités de quartier ont progressé de 23 %.

    L’auteur de l’article ne cache pas sa position : à ses yeux, la presse locale ne doit pas copier les grands médias, encore moins les plateformes rapides qui publient avant de vérifier. Elle sert surtout à relier des habitants qui ne se croiseraient pas autrement. Dans une époque où chacun reçoit des informations différentes, parfois contradictoires, ce travail patient de tri et de mise en lien devient précieux. Le Trait d’Union n’est pas seulement un journal ; c’est un espace commun.
  prompt: Pourquoi, selon l’auteur, l’hebdomadaire garde-t-il sa place ?
  options:
  - Parce qu’il remplace les réseaux sociaux.
  - Parce qu’il consacre surtout ses pages au sport national.
  - Parce qu’il publie plus vite que les sites d’actualité.
  - Parce qu’il relaie la vie associative avec fiabilité.
  answer: 3
  explanation: 'L’article insiste sur l’encart gratuit, les initiatives locales découvertes par les lecteurs
    et le rôle de lien social. Les autres propositions contredisent le texte : le journal ne remplace
    pas les réseaux sociaux, ne traite pas surtout de sport national et ne mise pas sur la vitesse.'
- slug: ce-b2-podcast-associatif
  cefr: B2
  origin: generated
  focus: place du numérique
  passage: |-
    Au départ, l’idée paraissait modeste : enregistrer chaque mois une conversation de quinze minutes avec des responsables d’associations de quartier. Un an plus tard, le podcast Voix solidaires compte plus de huit mille écoutes et, surtout, il a changé la façon dont plusieurs structures présentent leur action. D’après les chiffres publiés par la coordination qui pilote le projet, 54 % des associations participantes disent avoir reçu davantage de demandes d’information après la diffusion d’un épisode. Chez les moins de trente-cinq ans, la curiosité est plus forte encore : sept auditeurs sur dix déclarent avoir découvert une association dont ils ignoraient l’existence.

    L’auteur voit là un signe encourageant, mais refuse l’enthousiasme naïf. Un podcast, écrit-il, donne envie d’écouter ; il ne crée pas à lui seul de l’engagement. Les structures qui obtiennent les meilleurs résultats sont celles qui prolongent l’écoute par une rencontre, une permanence ou une visite sur place. Autrement dit, le numérique sert d’appel, pas de substitut. Là où le projet fonctionne, c’est quand la parole enregistrée ouvre vers du concret. Sans cela, l’audio reste une consommation discrète, facilement oubliée.
  prompt: Quelle idée ressort de l’article ?
  options:
  - Le podcast suffit à lui seul pour recruter.
  - Le podcast intéresse surtout les plus de trente-cinq ans.
  - Le podcast a été abandonné après un an.
  - Le podcast attire, mais ne remplace pas le contact direct.
  answer: 3
  explanation: 'L’auteur dit clairement que le podcast « donne envie d’écouter » mais qu’il doit être
    prolongé par une rencontre ou une visite. Les autres réponses sont incompatibles avec les données
    : l’engagement n’est pas automatique, les jeunes sont les plus concernés et le projet continue.'
- slug: ce-b2-campagne-locale
  cefr: B2
  origin: generated
  focus: efficacité des supports
  passage: |-
    À la fin de l’hiver, l’association Mains solidaires devait recruter en urgence des bénévoles pour ses distributions alimentaires. Son équipe de communication n’a pas parié sur un seul canal. Elle a diffusé un bref message sponsorisé sur les réseaux sociaux, distribué mille cinq cents flyers dans les commerces et obtenu deux interviews sur une radio locale. Résultat : en trois semaines, 480 personnes ont rempli le formulaire d’inscription, soit presque le double de l’année précédente.

    Le détail le plus intéressant, selon l’auteur, tient à la répartition des réponses. Les jeunes ont surtout réagi aux messages en ligne ; les plus de cinquante ans ont davantage retenu la radio et le papier. L’association a donc touché des publics différents avec des outils différents. L’article en tire une leçon assez nette : dans le domaine associatif, l’efficacité ne dépend pas d’un support miracle, mais de la cohérence entre plusieurs supports. Le numérique donne de la portée, le papier rassure, et la radio localise le message. Quand ces trois canaux se renforcent au lieu de se concurrencer, la campagne gagne en crédibilité et en efficacité.
  prompt: Que montre surtout cette campagne ?
  options:
  - Que les réseaux sociaux suffisent pour recruter.
  - Que les flyers sont devenus inutiles.
  - Qu’un mélange de supports touche davantage de publics.
  - Que la radio locale remplace les autres moyens.
  answer: 2
  explanation: 'L’article explique que chaque canal a atteint un public différent et conclut qu’ils se
    renforcent ensemble. Les autres réponses simplifient ou déforment le constat : les réseaux sociaux
    ne suffisent pas, les flyers restent utiles et la radio ne remplace pas les autres moyens.'
- slug: ce-b2-journal-et-associations
