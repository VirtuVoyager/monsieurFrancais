    repose sur une idée trop étroite de la nature en ville. Les abeilles, les oiseaux, les vers de terre
    ou les plantes spontanées ne sont pas décoratifs. Ils forment un réseau discret qui filtre l’eau,
    rafraîchit les sols, limite certaines maladies des plantes et signale l’état général d’un quartier.
    C’est pourquoi les corridors écologiques ne servent pas seulement à sauver quelques espèces emblématiques.
    Ils relient des espaces fragmentés pour que les fonctions du vivant continuent de circuler. Si nous
    insistons sur les espèces discrètes, ce n’est pas par romantisme : c’est parce qu’elles rendent visible
    ce que l’on ne voit pas quand tout fonctionne mal. Une ville qui oublie ces liens devient plus fragile,
