  audio_text: |-
    - Vous voulez vraiment supprimer l’examen terminal ?
    - Le supprimer, non. Lui rendre sa juste place, oui. Aujourd’hui, on lui attribue un pouvoir excessif : en une épreuve de trois heures, on prétend mesurer une année entière de travail. Or un élève peut réussir ce jour-là sans avoir consolidé ses acquis, et un autre échouer sous l’effet du stress alors qu’il maîtrise la matière.
    - Vous proposez donc de multiplier les notes ?
    - Pas seulement. Je préfère une évaluation répartie dans le temps : un projet, des retours réguliers, une présentation orale. Ainsi, on observe la progression, la capacité à corriger ses erreurs, à collaborer, à argumenter. Le problème n’est pas de faire travailler davantage les enseignants, c’est d’éviter qu’un unique moment décide de tout.
    - En somme, vous considérez que l’examen actuel valorise trop la mémoire immédiate ?
