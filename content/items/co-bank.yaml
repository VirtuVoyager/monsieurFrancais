    de quartier. L’idée n’est pas de refaire les cours ni de transformer les bénévoles en professeurs.
    Il s’agit d’offrir un lieu stable, du matériel et surtout des adultes qui aident à s’organiser : comprendre
    la consigne, préparer un exposé, apprendre à chercher une source fiable. Ce cadre n’est pas spectaculaire,
    mais il compense une différence très concrète. Quand on dit qu’un élève doit travailler seul, on oublie
