- slug: co-b2-charges-de-copropriete
  cefr: B2
  origin: generated
  focus: argument économique
  audio_text: 'Dans une copropriété ancienne, on raisonne souvent en années de charges, pas en investissement.
    Pourtant, quand les fenêtres fuient, que l’isolation est faible et que la chaudière vieillit, reporter
    les travaux finit par coûter plus cher. Les copropriétaires que nous avons rencontrés ont voté une
    rénovation globale après plusieurs assemblées difficiles. Résultat : moins de pannes, des factures
    plus stables et, surtout, des appartements plus faciles à louer ou à revendre. Bien sûr, la dépense
    initiale reste lourde, et c’est ce qui bloque beaucoup de gens. Mais croire qu’on économise en ne
    faisant rien est souvent une illusion.'
  prompt: Que veut montrer le journaliste ?
  options:
  - Les travaux sont coûteux au départ, mais rentables à terme
  - Les charges baissent toujours immédiatement après les travaux
  - Il faut éviter toute rénovation
  - La vente d'un appartement dépend surtout du quartier
  answer: 0
  explanation: Le document insiste sur le fait que reporter les travaux « finit par coûter plus cher »
    et que la rénovation améliore les factures et la valeur du bien. Les autres options ne reprennent
    pas cette logique économique.
- slug: co-b2-bureau-sans-cloisons
  cefr: B2
  origin: generated
  focus: cause des difficultés
  audio_text: |-
    - On entend souvent que les bureaux ouverts améliorent la communication. Vous êtes d’accord ?
    - Pas si on les installe sans réflexion. Dans notre rédaction, le problème n’était pas l’absence de murs, mais la multiplication des interruptions : appels sur haut-parleur, réunions improvisées, messages urgents à toute heure. Nous avons donc gardé l’espace ouvert, mais ajouté des règles simples : des plages sans réunion, des salles pour téléphoner et des consignes claires pour les cas où il faut se concentrer. Depuis, les équipes se plaignent moins. Ce n’est donc pas le concept qui pose problème, mais l’usage qu’on en fait.
  prompt: Quelle est, selon lui, la vraie cause des difficultés ?
  options:
  - Les locaux trop petits
  - Le manque de règles communes
  - Le bruit des ordinateurs
  - L’idée du bureau ouvert
  answer: 1
  explanation: Il précise que le problème vient des interruptions et du manque d’organisation, non du
    bureau ouvert lui-même. Les autres réponses reprennent des éléments possibles, mais ils ne sont pas
    présentés comme la cause principale.
- slug: co-b2-habitat-participatif
  cefr: B2
  origin: generated
  focus: contrainte collective
  audio_text: 'Quand on parle d’habitat participatif, on imagine parfois une communauté un peu idéaliste.
    En réalité, les habitants que nous avons rencontrés sont très concrets : ils veulent mutualiser une
    buanderie, partager un jardin, décider ensemble de certains aménagements. Le projet attire des personnes
    qui cherchent du lien, mais pas au prix de leur indépendance. Il demande surtout du temps, beaucoup
    de discussions et une vraie capacité à trancher collectivement. C’est justement ce qui décourage certains
    candidats : on n’achète pas seulement un logement, on accepte aussi un mode de fonctionnement. Ceux
    qui restent disent souvent qu’ils y trouvent un équilibre qu’un immeuble classique ne leur offrait
    pas.'
  prompt: Que faut-il accepter dans ce type de logement ?
  options:
  - Prendre des décisions collectives
  - Avoir un jardin privé
  - Ne jamais discuter les règles
  - Acheter un logement neuf
  answer: 0
  explanation: Le document insiste sur le fait qu’il faut « décider ensemble » et accepter un « mode de
    fonctionnement ». Les distracteurs s’éloignent de cette idée de gestion collective.
- slug: co-b2-diagnostic-energetique
  cefr: B2
  origin: generated
  focus: conséquence du retard
  audio_text: |-
    - Vous dites souvent aux propriétaires d’anticiper. Pourquoi ?
    - Parce que le marché a changé plus vite que prévu. Un logement mal classé se loue désormais plus difficilement, et les locataires comparent beaucoup mieux qu’avant. Beaucoup de bailleurs pensent encore qu’ils pourront attendre le dernier moment, puis ajuster le prix. En réalité, les acheteurs et les locataires regardent déjà la consommation, le confort d’hiver et le montant des travaux à prévoir. Quand on tarde trop, on perd du temps et parfois de la valeur. Il vaut mieux rénover progressivement que subir la baisse de demande.
