    n''est plus seulement l''emploi du temps : c''est la répartition des tâches. Quand tout repose sur
    la même personne, elle choisit naturellement les solutions les plus rapides, pas forcément les plus
    équilibrées. Parler d''alimentation, c''est donc aussi parler de partage et d''organisation collective.
    Sinon, on parle d''équilibre alimentaire sans regarder qui porte réellement la charge. C''est là que
