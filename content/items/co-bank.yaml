  audio_text: |-
    - Je ne suis pas opposée aux outils d’IA, mais je refuse qu’on les présente comme une baguette magique.
    - Pourtant, vos étudiants les utilisent déjà pour rédiger plus vite.
    - Justement. Qu’ils les utilisent, oui, mais pas pour masquer ce qu’ils ne comprennent pas. Quand un étudiant s’en sert pour dégager des idées, reformuler un plan ou repérer des incohérences, l’outil peut être utile. En revanche, s’il copie une réponse sans la discuter, il perd l’occasion d’apprendre.
    - Vous voulez donc encadrer l’usage plutôt que l’interdire ?
    - Exactement. Je demande simplement qu’ils indiquent ce que la machine a apporté, puis qu’ils expliquent leurs choix avec leurs propres mots. L’intérêt n’est pas d’obtenir un texte impeccable ; il est de rendre visible la réflexion. Si nous acceptons l’IA sans exigence, nous ne savons plus ce qui relève de l’étudiant et ce qui relève de la machine. Or, à l’université, ce qui compte, ce n’est pas seulement le résultat, c’est la capacité à justifier ce résultat.
  prompt: Quelle condition la professeure juge-t-elle indispensable ?
  options:
  - En expliquer l’apport
