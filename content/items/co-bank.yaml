- slug: co-c1-campagne-sante-mentale
  cefr: C1
  origin: generated
  focus: objectif d’un organisme
  audio_text: 'Quand nous avons lancé l’Observatoire Bien-Être au Travail, nous ne voulions pas publier
    un énième guide qui finit sur une étagère. Notre problème était plus simple et plus grave : dans beaucoup
    d’entreprises, les signaux de détresse passent pour de la fatigue ordinaire. On attend que la personne
    s’isole, s’énerve ou s’absente longtemps pour réagir. Or, à ce stade, l’accompagnement devient plus
    lourd, pour elle comme pour l’équipe. C’est pourquoi notre nouvelle campagne, Parlons tôt, ne s’adresse
    pas d’abord aux psychologues, mais aux managers, aux représentants du personnel et aux collègues.
    Nous leur proposons des repères très concrets : une baisse brutale d’attention, un désengagement soudain,
    des phrases comme je n’y arrive plus. Nous ne promettons pas de diagnostiquer à distance ni de remplacer
    les professionnels. Nous voulons créer un réflexe simple : oser ouvrir la conversation avant que la
    situation ne se dégrade. Si la parole circule plus tôt, les personnes concernées acceptent plus facilement
    de consulter.'
  prompt: Quel est l’objectif principal de cette campagne ?
  options:
  - Aider à repérer plus tôt la détresse
  - Proposer une psychothérapie gratuite
  - Évaluer les managers
  - Remplacer les professionnels
  answer: 0
  explanation: 'La locutrice dit clairement qu’elle veut « ouvrir la conversation avant que la situation
    ne se dégrade » et faire repérer les signes de détresse plus tôt. Les autres propositions sont écartées
    dans le texte : il ne s’agit ni d’offrir des soins gratuits, ni d’évaluer les managers, ni de remplacer
    les professionnels.'
- slug: co-c1-plan-de-fraicheur
  cefr: C1
  origin: generated
  focus: implicite
  audio_text: |-
    - Votre projet de quartier frais a été présenté comme une réponse aux vagues de chaleur. Pourtant, certains habitants disent que planter quelques arbres ne changera pas grand-chose.
    - Ils ont raison si l’on croit qu’un arbre, à lui seul, règle le problème. Nous, on parle d’un ensemble : ombrage, matériaux plus clairs, cours d’école ouvertes au public et surtout réduction des surfaces qui emmagasinent la chaleur.
    - Donc vous n’êtes pas opposé aux arbres ?
    - Bien au contraire. Mais si l’on se contente de verdir une place déjà surchauffée, on se donne bonne conscience. Les canicules exigent de repenser la circulation de l’air, les façades et l’usage des bâtiments.
    - On vous reproche aussi d’être trop prudent sur l’interdiction des voitures ?
    - Je dis simplement que, dans ce dossier, la voiture n’est qu’un facteur parmi d’autres. Si l’on veut protéger les plus fragiles, il faut agir sur plusieurs fronts, sinon on déplace le problème au lieu de le résoudre.
  prompt: Que défend surtout le monsieur ?
  options:
  - Une réponse globale
  - La priorité aux arbres
  - Le retour des climatiseurs
  - L’interdiction immédiate des voitures
  answer: 0
  explanation: 'Il répète qu’il faut agir sur « un ensemble » et « plusieurs fronts » : bâtiments, ombrage,
    matériaux, circulation de l’air. Les autres réponses ne conviennent pas, car il ne mise ni sur les
    seuls arbres, ni sur les climatiseurs, ni sur une interdiction immédiate des voitures.'
- slug: co-c1-depistage-cible
  cefr: C1
  origin: generated
  focus: structure de l’argumentation
  audio_text: 'On entend souvent que les campagnes de dépistage inquiètent inutilement les gens, qu’elles
    fabriquent des faux positifs et des examens supplémentaires. L’objection n’est pas absurde. Si l’on
    dépiste sans discernement, on trouve des anomalies qui n’auraient peut-être jamais évolué. Mais c’est
    justement là que la discussion devient sérieuse : faut-il renoncer pour autant à tout dépistage ?
    Évidemment non. Il faut distinguer les programmes massifs, peu ciblés, des stratégies fondées sur
    l’âge, les antécédents et la qualité du suivi. Lorsqu’un test est proposé au bon moment et avec une
    information claire, il permet de détecter plus tôt des maladies qui, sans cela, seraient prises en
    charge trop tard. Autrement dit, le vrai enjeu n’est pas de choisir entre alarme et déni ; il est
    de concevoir des dispositifs précis, lisibles et accompagnés. Ce n’est pas le principe du dépistage
    qu’il faut condamner, c’est son usage approximatif.'
  prompt: Comment le chroniqueur construit-il son propos ?
  options:
  - Il compare deux hôpitaux
  - Il part d’une objection pour la nuancer
  - Il raconte une expérience personnelle
  - Il présente un nouveau médicament
  answer: 1
  explanation: 'Le texte commence par une objection fréquente, puis la discussion est progressivement
    nuancée par des conditions de dépistage plus précises. Les autres options sont fausses : il n’y a
    ni comparaison d’établissements, ni récit personnel, ni présentation d’un médicament.'
- slug: co-c1-compost-de-quartier
  cefr: C1
  origin: generated
  focus: rôle d’un organisme
  audio_text: 'Quand on parle de biodéchets, beaucoup de gens imaginent un effort supplémentaire imposé
    aux habitants. C’est l’inverse que nous avons essayé de faire avec l’association Terre Commune. Notre
    équipe accompagne les immeubles qui veulent transformer leurs déchets de cuisine en ressource locale.
    Nous commençons par les volontaires : une résidence pilote, quelques bacs bien placés, des consignes
    très simples, puis un suivi pendant trois mois. L’idée n’est pas de moraliser, encore moins de contrôler
    les ménages. Nous aidons les copropriétés à réduire le volume des poubelles, mais aussi à produire
    un compost utilisable dans les jardins partagés, les pieds d’immeubles ou les écoles du quartier.
    À terme, nous formons des référents parmi les habitants eux-mêmes, afin que le système tienne sans
    dépendre de nous. Notre rôle est donc double : rendre le tri praticable et montrer qu’un déchet organique
    peut redevenir une matière utile.'
  prompt: Quel est le rôle de l’association Terre Commune ?
  options:
  - Ramasser les ordures ménagères
  - Accompagner le compostage de quartier
  - Vendre des bacs de cuisine
  - Organiser des jardins d’enfants
  answer: 1
  explanation: 'L’association dit qu’elle accompagne les immeubles, forme des référents et aide à produire
    du compost local : son rôle est donc d’organiser le compostage de quartier. Elle ne se charge pas
    de la collecte des déchets, ne vend pas de matériel et n’organise pas des activités pour enfants.'
- slug: co-c1-soins-de-proximite
  cefr: C1
  origin: generated
  focus: implicite
  audio_text: |-
    - Depuis l’ouverture de la navette médicale, on voit moins de rendez-vous manqués.
