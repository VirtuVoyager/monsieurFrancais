    pas : il ne critique ni le coût de la navette, ni le goût des patients pour l’hôpital, ni le principe
    de la prévention.'
- slug: co-c1-eau-du-robinet
  cefr: C1
  origin: generated
  focus: objectif d’une campagne
  audio_text: 'Dans plusieurs villes, on a longtemps laissé le marché des bouteilles décider de notre
    manière de boire. Or l’eau du robinet n’est ni un slogan ni un gadget écologique ; c’est un service
    public qui doit être visible et digne de confiance. C’est pourquoi la campagne lancée par Eau Claire
    ne se limite pas à dire : Buvez local. Elle installe des fontaines dans les lieux de passage, publie
    les résultats des analyses dans un langage compréhensible et répond aux inquiétudes sur le goût ou
    la qualité. Le but n’est pas de culpabiliser les personnes qui achètent encore de l’eau en bouteille.
    Il est plutôt de rappeler qu’une ressource déjà traitée, contrôlée et distribuée partout peut rester
    le premier réflexe, à condition qu’on la rende accessible et lisible. En réduisant les achats de plastique,
    on agit certes sur les déchets, mais on redonne aussi de la valeur à un bien commun que beaucoup utilisent
    sans y penser.'
  prompt: Quel est l’objectif principal de cette campagne ?
  options:
  - Rassurer sur l’eau du robinet
  - Interdire les bouteilles
  - Augmenter le prix de l’eau
  - Remplacer les analyses
  answer: 0
  explanation: Le document insiste sur la confiance, l’accessibilité et la lisibilité des contrôles pour
    faire de l’eau du robinet un réflexe. Il n’est nulle part question d’interdire les bouteilles, de
    changer le prix de l’eau ou de supprimer les analyses.
- slug: co-c1-reflexe-antibiotique
  cefr: C1
  origin: generated
  focus: structure de l’argumentation
  audio_text: 'Chaque hiver, le même réflexe revient : dès qu’une gorge brûle ou qu’un nez coule, certains
    réclament des antibiotiques comme on demanderait une assurance supplémentaire. C’est précisément contre
    ce réflexe que je veux revenir. Oui, personne n’aime être malade ; oui, attendre plusieurs jours quand
    on se sent faible n’a rien d’agréable. Mais transformer un inconfort en traitement systématique est
    une erreur. Les antibiotiques ne sont pas des calmants, et les utiliser à tort affaiblit leur efficacité
    pour les situations où ils sont vraiment indispensables. L’enjeu n’est donc pas de prôner la patience
    par principe, ni de nier la peur des complications. Il est de rappeler qu’une grande partie des infections
    hivernales sont virales et guérissent sans ce type de médicament. Si je commence par reconnaître l’impatience
    du patient, c’est pour mieux montrer que le bon choix n’est pas de céder à la demande immédiate, mais
    d’expliquer quand un traitement est utile et quand il ne l’est pas.'
  prompt: Comment le chroniqueur organise-t-il son argumentation ?
  options:
  - Il compare deux services hospitaliers
  - Il raconte en détail l’histoire d’un patient malade
  - Il part d’un réflexe courant pour le remettre en cause
  - Il présente un nouveau médicament contre la grippe
  answer: 2
  explanation: Le chroniqueur commence par évoquer une demande très répandue, puis il montre pourquoi
    ce réflexe est discutable et dans quels cas il faut le corriger. Les autres propositions ne conviennent
    pas, car il ne compare pas des services, ne raconte pas une histoire particulière et ne fait pas la
    promotion d’un médicament.
- slug: co-c1-corridors-ecologiques
  cefr: C1
  origin: generated
  focus: implicite
  audio_text: 'Quand on parle de biodiversité urbaine, on me répond souvent : D’accord pour les abeilles,
