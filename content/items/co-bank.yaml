    - Vous pensez donc que le problème n’était pas seulement financier ?
    - Non. Quand le centre le plus proche est à une heure de bus, le moindre contrôle devient compliqué. On parle beaucoup de prévention, mais si l’on oblige les gens à parcourir tant de kilomètres, on les pousse à attendre que ça aille vraiment mal.
    - La navette ne fait pas de miracles.
    - Non, mais elle rappelle une chose simple : l’accès aux soins n’est pas abstrait ; il dépend aussi des trajets, des horaires et de l’énergie qu’il faut pour consulter.
  prompt: Que sous-entend le monsieur ?
