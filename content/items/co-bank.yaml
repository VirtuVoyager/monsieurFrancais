    s’en rende compte. Dans ce contexte, former les salariés n’est pas un luxe ni un avantage accessoire.
    C’est une manière de préserver une expertise collective. Quand un employé expérimenté part à la retraite,
    il emporte avec lui des gestes, des réflexes, des astuces qu’aucun mode d’emploi ne remplace. Nous
    avons donc mis en place un programme où les plus anciens transmettent leurs méthodes, pendant que
    les plus jeunes apportent leur aisance avec les outils numériques. Le but n’est pas d’obtenir un certificat
    de plus, ni d’imposer un cursus uniforme. Il s’agit d’accompagner une transition réelle, afin que
    chacun puisse tenir son poste sans se retrouver dépassé par les changements. En somme, nous investissons
    dans la formation pour que la transformation des métiers ne se fasse pas contre les personnes, mais
