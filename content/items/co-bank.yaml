  audio_text: |-
    - Votre équipe a testé la semaine de quatre jours. Est-ce que cela a vraiment amélioré les choses ?
    - Oui, mais à certaines conditions. Si on garde les mêmes réunions, les mêmes délais et les mêmes habitudes, on ne gagne rien. En revanche, quand on revoit les priorités, qu’on élimine le superflu et qu’on répartit mieux les tâches, les salariés sont plus concentrés et les résultats restent bons. Il ne s’agit donc pas de travailler moins en faisant simplement la même chose sur une période plus courte. Il faut accepter de réorganiser le service, sinon la mesure devient surtout un slogan.
