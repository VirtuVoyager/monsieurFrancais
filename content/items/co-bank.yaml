  audio_text: 'Dans plusieurs quartiers, des élèves rentrent chez eux dans des conditions très différentes.
    Certains disposent d’une chambre calme, d’un ordinateur, parfois d’un parent pour relire une consigne.
    D’autres travaillent sur la table de la cuisine, au milieu du bruit, ou partagent un seul appareil
