- slug: co-b2-cv-anonymes
  cefr: B2
  origin: generated
  focus: utilité limitée
  audio_text: |-
    - Bonjour, votre entreprise a commencé à anonymiser les CV. Est-ce que cela change vraiment la donne ?
    - Oui, mais pas autant qu’on le croit. Cela évite certains réflexes de tri au premier regard, c’est vrai. En revanche, si l’entretien est mené sans méthode, les biais reviennent très vite. De plus, certaines expériences montrent que les compétences seules ne suffisent pas à décider d’un recrutement solide : il faut aussi vérifier la façon de travailler en équipe, la motivation, la capacité à s’adapter. Nous avons donc gardé l’anonymat pour la présélection, puis revu nos entretiens avec une grille commune. Autrement dit, l’anonymat aide à ouvrir la porte, mais il ne remplace pas le reste.
