- slug: co-c1-centre-numerique
  cefr: C1
  origin: generated
  focus: objectif du dispositif
  audio_text: 'Dans notre centre, nous recevons chaque jour les mêmes demandes : changer un mot de passe,
    retrouver un formulaire, comprendre une démarche. Jusqu’ici, ces questions simples encombraient nos
    agents, qui passaient parfois plus de temps à répéter la même explication qu’à traiter les cas vraiment
