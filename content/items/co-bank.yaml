  focus: avis sur l'application
  audio_text: J'ai repris des études le soir, après le travail, et j'avais besoin d'un outil simple. L'application
    que j'utilise maintenant me permet de faire de courtes révisions dans le métro, puis de retrouver
    mes erreurs plus tard. J'aime aussi les rappels automatiques, parce qu'ils m'évitent d'oublier mes
    séances. Ce n'est pas magique, mais pour quelqu'un qui manque de temps, c'est un vrai soutien.
  prompt: Quelle est son opinion sur l'application ?
  options:
  - elle est trop compliquée
  - elle l'aide beaucoup
  - elle remplace les cours
  - elle coûte trop cher
  answer: 1
  explanation: 'La personne dit qu''elle peut réviser partout, retrouver ses erreurs et s''organiser grâce
    à l''application : elle l''aide donc beaucoup. Rien dans le témoignage ne parle d''un prix élevé,
    d''une complexité excessive ou d''un remplacement des cours.'
- slug: co-b2-parrainage-local
  cefr: B2
  origin: generated
  focus: limites des cours
  audio_text: |-
    - Bonjour, vous coordonnez le programme de parrainage pour les nouveaux arrivants. À quoi sert-il exactement ?
    - À éviter qu'ils restent seuls après les premières démarches. Un cours de langue aide, bien sûr, mais il ne dit pas comment trouver une garderie, comprendre un bail ou oser demander un renseignement.
    - Donc vous pensez que les cours ne suffisent pas ?
    - Ils sont indispensables, mais ils laissent de côté tout ce qui relève des habitudes, des codes, de la confiance.
    - C'est pour cela que vous mettez les personnes en binôme avec des habitants du quartier ?
    - Oui. Le but n'est pas de faire à leur place. C'est de leur donner un contact régulier, quelqu'un qui explique, qui accompagne une ou deux fois, puis qui les laisse agir.
    - Finalement, c'est aussi une manière de créer des liens durables ?
    - Exactement. Si, après six mois, ils connaissent déjà une association, une école et un voisin, le programme a réussi.
  prompt: Que pense-t-il des cours de langue ?
  options:
  - Qu'ils suffisent pour s'intégrer.
  - Qu'ils doivent remplacer le parrainage.
  - Qu'ils sont utiles, mais incomplets.
  - Qu'ils concernent surtout les enfants.
  answer: 2
  explanation: Il dit clairement que les cours sont « indispensables », mais qu’ils ne couvrent pas tout
    ce qui touche aux codes et à la confiance. Les autres propositions contredisent cette nuance ou déplacent
    le sujet vers le parrainage ou les enfants.
- slug: co-b2-langue-au-travail
  cefr: B2
  origin: generated
  focus: rôle de l'entreprise
  audio_text: 'On demande souvent aux personnes immigrées de suivre des cours du soir, comme si cela réglait
    tout. En réalité, beaucoup travaillent en horaires décalés, gardent leurs enfants ou enchaînent plusieurs
    emplois. Dans ces conditions, venir deux soirs par semaine n''est pas toujours possible. Ce qui accélère
    vraiment l''apprentissage, c''est d''avoir aussi des occasions de parler au travail : une consigne
    expliquée calmement, un collègue qui corrige sans juger, un chef d''équipe qui accepte quelques minutes
    de plus au début. Les entreprises disent parfois qu''elles ne peuvent pas se mêler de formation linguistique.
    Pourtant, elles créent déjà les conditions de l''exclusion ou de l''intégration. Si elles veulent
    garder leurs salariés, elles ont intérêt à leur donner du temps et des situations concrètes pour progresser.'
  prompt: Quelle solution défend-il ?
  options:
  - Des cours obligatoires le soir.
  - Un soutien aussi au travail.
  - Des contrôles plus stricts.
  - Un apprentissage uniquement en ligne.
  answer: 1
  explanation: 'Le locuteur explique que l’apprentissage progresse quand l’entreprise offre du temps et
    des situations concrètes pour parler. Les autres réponses ne correspondent pas à son argument : il
    ne propose ni obligation du soir, ni contrôle, ni formation seulement en ligne.'
- slug: co-b2-bibliotheque-ouverte
  cefr: B2
  origin: generated
  focus: premier contact
  audio_text: |-
    - Dans votre bibliothèque, on voit des ateliers pour les nouveaux arrivants. Est-ce vraiment utile ?
    - Au début, je me posais la même question. Puis j'ai vu que beaucoup de personnes n'osent pas franchir la porte d'un équipement culturel. Elles viennent pour imprimer un document, chercher une adresse, et repartent si personne ne leur parle.
    - Et vos ateliers changent cela ?
    - Oui. Nous proposons des lectures très simples, un club de conversation, parfois des jeux avec les enfants. Ce n'est pas spectaculaire, mais cela donne un premier point d'appui.
    - Vous pensez donc que la bibliothèque remplit une mission sociale ?
    - Une mission parmi d'autres. Elle ne remplace ni l'école ni les associations. En revanche, c'est souvent l'endroit où quelqu'un se sent enfin autorisé à poser une question.
  prompt: Quel est son point de vue sur la bibliothèque ?
  options:
  - Elle peut servir de porte d'entrée.
  - Elle doit remplacer l'école.
  - Elle est utile seulement pour les enfants.
  - Elle devrait supprimer les livres difficiles.
  answer: 0
  explanation: Il présente la bibliothèque comme un lieu où l’on ose entrer et poser une question, donc
    comme une porte d’entrée. Il précise aussi qu’elle ne remplace ni l’école ni les associations, ce
    qui exclut les autres options.
- slug: co-b2-fete-de-quartier
  cefr: B2
  origin: generated
  focus: fonction du festival
  audio_text: 'Dans le quartier de Montlierre, le festival de rue attire chaque année des habitants qui
    ne se parlaient jamais. Les organisateurs y voient un moyen simple de lancer des contacts : une scène,
    des stands, des repas préparés par des familles venues d''ailleurs et des anciens du quartier. Mais
    ils se gardent bien de présenter l''événement comme une solution miracle. « Un concert de deux heures
    ne suffit pas à créer un sentiment d''appartenance », explique le responsable. Selon lui, ce type
    de fête ouvre la porte, donne envie de revenir, puis il faut des lieux plus réguliers : ateliers sportifs,
    réunions d''école, jardin partagé. En d''autres termes, le festival n''est pas la fin du travail,
    c''est le début.'
  prompt: Quelle est l'attitude du responsable ?
  options:
  - Il juge la fête suffisante.
  - Il préfère supprimer les activités collectives.
  - Il pense qu'elle coûte trop cher.
  - Il la voit comme un point de départ.
  answer: 3
  explanation: Le responsable dit explicitement que le festival « ouvre la porte » et que « c’est le début
    », pas la fin. Les autres propositions contredisent cette idée ou ajoutent un reproche financier absent
    du document.
- slug: co-b2-theatre-mobile
  cefr: B2
  origin: generated
  focus: public actif
  audio_text: |-
    - Votre troupe joue dans des salles minuscules et parfois dans des gymnases. Est-ce un choix par défaut ?
    - Pas seulement. Nous voulons aller vers des publics qui ne viennent jamais au théâtre. Mais je ne crois pas qu'il suffise d'offrir un spectacle gratuit pour que les gens se sentent concernés.
    - Qu'est-ce qui manque alors ?
    - Le temps d'échanger. Après la représentation, nous restons pour discuter, et parfois le public choisit la seconde partie du programme. Quand quelqu'un propose un thème ou raconte ce qu'il a compris, il devient plus qu'un simple spectateur.
    - Donc vous cherchez moins à remplir la salle qu'à créer une expérience commune ?
    - Exactement. Si les gens repartent avec l'impression d'avoir été consultés, même un peu, ils reviendront. Sinon, le théâtre n'est qu'une sortie de plus.
  prompt: Qu'est-ce qui compte le plus pour lui ?
  options:
  - La gratuité des spectacles.
  - La participation du public.
  - Le nombre de représentations.
  - La longueur des pièces.
  answer: 1
  explanation: Il insiste sur l’échange après la représentation, sur le choix du programme et sur le fait
    d’être « consultés ». Les autres réponses ne correspondent pas à ce qu’il valorise le plus.
- slug: co-b2-musee-sans-ennui
  cefr: B2
  origin: generated
  focus: but éducatif
  audio_text: 'Quand je prépare des visites pour les familles, on me demande souvent si je veux « rendre
    le musée amusant ». Je réponds que non. Amusant n''est pas un mauvais mot, mais ce n''est pas l''objectif.
    Si l''on vient seulement pour se distraire, on oublie vite. Mon travail consiste plutôt à donner des
    repères : comment regarder une peinture, pourquoi une sculpture est placée ici, ce que raconte une
    œuvre même sans explication compliquée. J''aime quand les enfants posent des questions dérangeantes,
    parce qu''elles montrent qu''ils observent vraiment. Bien sûr, nous faisons des jeux et des petites
    activités. Mais ces activités servent à entrer dans les œuvres, pas à les remplacer. Le musée reste
    un lieu de découverte, pas un parc de loisirs.'
  prompt: Quelle est sa position sur la visite ?
  options:
  - Elle doit surtout divertir.
  - Elle doit donner des clés de lecture.
  - Elle convient seulement aux spécialistes.
  - Elle doit éviter les enfants.
  answer: 1
  explanation: 'Il dit que les activités servent à « entrer dans les œuvres » et que son travail est de
    donner des repères et des clés. Les autres options déforment son propos : il ne réserve pas le musée
    aux spécialistes et ne veut pas exclure les enfants.'
- slug: co-b2-festival-equilibre
  cefr: B2
  origin: generated
  focus: public diversifié
  audio_text: |-
    - Vous maintenez des tarifs raisonnables alors que d'autres festivals misent sur des pass très chers. Pourquoi ?
    - Parce qu'un festival ne vaut pas seulement par son affiche. Si le prix devient trop élevé, on perd les familles, les étudiants, les gens du quartier. Or je veux un public mélangé.
    - Pourtant vous faites venir des noms connus.
    - Oui, mais je refuse de programmer uniquement des têtes d'affiche. On réserve une place importante à des groupes qui débutent, et les débats d'après-concert comptent presque autant que la musique.
    - Ce n'est donc pas un événement réservé aux passionnés ?
    - Non. C'est une porte d'entrée pour ceux qui aiment déjà la musique, et pour ceux qui la découvrent.
  prompt: Quelle est sa priorité ?
  options:
  - Miser sur les vedettes.
  - Augmenter les prix.
  - Garder un public varié.
  - Réduire les débats.
  answer: 2
  explanation: Il dit vouloir un « public mélangé » et explique que le prix et la programmation servent
    cette diversité. Les autres réponses contredisent directement sa stratégie, puisque les vedettes ne
    sont pas l’objectif principal et les débats sont au contraire importants.
- slug: co-b2-sport-de-rencontre
  cefr: B2
  origin: generated
  focus: conditions de rencontre
  audio_text: 'On imagine souvent qu''un équipement sportif crée naturellement du lien. C''est faux. Si
    l''on laisse les nouveaux venus sur le bord du terrain, ils restent entre eux ou n''osent pas revenir.
    Dans notre centre, nous avons donc modifié les règles : équipes mélangées, séances plus courtes pour
    les débutants, bénévoles chargés d''expliquer sans juger. Nous invitons aussi les clubs à varier les
    activités, parce qu''un adulte n''a pas toujours le même rapport au sport qu''un adolescent. Le plus
    difficile n''est pas d''ouvrir la porte, c''est d''organiser la rencontre. Quand cela marche, on voit
    des gens qui ne se seraient jamais parlé discuter après l''entraînement. C''est là que le loisir devient
    un vrai outil d''intégration.'
  prompt: Selon lui, qu'est-ce qui est indispensable ?
  options:
  - Préparer les rencontres.
  - Laisser chacun pratiquer seul.
  - Réserver le centre aux licenciés.
  - Allonger les séances.
  answer: 0
  explanation: Le locuteur affirme que le plus important n’est pas d’ouvrir la porte, mais « d’organiser
    la rencontre ». Les autres propositions vont à l’encontre des mesures décrites dans le document, comme
    les équipes mélangées et l’accueil des débutants.
- slug: co-b2-couloir-de-bus
  cefr: B2
  origin: generated
  focus: argument pour le projet
  audio_text: |-
    - Bonjour. Votre association soutient la suppression d’une voie de stationnement sur l’avenue Delorme. Pourquoi une mesure aussi impopulaire ?
    - Parce qu’aujourd’hui, le bus est pris dans le même bouchon que tout le monde. Tant que les véhicules de livraison et les voitures particulières occupent toute la chaussée, le bus ne peut pas respecter son passage toutes les dix minutes.
    - Mais les commerçants disent qu’ils vont perdre des clients.
    - Je les entends, bien sûr. C’est pourquoi nous demandons des créneaux de livraison le matin et un accès maintenu pour les riverains qui ont des difficultés à se déplacer. Ce projet n’a pas pour but d’interdire la voiture ; il cherche surtout à rendre le transport collectif enfin prévisible.
  prompt: Quel est l’argument principal du monsieur ?
  options:
  - Rendre les bus plus réguliers
  - Créer davantage de places de stationnement
  - Interdire l’accès aux riverains
  - Accélérer les livraisons
  answer: 0
  explanation: 'Le monsieur dit que le projet vise à rendre le transport collectif « enfin prévisible
    » et à faire respecter les passages du bus. Les autres propositions contredisent le document : il
    ne veut ni plus de stationnement, ni exclure les riverains, ni privilégier les livraisons.'
- slug: co-b2-telephone-reconditionne
  cefr: B2
  origin: generated
  focus: avantage du produit
  audio_text: On me demande souvent si acheter un téléphone reconditionné est un bon calcul. La réponse
    est oui, mais pas pour les raisons que l’on croit. Ce n’est pas un produit miracle ni un gadget d’occasion
    vendu à moitié prix. L’intérêt, c’est qu’il a été vérifié, remis en état, puis revendu avec une garantie.
    Du coup, on évite de payer le tarif du dernier modèle, alors que, pour la plupart des usages, la différence
    est minime. Et surtout, on prolonge la vie d’un appareil qui aurait pu finir au rebut. Bien sûr, il
    faut accepter qu’il ne soit pas neuf et qu’il présente parfois une batterie moins performante. Mais
    si l’on cherche un achat raisonnable, c’est souvent un meilleur compromis que le tout neuf acheté
    sur un coup de tête.
  prompt: Pourquoi la journaliste trouve-t-elle cet achat intéressant ?
  options:
  - Il est toujours plus performant
  - Il permet de payer moins et d’éviter le gaspillage
  - Il remplace la garantie du fabricant
  - Il convient seulement aux petits budgets
  answer: 1
  explanation: 'Le document insiste sur le fait qu’on paie moins que pour le dernier modèle et qu’on prolonge
    la vie de l’appareil. Les autres réponses sont fausses : le téléphone n’est pas présenté comme plus
    performant, ni comme remplaçant la garantie, ni comme réservé aux petits budgets.'
- slug: co-b2-train-de-nuit
  cefr: B2
  origin: generated
  focus: intérêt des trains de nuit
  audio_text: |-
    - On parle beaucoup du retour des trains de nuit. Est-ce un vrai changement ou un simple effet de mode ?
    - Un effet de mode, non. Ce qui change, c’est la façon de compter le temps. Un vol paraît rapide, mais il faut souvent ajouter l’aller à l’aéroport, l’attente, puis une nuit d’hôtel à l’arrivée si l’on veut être en forme le lendemain. Le train de nuit, lui, permet de dormir pendant le trajet et d’arriver directement au centre-ville.
    - Donc, il n’est intéressant que pour les voyageurs pressés ?
    - Pas uniquement. Il attire aussi ceux qui veulent éviter une correspondance ou réduire leur empreinte de transport. Mais il faut être honnête : le confort n’est pas celui d’un hôtel, et les horaires doivent être fiables. Sans cela, l’argument perd vite sa force.
  prompt: Selon le monsieur, pourquoi les trains de nuit redeviennent-ils attractifs ?
  options:
  - Ils sont plus rapides que l’avion
  - Ils permettent de voyager sans perdre la nuit
  - Ils évitent de passer par l’aéroport
  - Ils sont plus confortables qu’un hôtel
  answer: 1
  explanation: 'Le monsieur explique que le train de nuit permet de dormir pendant le trajet et de ne
    pas perdre une nuit d’hôtel. Les autres options ne correspondent pas au document : il ne dit ni qu’ils
    sont plus rapides, ni qu’ils suppriment l’aéroport, ni qu’ils sont plus confortables qu’un hôtel.'
- slug: co-b2-carte-de-fidelite
  cefr: B2
  origin: generated
  focus: idée principale
  audio_text: Les cartes de fidélité ont longtemps été présentées comme un moyen simple de faire des économies.
    En réalité, elles sont efficaces surtout pour les clients qui ont déjà un panier assez stable. Si
    vous achetez toujours les mêmes produits, vous pouvez comparer les remises et profiter des points.
    En revanche, si vous vous laissez guider par les offres et que vous achetez davantage parce qu’un
    produit est « à gagner », la carte devient surtout un outil pour dépenser plus. On oublie aussi que
    certains rabais ne concernent que des articles très précis, rarement ceux qu’on met d’habitude dans
    son caddie. Autrement dit, la bonne question n’est pas de savoir si la carte est utile en soi, mais
    si elle correspond vraiment à vos habitudes de consommation.
  prompt: Quelle est l’idée principale de la journaliste ?
  options:
  - La carte fait économiser sur tous les produits
  - La carte est utile si les achats sont déjà prévus
  - La carte oblige à acheter en grande quantité
  - La carte doit être interdite en magasin
  answer: 1
  explanation: 'La journaliste dit clairement que la carte est efficace surtout pour des clients qui achètent
    déjà les mêmes produits. Les autres propositions ne sont pas défendues : la carte ne fait pas économiser
    sur tout, n’oblige pas à acheter en grande quantité et n’est pas présentée comme à interdire.'
- slug: co-b2-covoiturage-organise
  cefr: B2
  origin: generated
  focus: condition d’efficacité
  audio_text: |-
    - On dit souvent que le covoiturage est la solution la plus simple pour réduire les trajets en voiture. Est-ce vraiment si évident ?
    - Pas tout à fait. Le principe est bon, mais il fonctionne seulement si les personnes acceptent un cadre commun. Il faut un horaire fixe, un point de rendez-vous clair et, parfois, un détour léger pour aller chercher un passager. Si chacun veut partir au dernier moment ou être déposé exactement devant sa porte, cela ne marche plus.
    - Pourtant, beaucoup d’applications promettent une grande liberté.
    - Justement, et c’est là le malentendu. Le covoiturage n’est pas un service de taxi bon marché. C’est une organisation partagée, donc un petit effort de prévisibilité de la part de tous.
  prompt: Qu’est-ce qui est indispensable pour que le covoiturage fonctionne bien ?
  options:
  - Une voiture électrique
  - Des horaires et un accord commun
  - Un long détour pour chaque passager
  - Une assurance spéciale pour le conducteur
  answer: 1
  explanation: 'Le monsieur insiste sur la nécessité d’un horaire fixe, d’un point de rendez-vous clair
    et d’une organisation commune. Les autres réponses ne sont pas mentionnées comme indispensables :
    ni voiture électrique, ni gros détour, ni assurance spéciale.'
- slug: co-b2-achats-sans-emballage
  cefr: B2
  origin: generated
  focus: nuance sur les comportements
  audio_text: 'Dans les enquêtes d’opinion, une majorité de consommateurs dit vouloir moins d’emballages.
    Mais, sur le terrain, le discours change dès qu’il faut apporter son contenant, attendre un peu plus
    longtemps ou vérifier le poids de ses achats. Beaucoup réclament des rayons en vrac, puis choisissent
    le produit déjà emballé parce qu’il paraît plus pratique. Ce n’est pas forcément de la mauvaise foi
    : le quotidien impose des contraintes réelles. Cependant, il faut reconnaître que la demande de simplicité
    est souvent plus forte que la volonté de limiter les déchets. Les enseignes l’ont compris et travaillent
    surtout sur des solutions très faciles à utiliser, faute de quoi les bonnes intentions restent au
    niveau des sondages.'
  prompt: Quelle nuance le journaliste souligne-t-il ?
  options:
  - Les consommateurs passent souvent de l’intention à la pratique
  - Les magasins ne veulent pas réduire les emballages
  - Le vrac est toujours moins cher
  - Les clients achètent surtout par manque de choix
  answer: 0
  explanation: 'Le document oppose les déclarations favorables aux emballages réduits et les choix réels
    des clients en magasin. Les autres réponses ne résument pas le propos : le journaliste ne dit pas
    que les magasins refusent de changer, ni que le vrac est toujours moins cher, ni que le problème vient
    seulement du manque de choix.'
- slug: co-b2-tarifs-variables
  cefr: B2
  origin: generated
  focus: logique de la tarification
  audio_text: |-
    - Vos tarifs changent beaucoup d’un jour à l’autre. Beaucoup de voyageurs ont l’impression d’être pénalisés.
    - Je comprends cette impression. Pourtant, l’objectif n’est pas de faire payer tout le monde au maximum. Quand un train se remplit, le prix plus élevé sert à répartir les réservations sur plusieurs jours et à éviter que tous les départs soient pris d’assaut au dernier moment. Ceux qui s’organisent tôt paient souvent moins, et cela nous aide à mieux remplir les trains.
    - Mais ce système reste difficile à lire.
    - Oui, et c’est un vrai problème. Si le client ne comprend pas la logique du tarif, il finit par penser que tout est arbitraire. Nous travaillons justement à rendre l’information plus lisible.
  prompt: Pourquoi ces tarifs variables sont-ils utilisés ?
  options:
  - Pour faire payer davantage les abonnés
  - Pour répartir les réservations dans le temps
  - Pour remplacer les réductions de dernière minute
  - Pour supprimer les trains trop remplis
  answer: 1
  explanation: 'Le représentant explique que les prix servent à répartir les réservations sur plusieurs
    jours et à éviter l’afflux de dernière minute. Les autres options ne correspondent pas : il ne parle
    pas de punir les abonnés, de remplacer des réductions, ni de supprimer des trains.'
- slug: co-b2-consigne-colis
  cefr: B2
  origin: generated
  focus: avantage principal
  audio_text: 'Recevoir un colis en consigne automatique, ce n’est pas seulement une question de confort.
    Pour les transporteurs, le système évite beaucoup d’allers-retours inutiles : quand un client est
    absent, le livreur n’a pas à repasser le lendemain. Pour les villes, cela limite aussi le nombre de
    camionnettes qui tournent dans les rues. Évidemment, le service n’est intéressant que si le point
    de retrait se trouve sur un trajet habituel, près du travail ou du domicile. Sinon, on perd son temps
    à faire un détour. Mais lorsqu’il est bien placé, le casier devient une solution assez sobre : moins
    d’échecs de livraison, moins de circulation et, souvent, des frais un peu plus bas que la remise à
    domicile.'
  prompt: Quel avantage principal est mis en avant ?
  options:
  - Moins de livraisons ratées et moins de circulation
  - Un service réservé aux gros colis
  - Un retrait plus rapide que partout ailleurs
  - Des frais identiques à domicile
  answer: 0
  explanation: 'Le document met en avant la réduction des échecs de livraison et du trafic de camionnettes
    en ville. Les autres propositions sont incompatibles avec le texte : le service n’est pas réservé
    aux gros colis, n’est pas présenté comme toujours plus rapide et n’a pas des frais identiques à domicile.'
- slug: co-b2-diner-familial
  cefr: B2
  origin: generated
  focus: point de vue
  audio_text: 'On aimerait croire qu''un dîner en famille règle tout : les tensions, la fatigue, les écrans.
    En réalité, le repas partagé n''est pas un rituel sacré ; c''est un espace possible parmi d''autres.
    Dans certaines maisons, on se voit chaque soir ; dans d''autres, le dimanche suffit, et cela peut
    aussi nourrir les liens. Ce qui compte, ce n''est pas la fréquence idéale, mais le moment où l''on
    se parle sans être interrompus. Il faut donc cesser d''opposer les familles « exemplaires » aux autres.
    Le lien se construit aussi dans des formes plus souples, plus ordinaires, et parfois moins visibles.'
  prompt: Quelle est l'idée principale du locuteur ?
  options:
  - Il faut dîner ensemble tous les soirs, sans exception.
  - Le dîner familial n'a plus aucune valeur.
  - Seuls les repas du dimanche comptent vraiment pour la famille.
