  item:
    slug: ce-c1-soupe-du-soir
    cefr: C1
    origin: generated
    focus: ton du récit
    passage: |-
      Le soir où j’ai retrouvé la vieille casserole, la cuisine sentait encore le poireau et le laurier. J’ai ouvert le placard sans savoir ce que je cherchais, puis j’ai vu, derrière les assiettes dépareillées, le carnet taché où ma mère avait noté la soupe de ma grand-mère, avec ses indications imprécises : « un peu de ceci », « jusqu’à ce que cela parle ». J’ai souri malgré moi. Cela faisait des mois que nous rangions la maison vide, et chaque objet semblait avoir gardé la voix de celle qui l’avait touché.

      Je n’ai pas lu la recette tout de suite. J’ai d’abord lavé les légumes, lentement, comme si ce geste devait suffire à remettre de l’ordre dans les jours. Dehors, la pluie battait les vitres sans insistance. Dans la casserole, l’eau commençait à frémir et le couteau, posé à côté de l’évier, brillait sous la lampe. Je pensais à ma grand-mère qui goûtait toujours la soupe avec le même sérieux, comme s’il s’agissait d’une affaire publique, puis elle ajoutait une pincée de sel sans jamais dire pourquoi.

      Quand j’ai enfin porté la cuillère à mes lèvres, ce n’est pas le souvenir qui m’a saisi, mais sa précision : la chaleur, d’abord, puis cette amertume discrète que je n’avais jamais remarquée. Il m’a semblé alors que l’on hérite moins d’une recette que d’une manière d’attendre. J’ai laissé la soupe refroidir un peu. Dans la maison silencieuse, cette lenteur me paraissait presque une forme de politesse.
    prompt: Quel sentiment domine ce passage ?
    options:
    - Une joie éclatante.
    - Une ironie mordante.
    - Une mélancolie retenue.
    - Une colère ouverte.
    answer: 2
    explanation: Le récit associe le geste culinaire à l’absence, à la mémoire et au silence, avec une
      émotion contenue plutôt qu’expressément dramatique. Les autres options ne correspondent pas au ton
      général, ni au vocabulaire choisi.
