  item:
    slug: ce-c1-boites-repas
    cefr: C1
    origin: generated
    focus: motif d’adhésion
    passage: |-
      On s’étonne parfois du succès des boîtes-repas prêtes à cuisiner. Après tout, elles ne font pas disparaître la préparation : il faut encore éplucher, couper, cuire, assaisonner. Elles ne dispensent ni de vaisselle ni du temps passé derrière les fourneaux. Alors pourquoi séduisent-elles autant des personnes qui savent parfaitement faire leurs courses ?

      La réponse ne tient pas seulement à la paresse, mot commode mais peu juste. Ce que vendent ces formules, ce n’est pas l’absence d’effort, c’est l’allègement d’une charge mentale devenue invisible parce qu’elle est quotidienne. Choisir un menu, calculer les quantités, vérifier ce qu’il reste au réfrigérateur, anticiper le lendemain, éviter le double achat : tout cela représente un travail discret mais réel. Les boîtes réorganisent ce travail au lieu de l’abolir. Elles le déplacent vers une entreprise qui l’assume à la place du client, au moins en partie.

      C’est aussi pourquoi leur public n’est pas seulement composé de débutants en cuisine. On y trouve des parents pressés, des salariés qui rentrent tard, des personnes seules qui ne veulent pas décider chaque soir de la même chose. L’intérêt principal n’est donc pas la promesse d’un plat plus savoureux qu’un autre, mais celle d’un dîner moins encombré par les micro-décisions. Le succès de ces services dit peut-être moins notre incapacité à cuisiner que notre fatigue à choisir. Dans une époque saturée d’options, recevoir une suite d’étapes déjà ordonnées peut ressembler à un luxe.
    prompt: Selon l’auteur, pourquoi ces boîtes séduisent-elles ?
    options:
    - Parce qu’elles coûtent moins cher que le marché.
    - Parce qu’elles suppriment toute cuisine.
    - Parce qu’elles garantissent des plats plus raffinés.
    - Parce qu’elles simplifient surtout la décision.
    answer: 3
    explanation: 'Le texte insiste sur la charge mentale : menus, quantités, achats, anticipation. Le
      succès vient surtout de là, et non du prix, d’une suppression totale de l’effort ou d’une supériorité
      culinaire.'
