  item:
    slug: ce-c1-escale-choisie
    cefr: C1
    origin: generated
    focus: idée implicite
    passage: |-
      Pendant longtemps, l’escale a été vécue comme un contretemps. Elle signifiait l’attente, le changement de quai, la fatigue d’un passage entre deux moyens de transport. On la supportait comme on supporte une salle trop éclairée ou un couloir trop long. Puis certains voyageurs ont commencé à la regarder autrement : non plus comme un vide entre deux destinations, mais comme une parenthèse à habiter.

      L’idée ne consiste pas à transformer chaque arrêt en visite exhaustive ni à accumuler les musées entre deux correspondances. Il s’agit plutôt de reconnaître que le déplacement lui-même a une forme, une respiration, un rythme, et qu’une ville traversée brièvement peut être rencontrée sans être consommée. Une gare, un marché, une promenade de quelques heures suffisent parfois à faire sentir qu’un trajet n’est pas une ligne tendue d’un point à l’autre, mais une suite de seuils.

      Cette manière de voyager séduit ceux qui se méfient des itinéraires surchargés. Elle plaît aussi à ceux qui ont compris qu’un séjour trop rempli laisse peu de prise au réel. À force de vouloir « rentabiliser » chaque minute, on finit par ne plus voir que des listes. Or l’escale oblige à autre chose : accepter que l’on ne maîtrise pas tout, que le temps mort puisse devenir du temps vécu. Le voyageur n’en ressort pas nécessairement plus reposé, mais souvent moins pressé.

      Ce n’est donc pas un plaidoyer pour l’oisiveté, encore moins pour le hasard intégral. C’est une invitation à déplacer le regard : ce qui semblait n’être qu’un intervalle peut devenir, à sa manière, une expérience.
    prompt: Que cherche à montrer l’auteur ?
    options:
    - Qu’il faut éviter les villes de passage.
    - Qu’un arrêt long gâche toujours le séjour.
    - Qu’une escale peut faire partie du voyage.
    - Qu’une correspondance doit rester très courte.
    answer: 2
    explanation: 'Le texte requalifie l’escale : au lieu d’un simple vide, elle devient une expérience
      du voyage. Les autres options contredisent cette idée ou la réduisent à une contrainte purement
      pratique.'
