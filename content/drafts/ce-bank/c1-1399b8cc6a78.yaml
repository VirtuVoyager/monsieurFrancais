  item:
    slug: ce-c1-ferments-a-la-mode
    cefr: C1
    origin: generated
    focus: ton de l’auteur
    passage: |-
      Les aliments fermentés ont trouvé leur place sur les tables branchées avec une rapidité remarquable. Kombucha, kéfir, miso, légumes lactofermentés : la liste s’allonge au rythme des promesses. On leur prête volontiers une vertu quasi médicale, comme si quelques cuillerées de chou acide pouvaient réparer à elles seules des années de menus désordonnés. Le phénomène serait amusant s’il n’était pas si révélateur.

      Le mérite de ces aliments est réel, mais il n’a rien de miraculeux. La fermentation n’est pas une invention récente remise au goût du jour par caprice marketing ; c’est une technique ancienne, née de la nécessité de conserver, d’économiser, de diversifier. Ce retour en grâce dit quelque chose de notre époque : nous supportons de moins en moins l’idée qu’un produit ait du temps, qu’il se transforme lentement, qu’il échappe aux performances immédiates.

      Il serait pourtant absurde de rejeter cette mode au seul motif qu’elle en est une. Certaines tendances ouvrent des curiosités sincères, et beaucoup de cuisiniers découvrent par ce biais des saveurs qu’ils n’auraient jamais explorées autrement. Mais la prudence s’impose dès que le discours commercial remplace l’expérience. À force de célébrer les ferments comme un remède universel, on finit par oublier qu’ils sont d’abord des aliments : ils nourrissent, ils accompagnent, ils complexifient un repas. C’est déjà beaucoup. Il n’est pas nécessaire de leur faire promettre davantage.
    prompt: Comment l’auteur accueille-t-il l’engouement pour les aliments fermentés ?
    options:
    - Avec un enthousiasme sans réserve.
    - Avec intérêt, mais avec réserve.
    - Avec une hostilité déclarée.
    - Avec une totale indifférence.
    answer: 1
    explanation: 'Le texte reconnaît la valeur et l’intérêt des aliments fermentés, mais critique les
      promesses excessives et le discours marketing. Les autres réponses ne conviennent pas : l’auteur
      n’est ni exalté, ni hostile, ni indifférent.'
