  item:
    slug: ce-c1-ferry-de-nuit
    cefr: C1
    origin: generated
    focus: impression dominante
    passage: |-
      La mer était noire, mais non menaçante ; elle semblait plutôt absorber les bruits du bateau, comme si le ferry avançait dans une matière épaisse et silencieuse. J’étais monté à bord tard, avec ce mélange de hâte et de résignation que donnent les départs sans cérémonie. Autour de moi, les passagers avaient déposé leurs sacs, cherché leur coin, puis s’étaient tus. Sur le pont supérieur, quelques lumières jaunes tremblaient dans le vent.

      Je suis sorti un instant. Il n’y avait presque personne. Une porte battait quelque part, un enfant pleurait très loin, puis plus rien. Le navire continuait sa route, et cette continuité avait quelque chose d’apaisant. On ne voyait ni côte ni phare, seulement une obscurité traversée par le sillage, cette ligne pâle qui se défaisait aussitôt derrière nous. J’ai pensé que voyager ainsi, c’était accepter de ne plus savoir très bien où l’on se trouvait : ni tout à fait parti, ni encore arrivé.

      Dans la salle commune, une femme lisait sans lever la tête ; un homme dormait, la nuque tordue contre la vitre. Je me suis assis près du hublot. Le verre vibrait légèrement, et cette vibration me rappelait que nous étions ensemble, sans nous connaître, emportés par le même mouvement. Rien dans cette traversée ne demandait l’admiration. Pourtant, une paix singulière s’en dégageait, comme si l’absence de paysage laissait enfin de la place à ce qu’on emporte avec soi : la fatigue, les pensées inachevées, l’attente encore sans nom de la rive suivante.
    prompt: Quelle est l’impression dominante dans ce passage ?
    options:
    - Une peur intense de la mer.
    - Une fascination pour le luxe du bateau.
    - Une impatience de quitter le navire.
    - Une paix mêlée de suspension.
    answer: 3
    explanation: Le narrateur insiste sur le calme, le silence et l’état d’« entre-deux » du voyage, qui
      produit une paix singulière plutôt qu’une peur ou une exaltation. Les autres options ne correspondent
      pas au climat du texte.
