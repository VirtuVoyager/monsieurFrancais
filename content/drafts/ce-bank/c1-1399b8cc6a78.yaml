  item:
    slug: ce-c1-aeroport-secondaire
    cefr: C1
    origin: generated
    focus: conclusion implicite
    passage: |-
      Les compagnies à bas coût vantent souvent leurs aéroports secondaires comme une preuve de rationalité : moins de frais, moins de congestion, une organisation plus souple. L’argument paraît solide tant qu’on ne regarde que le prix affiché. Mais le voyageur ne paie pas seulement un billet ; il paie aussi le trajet jusqu’au terminal, le temps perdu dans les navettes, les correspondances moins fréquentes et, parfois, une nuit d’hôtel imposée par des horaires peu commodes.

      Le texte ne cherche pas à diaboliser ces plateformes périphériques. Après tout, elles rendent des services réels et permettent à beaucoup de partir plus souvent. Il rappelle simplement qu’un tarif n’est pas une vérité, mais une manière de présenter la dépense. Là où l’on croit gagner, on déplace souvent la charge ailleurs : vers le temps, vers l’organisation, vers la fatigue. Le problème n’est donc pas l’existence de ces offres, mais l’illusion qu’elles entretiennent si l’on se limite à la première ligne du devis.

      C’est dans cette perspective que la dernière partie du texte prend tout son sens. L’auteur y compare le billet « bon marché » à un emballage élégant : utile pour séduire, insuffisant pour juger. Le vrai calcul commence lorsqu’on additionne les gestes invisibles du voyage. À ce moment-là, le bas prix cesse d’être un argument décisif et devient une donnée parmi d’autres. Autrement dit, l’économie promise n’est pas fausse ; elle est incomplète. Le lecteur est invité à revoir sa définition du coût, non à renoncer au vol.
    prompt: Dans ce texte, l’auteur cherche surtout à...
    options:
    - vanter les vols les moins chers.
    - démontrer que les navettes sont inutiles.
    - redéfinir le vrai coût d’un billet.
    - montrer que tous les aéroports sont identiques.
    answer: 2
    explanation: La conclusion insiste sur le fait qu’il faut additionner le prix affiché, le temps, les
      transferts et la fatigue pour évaluer la dépense réelle. Les autres propositions sont soit trop
      générales, soit contraires au texte.
