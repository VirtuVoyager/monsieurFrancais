      Quand l’accueil change aussi les habitants

      Dans la ville de Valmont, un programme de parrainage met en relation des nouveaux arrivants et des habitants déjà installés. Pendant six mois, chaque duo se rencontre au moins deux fois par mois : démarches administratives, découverte du quartier, pratique du français autour d’un café, puis participation à des activités locales. Le bilan chiffré est positif : 72 % des participants disent avoir osé entrer plus facilement dans une association, et 58 % avoir élargi leur réseau professionnel. Mais l’article insiste sur un point moins visible. Si certains binômes fonctionnent bien, c’est parce que les deux personnes y trouvent quelque chose : les nouveaux venus un appui concret, les habitants une meilleure connaissance de leur ville et, souvent, une remise en question de leurs préjugés. L’auteur refuse donc l’idée d’une intégration à sens unique. Il suggère que l’accueil ne consiste pas seulement à aider les autres à s’adapter, mais aussi à modifier les habitudes locales pour rendre la rencontre possible.
    prompt: Quelle idée le texte défend-il ?
    options:
    - Les nouveaux venus doivent s’adapter seuls
    - Les associations sont inutiles
    - Le français suffit pour réussir
    - L’intégration concerne les deux côtés
    answer: 3
    explanation: Le texte dit explicitement que l’intégration n’est pas à sens unique et que les habitants
      changent aussi grâce au programme. Les autres réponses contredisent cette idée centrale ou réduisent
      le problème à la seule langue.
