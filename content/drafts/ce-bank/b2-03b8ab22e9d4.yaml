      Pour apprendre, le meilleur n’est pas toujours le tout numérique

      Les cours d’alphabétisation destinés aux adultes immigrés sont souvent pensés comme des dispositifs purement numériques ou, au contraire, uniquement en présentiel. Or une enquête menée dans quatre centres de formation montre qu’aucune de ces formules ne suffit à elle seule. Les séances en ligne attirent davantage de participants parce qu’elles évitent les transports et permettent de revoir les leçons, mais les abandons restent fréquents quand les apprenants se sentent isolés. À l’inverse, les ateliers en salle créent une dynamique de groupe et donnent davantage confiance pour parler, mais ils excluent parfois ceux qui travaillent en horaires décalés. La conclusion de l’article est claire : le modèle le plus solide combine des modules courts à distance, un rendez-vous hebdomadaire en face à face et un accompagnement individuel. L’auteure insiste sur le fait que l’intégration ne passe pas seulement par l’accès à une plateforme, mais par un équilibre entre souplesse et présence humaine. Les centres qui ont mis en place cette formule ont vu le taux d’assiduité progresser de près de quinze points.
    prompt: Quelle formule semble la plus efficace ?
    options:
    - Uniquement à distance
    - Uniquement en présentiel
    - Des cours individuels sans groupe
    - Un mélange de distance et de présence
    answer: 3
    explanation: L’article conclut explicitement que la formule la plus solide combine modules à distance,
      rendez-vous en face à face et accompagnement individuel. Les autres options reprennent des dispositifs
      évoqués, mais précisément présentés comme insuffisants seuls.
