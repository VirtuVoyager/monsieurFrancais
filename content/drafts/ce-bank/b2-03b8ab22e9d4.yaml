      Le petit-déjeuner à l’école, un progrès réel mais limité

      Dans plusieurs écoles primaires, un petit-déjeuner gratuit a été mis en place pour les enfants qui arrivent sans avoir mangé. Les chiffres publiés par la ville de Merlune semblent encourageants : après six mois, les absences du lundi ont baissé de huit pour cent et les enseignants disent observer moins d’irritabilité en début de matinée. Pourtant, l’éditorialiste Clara Dumesnil refuse d’y voir une solution miracle. Elle rappelle que la faim du matin n’est que l’un des symptômes de la pauvreté et que l’effet du programme reste limité lorsqu’il n’est pas accompagné d’un suivi social ou d’un travail avec les parents. À ses yeux, l’école peut corriger une partie des inégalités, mais elle ne doit pas être chargée de les réparer seule. Elle se félicite donc de l’initiative, tout en regrettant que les pouvoirs publics présentent parfois ce type de mesure comme une réponse suffisante. Le petit-déjeuner aide, écrit-elle, mais il ne remplace ni un logement stable, ni des revenus décents, ni du temps pour préparer la journée des enfants.
    prompt: Que laisse entendre l’autrice ?
    options:
    - Le petit-déjeuner suffit à résoudre la pauvreté
    - L’école devrait supprimer toutes les aides
    - Une aide ciblée ne remplace pas une politique plus large
    - Les parents refusent l’initiative
    answer: 2
    explanation: L’autrice reconnaît l’utilité du programme mais insiste sur ses limites et sur la nécessité
      d’autres politiques sociales. Les autres options déforment son propos ou lui prêtent une critique
      qu’elle ne formule pas.
