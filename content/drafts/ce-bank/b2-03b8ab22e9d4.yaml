      Téléphones à l’école : une règle utile, mais pas suffisante

      Dans plusieurs collèges, l’interdiction des téléphones en classe a ravivé un vieux débat. Une enquête menée auprès de vingt établissements montre une baisse des interruptions et des retards de dix minutes, mais aussi des tensions au moment de la confiscation. Dans sa chronique, Mathieu Lenoir reconnaît que les élèves sont plus disponibles quand l’écran disparaît. Cependant, il juge naïf de croire qu’une règle suffit à elle seule. Selon lui, si les enseignants ne proposent pas d’activités claires et si les familles ne comprennent pas le sens de la mesure, le téléphone revient aussitôt sous une autre forme : montre connectée, appareil caché ou simple distraction mentale. L’auteur rappelle en outre que certains usages restent utiles, par exemple pour les élèves allophones ou pour des projets encadrés. Il ne défend donc ni le laxisme ni la confiscation systématique, mais une politique lisible, avec des exceptions précises et une vraie formation à l’attention. Pour lui, l’école doit apprendre aux jeunes à choisir le bon moment d’utiliser le numérique, pas seulement à le ranger dans un tiroir.
    prompt: Quelle est la position de l’auteur ?
    options:
    - Interdire les téléphones sans exception
    - Associer la règle à un cadre pédagogique clair
    - Laisser chaque élève libre d’en faire usage
    - Remplacer les manuels par des écrans
    answer: 1
    explanation: Le texte dit clairement que la règle seule ne suffit pas et qu’il faut des activités,
      des exceptions précises et une formation à l’attention. Les autres propositions contredisent ce
      refus de l’interdiction absolue ou ajoutent une idée absente du texte.
