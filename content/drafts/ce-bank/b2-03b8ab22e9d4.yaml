      Un soutien qui fonctionne mieux avec les familles

      Une étude de la fondation Noria a suivi pendant un an huit cents collégiens inscrits à un programme d’appui scolaire gratuit. Dans les établissements où le suivi était régulier, les résultats en français ont progressé en moyenne de six points, et le décrochage a reculé de neuf pour cent. Mais le rapport nuance les chiffres : les élèves les plus fragiles ont davantage bénéficié du dispositif lorsqu’un adulte de la famille assistait au premier entretien et recevait un bilan mensuel. Sans ce relais, plusieurs adolescents manquaient les séances après quelques semaines. L’auteur du compte rendu en tire une conclusion simple : les cours supplémentaires ne produisent pas les mêmes effets selon le cadre dans lequel ils s’inscrivent. Il ne suffit pas d’offrir des heures de soutien ; il faut aussi expliquer le fonctionnement du programme, fixer des horaires compatibles avec la vie des familles et maintenir un contact avec elles. À ses yeux, le succès du dispositif tient moins au nombre d’heures qu’à la manière de le raccorder à la vie quotidienne.
    prompt: D’après le texte, de quoi dépend surtout l’efficacité du programme ?
    options:
    - Du nombre d’heures de soutien
    - De l’implication des familles
    - Du niveau des manuels
    - De la sélection des élèves
    answer: 1
    explanation: Le rapport précise que les meilleurs effets apparaissent quand un adulte de la famille
      participe au suivi et reçoit des bilans réguliers. Les autres choix sont évoqués de façon générale
      ou ne sont pas présentés comme décisifs.
