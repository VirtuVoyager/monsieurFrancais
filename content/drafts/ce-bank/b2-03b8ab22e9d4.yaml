      Reconnaître un diplôme, ou laisser perdre des compétences ?

      Chaque année, des milliers de personnes formées à l’étranger acceptent des emplois en dessous de leurs compétences faute de reconnaissance rapide de leur diplôme. Un dossier publié dans Le Courrier civique compare trois provinces : dans la plus réactive, l’évaluation dure en moyenne quatre mois ; dans la plus lente, plus d’un an. Or les employeurs interrogés disent rechercher des infirmiers, des ingénieurs et des techniciens, tandis que des candidats expérimentés attendent une réponse administrative. L’auteur du dossier n’ignore pas les exigences de sécurité ou de qualité, mais il estime que le système actuel confond prudence et méfiance. Selon lui, demander des cours supplémentaires à presque tout le monde, sans distinguer les parcours, revient à gaspiller des compétences déjà acquises. Le texte souligne aussi un effet paradoxal : plus la procédure est longue, plus les candidats finissent par quitter la profession ou le pays. La conclusion est nette : une intégration réussie passe aussi par une reconnaissance plus rapide et plus lisible des qualifications.
    prompt: Quelle est l’opinion de l’auteur sur la procédure actuelle ?
    options:
    - Elle protège bien la qualité
    - Elle est trop lente et rigide
    - Elle encourage les reconversions
    - Elle coûte moins cher aux candidats
    answer: 1
    explanation: 'Le dossier parle d’attentes d’un an, de méfiance et de compétences gaspillées : l’auteur
      juge donc la procédure trop lente et trop rigide. Les autres réponses vont contre le sens général
      du texte ou ajoutent une idée non présente.'
