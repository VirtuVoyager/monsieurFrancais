  item:
    slug: ce-b2-ateliers-media
    cefr: B2
    origin: generated
    focus: enseignement tiré
    passage: |-
      Au centre culturel de Saint-Évariste, l’association Paroles nettes anime depuis janvier des ateliers d’éducation aux médias pour des publics très variés : lycéens, parents, demandeurs d’emploi et seniors. En quatre mois, 18 séances ont réuni un peu plus de 300 participants. Le programme n’a rien d’un cours théorique. On y compare des titres de presse, on repère les images trompeuses, on vérifie une source et on discute de la différence entre une information, une opinion et une rumeur. D’après le bilan publié par l’association, 74 % des participants disent avoir changé au moins une habitude de lecture en ligne.

      L’auteur prend clairement position : dans un univers saturé de messages, la première compétence n’est pas de tout savoir, mais de savoir douter avec méthode. Il ne présente pas ces ateliers comme une solution miracle contre la désinformation. Leur intérêt est plus modeste et plus durable : rendre chacun un peu moins dépendant du hasard des fils d’actualité. Le texte souligne aussi un point souvent négligé : les personnes les plus demandeuses ne sont pas forcément les plus jeunes. Beaucoup d’adultes qui se disent « perdus » devant certains contenus souhaitent surtout retrouver des repères simples pour décider à qui faire confiance. En ce sens, l’association répond à un besoin de vie citoyenne autant qu’à un besoin technique.
    prompt: Quel enseignement l’article met-il surtout en avant ?
    options:
    - Les jeunes sont les seuls à avoir besoin d’aide.
    - Les ateliers empêchent toute désinformation.
    - Les réseaux sociaux remplacent les journaux.
    - Apprendre à vérifier compte plus que mémoriser des règles.
    answer: 3
    explanation: 'Le texte affirme que la compétence essentielle est de « savoir douter avec méthode »
      et de vérifier les sources. Les autres propositions sont rejetées par le document : l’aide ne concerne
      pas seulement les jeunes, les ateliers ne suppriment pas toute désinformation et les réseaux sociaux
      ne remplacent pas la presse.'
