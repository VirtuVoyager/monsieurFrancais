  item:
    slug: ce-b2-bulletin-partage
    cefr: B2
    origin: generated
    focus: solution équilibrée
    passage: |-
      Depuis dix ans, l’association des Jardins de Clarel envoyait à ses adhérents un bulletin imprimé quatre fois par an. Mais les coûts ont augmenté, et la petite équipe bénévole peinait à tenir le rythme. Un passage au tout numérique a donc été envisagé. Sur le papier, l’économie semblait évidente : près de 7 000 euros par an de frais d’impression et d’envoi pourraient être réduits de plus de moitié. Pourtant, un test mené pendant six mois a révélé une autre réalité. Les messages électroniques étaient bien lus par les familles actives, mais une partie des membres âgés ne les ouvrait pas, ou les ouvrait trop tard pour s’inscrire aux sorties.

      L’auteur ne présente pas ce résultat comme un échec, mais comme un rappel utile : l’efficacité d’un outil ne se mesure pas seulement à son prix. Dans une association, le mode de communication fait partie du lien collectif. C’est pourquoi le comité a finalement choisi une formule mixte : une version papier plus courte pour ceux qui en ont besoin, et une version numérique plus complète pour les autres. Cette décision, écrit l’auteur, n’a rien de conservateur. Elle évite au contraire qu’une économie budgétaire se transforme en exclusion discrète.
    prompt: Quelle est la solution jugée la plus équilibrée ?
    options:
    - Conserver les deux versions du bulletin.
    - Supprimer totalement la version papier.
    - Réserver le bulletin aux seules sorties.
    - Confier la communication à une plateforme commerciale.
    answer: 0
    explanation: 'Le texte indique clairement que le comité choisit « une formule mixte » avec papier
      et numérique. Les autres options sont écartées par l’article : il ne supprime pas le papier, ne
      limite pas le bulletin aux sorties et ne parle pas d’une plateforme commerciale.'
