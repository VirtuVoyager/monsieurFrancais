  item:
    slug: ce-b2-info-en-continu
    cefr: B2
    origin: generated
    focus: opinion de l’auteur
    passage: |-
      Les chaînes d’information en continu se félicitent souvent d’offrir au public une présence permanente : un événement à peine commencé, et déjà des images, des réactions, des commentaires. L’auteur de l’article reconnaît volontiers que cette rapidité répond à une attente réelle. Pourtant, il estime qu’elle a un coût élevé. À force de vouloir être les premières, ces chaînes donnent parfois l’impression d’expliquer un pays sans jamais lui laisser le temps de respirer. Le spectateur passe d’un sujet à l’autre avant d’avoir compris ce qui est en jeu.

      L’article s’appuie sur une étude menée auprès de 1 200 téléspectateurs : 58 % disent regarder ces chaînes pour « savoir tout de suite », mais seulement 22 % leur font pleinement confiance pour comprendre un dossier complexe. L’auteur y voit le signe d’un malentendu. Le problème n’est pas l’existence d’un flux continu ; c’est l’idée que l’urgence suffirait à faire de l’information. Selon lui, le véritable journalisme commence quand on prend le temps de hiérarchiser, de vérifier et de remettre les faits en perspective. Sans cela, l’abondance d’images produit moins de savoir que de fatigue.
    prompt: Selon l’auteur, quel est le principal défaut des chaînes d’information en continu ?
    options:
    - Elles diffusent trop peu d’images.
    - Elles parlent surtout de sujets locaux.
    - Elles refusent de suivre l’actualité immédiate.
    - Elles privilégient l’urgence au détriment du recul.
    answer: 3
    explanation: 'L’article oppose explicitement la rapidité des chaînes à la nécessité de vérifier et
      de mettre en perspective. Les autres propositions ne conviennent pas : il n’y a pas trop peu d’images,
      le texte ne dit pas qu’elles parlent surtout de sujets locaux et il critique au contraire leur obsession
      de l’immédiat.'
