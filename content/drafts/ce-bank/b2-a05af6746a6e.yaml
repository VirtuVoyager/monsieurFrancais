  item:
    slug: ce-b2-radio-de-voisinage
    cefr: B2
    origin: generated
    focus: fonction de la radio
    passage: |-
      Dans le quartier Saint-Lubin, la radio associative L’Écho des rues diffuse trois heures par jour avec une équipe de quinze bénévoles. À première vue, l’antenne paraît modeste : pas de plateau sophistiqué, peu de moyens techniques, et une audience qui ne rivalise évidemment pas avec celle des grandes stations. Pourtant, les chiffres recueillis par l’université de Brétonne sont éloquents : 80 % des auditeurs réguliers disent apprendre grâce à cette radio ce qui se passe dans leur secteur, et 67 % déclarent avoir déjà assisté à une réunion ou à une activité après en avoir entendu parler à l’antenne.

      Pour l’auteur, ces résultats disent quelque chose d’important sur le rôle des médias de proximité. L’Écho des rues n’est pas un simple loisir pour passionnés de micro. C’est un lieu où l’on donne la parole à des habitants qui ne l’ont presque jamais ailleurs : parents d’élèves, responsables d’associations, jeunes en recherche de projet, retraités engagés dans la vie du quartier. Le ton est sobre, les sujets concrets, et la valeur de cette radio tient justement à ce qu’elle ne cherche pas à faire du spectaculaire. Elle crée de la circulation entre les personnes et les initiatives. À l’heure où beaucoup de médias parlent d’un territoire de loin, elle le fait entendre de l’intérieur.
    prompt: Comment l’auteur considère-t-il cette radio associative ?
    options:
    - Comme un simple divertissement.
    - Comme un média dépassé.
    - Comme un support réservé aux élus.
    - Comme un outil civique essentiel.
    answer: 3
    explanation: 'L’auteur insiste sur la parole donnée aux habitants, la circulation entre personnes
      et initiatives, et le fait de « faire entendre » le territoire. Cela correspond à un outil civique.
      Les autres réponses sont incompatibles avec le texte : la radio n’est ni un simple divertissement,
      ni dépassée, ni réservée aux élus.'
