  item:
    slug: ce-c1-reunions-ecourtees
    cefr: C1
    origin: generated
    focus: réserve sur la réforme
    passage: |-
      Dans plusieurs associations, la même idée revient avec insistance : moins de réunions, plus d’actions. Le Cercle des Mains Ouvertes, qui coordonne des ateliers d’entraide dans trois quartiers, vient ainsi de supprimer ses assemblées mensuelles au profit de rencontres par projet. Les responsables expliquent que les bénévoles, lassés par les ordres du jour interminables, réclamaient des échanges plus courts, plus concrets, moins cérémoniels. L’argument est entendu ; il a même des allures de bon sens.

      Mais un texte interne diffusé cette semaine nuance fortement ce tableau. L’autrice y rappelle que les réunions ne servent pas seulement à « perdre du temps » : elles permettent aux nouveaux venus de comprendre les règles implicites du groupe, elles donnent de la visibilité aux tensions et elles évitent que les décisions se prennent entre quelques personnes déjà très disponibles. Or, en réduisant les occasions de débat collectif, l’association risque selon elle de confondre rapidité et vitalité. Un groupe qui se réunit moins n’est pas nécessairement un groupe qui agit mieux ; il peut simplement devenir plus silencieux, donc moins lisible, donc plus fragile.

      Le texte ne défend pas une nostalgie de la discussion pour la discussion. Il admet que certaines habitudes pèsent lourd et que le bénévolat ne supporte pas toujours les mêmes formes de mobilisation qu’autrefois. Mais il met en garde contre une solution trop élégante : alléger la structure sans se demander pourquoi les personnes disponibles se raréfient. En ce sens, la réforme corrige le symptôme plus qu’elle ne traite la cause.
    prompt: Quelle réserve l’autrice exprime-t-elle au sujet de cette réforme ?
    options:
    - Elle risque de réduire le débat sans résoudre le problème de fond.
    - Elle devrait être appliquée à toutes les associations du quartier.
    - Elle est surtout bloquée par un manque de salles adaptées.
    - Elle ne concerne en réalité que les membres les plus âgés.
    answer: 0
    explanation: 'Le texte dit clairement que la réforme « corrige le symptôme plus qu’elle ne traite
      la cause » : moins de réunions ne suffit pas à expliquer la baisse d’engagement. Les autres options
      ne sont pas soutenues par le document : il n’y a ni recommandation générale, ni problème de salles,
      ni ciblage des aînés.'
