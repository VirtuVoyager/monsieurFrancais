  item:
    slug: ce-c1-lecture-fragmentee
    cefr: C1
    origin: generated
    focus: fonction des exemples
    passage: |-
      On a souvent présenté l’écran comme un instrument de liberté : chacun lit quand il veut, où il veut, selon son humeur et son temps disponible. Ce récit est séduisant, mais il oublie une transformation plus discrète. L’information numérique s’est installée dans les creux de la journée, là où la lecture n’était autrefois qu’une parenthèse. Dans le métro, avant un rendez-vous, entre deux cours, au fond d’une file d’attente, l’usager consulte moins qu’il ne comble.

      L’auteur de ces lignes ne conteste pas le plaisir réel de cette disponibilité. Il note simplement qu’à force de multiplier les fragments, on finit par associer la lecture à des temps résiduels. Le texte long devient suspect parce qu’il demande de rester. L’article argumenté, lui, entre en concurrence avec des alertes, des messages, des brèves qui n’exigent qu’un regard. Le geste n’est plus de choisir un contenu ; il devient celui d’occuper une brèche. Ce déplacement n’a rien de spectaculaire et c’est précisément ce qui le rend puissant.

      D’où les exemples récurrents de la station, de la salle d’attente et du quai. Ils ne servent pas à illustrer des situations pittoresques, mais à montrer comment un outil censé élargir l’accès à l’écrit peut en changer la logique. On ne lit plus seulement pour comprendre ou pour se perdre ; on lit aussi pour ne pas attendre. Et lorsqu’une pratique devient le simple remède à l’intervalle, elle modifie silencieusement ce qu’on attend d’elle.
    prompt: À quoi servent surtout les exemples du métro, de la file d’attente et du quai ?
    options:
    - À prouver que les usagers préfèrent les longs textes.
    - À illustrer la beauté des transports urbains.
    - À opposer la ville au monde scolaire.
    - À montrer que la lecture sert à remplir les temps morts.
    answer: 3
    explanation: 'L’auteur explique lui-même que ces exemples montrent comment on lit désormais pour «
      occuper une brèche » et « ne pas attendre ». Les autres options ne correspondent pas au passage
      : il n’est pas question d’un goût pour les longs textes, ni d’un éloge des transports, ni d’une
      opposition ville/école.'
- status: ok
