  item:
    slug: ce-c1-mot-professionnel
    cefr: C1
    origin: generated
    focus: sens de professionnaliser
    passage: |-
      Dans le secteur associatif, le verbe « professionnaliser » est devenu si fréquent qu’il semble aller de soi. Il apparaît dans les rapports d’activité, dans les demandes de subvention, dans les discours des fédérations et jusque dans les réunions de bénévoles. À l’entendre, il suffirait d’ajouter quelques procédures, un tableau de suivi, une personne salariée, voire un logiciel partagé, pour faire passer un groupe du bricolage à la maturité.

      Or l’article publié par la revue Vivre ensemble déconstruit cette évidence apparente. Il ne nie pas l’intérêt d’une meilleure organisation ; il rappelle au contraire qu’une association mal gérée peut épuiser ses forces dans des tâches répétitives. Mais il montre que le terme sert souvent à valider un déplacement plus profond : ce qui relevait d’une décision collective passe entre les mains de ceux qui maîtrisent le langage des appels à projets, des indicateurs et des échéances budgétaires. Les bénévoles, eux, sont invités à « se recentrer sur le terrain », formule flatteuse qui peut aussi signifier qu’on les éloigne du pouvoir de discuter l’orientation générale.

      L’auteur ne défend pas un amateurisme romantique. Il admet qu’une association qui grandit a besoin d’outils stables et de compétences reconnues. Son point est ailleurs : lorsque la professionnalisation devient le seul horizon, elle cesse d’être un moyen et devient une norme morale. On ne demande plus si l’action est juste ou utile ; on demande si elle est assez conforme aux usages du secteur. Et c’est là que le mot perd sa neutralité.
    prompt: Dans cet article, que signifie surtout « professionnaliser » ?
    options:
    - Rendre l’association plus dépendante des procédures.
    - Améliorer le confort des bénévoles.
    - Préparer un passage en entreprise.
    - Réserver les postes aux diplômés.
    answer: 0
    explanation: 'Le texte montre que le terme masque souvent une normalisation administrative et un transfert
      du pouvoir vers ceux qui maîtrisent les codes de gestion. Les autres réponses ne conviennent pas
      : il n’est pas question de confort, d’entreprise, ni d’une sélection fondée uniquement sur les diplômes.'
- status: ok
