  item:
    slug: ce-c1-don-sous-conditions
    cefr: C1
    origin: generated
    focus: autonomie associative
    passage: |-
      L’association Passage, qui accompagne des jeunes sortis du système scolaire, a refusé cette année une proposition de mécénat inhabituellement généreuse. La fondation Aster, en échange d’un soutien sur trois ans, demandait que son nom figure dans l’intitulé du programme et que certaines actions soient « davantage alignées sur les attentes du public visé », formule suffisamment vague pour paraître souple et suffisamment précise pour inquiéter.

      Dans un premier temps, plusieurs membres du conseil ont jugé l’offre difficile à refuser. Les loyers augmentent, les subventions diminuent, et les permanents passent déjà une partie de leur temps à chercher de quoi financer le mois suivant. Pourtant, le texte de réponse adopté par l’association montre que le montant ne faisait pas tout. Il rappelait qu’un partenaire qui choisit l’affichage, puis oriente les contenus, finit souvent par peser sur les priorités, même sans intervenir ouvertement dans les décisions. Ce n’est pas la censure qui menace d’abord ; c’est la dépendance, plus lente, plus polie, parfois plus efficace.

      La présidente de Passage ne ferme pas la porte à tout financement privé. Elle dit même comprendre que les associations aient besoin de ressources nouvelles. Mais elle refuse de confondre soutien et captation symbolique. Selon elle, accepter un label prestigieux en échange d’un ajustement progressif des activités reviendrait à déplacer la ligne sans l’annoncer. L’association préfère avancer plus lentement plutôt que de perdre, à terme, la maîtrise de son projet.
    prompt: Pourquoi le conseil de Passage refuse-t-il l’offre de la fondation ?
    options:
    - Parce que les conditions menaçaient son indépendance.
    - Parce que la somme proposée était insuffisante.
    - Parce que le programme ne concernait pas les jeunes.
    - Parce que le partenariat était juridiquement interdit.
    answer: 0
    explanation: 'Le texte insiste sur le risque de dépendance et sur la crainte de voir les priorités
      de l’association infléchies par le mécénat. Les autres propositions sont exclues par le document
      : l’offre est décrite comme généreuse, elle concerne bien les jeunes, et aucune interdiction légale
      n’est évoquée.'
