  item:
    slug: ce-c1-chroniques-de-quartier
    cefr: C1
    origin: generated
    focus: jugement sur la réforme
    passage: |-
      Le quotidien L’Observateur urbain a présenté, au printemps, une réforme qu’il décrit comme un « retour au terrain ». Sa page locale, jusque-là alimentée par trois journalistes, a été remplacée par une mosaïque de chroniques confiées à des habitants volontaires, à des commerçants, à des responsables d’associations et à quelques lecteurs réguliers. La rédaction explique vouloir « mieux entendre la ville » et « ouvrir le journal à ceux qu’il décrit ». Le vocabulaire est séduisant, presque généreux.

      Pourtant, à la lecture de la nouvelle formule, on peine à croire qu’il s’agisse d’abord d’un élargissement de la parole. Les sujets restent choisis au centre, les angles validés en interne, et les contributions les plus visibles sont celles qui ne demandent ni enquête longue ni vérification complexe. Autrement dit, l’invitation donnée aux habitants ressemble moins à une prise de pouvoir qu’à une délégation très encadrée. Le journal gagne des contenus à faible coût, tandis que les lecteurs fournissent une matière que la rédaction retravaille ensuite pour lui donner une allure cohérente.

      Le plus révélateur n’est peut-être pas là. C’est dans la façon dont la direction vante une proximité « plus authentique » au moment même où elle réduit les moyens consacrés au reportage. Comme souvent, la promesse d’ouverture accompagne une logique de rationalisation. La ville parle davantage, certes, mais elle parle selon les formes que le journal lui impose. Et cette nuance change tout.
    prompt: Quel jugement l’auteur porte-t-il sur cette réforme ?
    options:
    - Elle renforce enfin la qualité de l’information locale.
    - Elle élargit la parole tout en transférant le travail.
    - Elle ne modifie que la vitesse de publication.
    - Elle répond surtout à une attente de divertissement.
    answer: 1
    explanation: 'L’auteur souligne que la réforme donne l’impression d’ouvrir la parole, mais qu’elle
      sert surtout à récupérer des contenus à faible coût et à encadrer les contributions. Les autres
      propositions ne correspondent pas à cette critique : il ne parle ni d’un gain de qualité, ni d’un
      simple changement de rythme, ni d’un objectif ludique.'
