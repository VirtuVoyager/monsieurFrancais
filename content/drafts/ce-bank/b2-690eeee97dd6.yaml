      Quand fermer le dernier comptoir coûte plus cher

      Dans la vallée de Brévin, plusieurs communes ont perdu leur bureau de poste au profit d’un point relais installé dans une supérette. L’argument avancé par l’opérateur est connu : horaires élargis, dépenses réduites et meilleur rendement. Sur le papier, le calcul paraît rationnel. Dans les faits, les habitants ont surtout vu s’allonger le trajet pour retirer un colis recommandé, faire un envoi important ou obtenir un conseil plus technique. D’après le dernier baromètre local, les réclamations portent moins sur la qualité du service que sur sa disparition progressive à proximité du domicile.

      Cette évolution illustre un travers bien français : confondre gestion et service rendu. Quand l’unique critère devient la baisse des coûts, on finit souvent par déplacer la charge vers les usagers, qui perdent du temps, du carburant et parfois même l’envie d’utiliser le service public. Les décideurs parlent alors d’adaptation, mais ce mot masque mal une logique de retrait. Le point relais peut dépanner, certes, mais il ne suffit pas à garantir l’égalité d’accès. Pour un service de proximité, la question n’est pas seulement de savoir s’il fonctionne, mais s’il reste réellement à portée de ceux qui en ont besoin.
    prompt: Selon l'auteur, que risque une réforme fondée surtout sur les économies ?
    options:
    - D'améliorer la qualité du service.
    - De créer plus d'emplois locaux.
    - De renforcer l'égalité d'accès.
    - De déplacer la charge vers les usagers.
    answer: 3
    explanation: Le texte explique que, quand le critère principal est la baisse des coûts, la charge
      est déplacée vers les usagers qui doivent faire plus de trajet et perdre du temps. Les autres options
      vont à l’encontre du propos.
