      Les micro-logements, réponse utile ou simple affichage ?

      La ville de Montciel inaugure cette semaine une résidence de micro-logements destinée aux jeunes actifs et aux personnes en mobilité professionnelle. Les appartements font entre dix-huit et vingt-quatre mètres carrés, mais ils sont meublés, proches des transports et moins chers que la moyenne du marché local. La municipalité affirme que ce type d’offre permet de libérer rapidement des logements plus grands et de mieux utiliser les parcelles disponibles en centre-ville. Les premiers retours sont favorables, en particulier chez les salariés qui n’ont besoin d’un pied-à-terre que pour quelques mois.

      Le projet a le mérite d’exister, mais il serait excessif d’y voir une réponse globale à la crise du logement. D’abord, la surface réduite et la durée de séjour annoncée montrent bien qu’il s’agit d’un hébergement de transition. Ensuite, ce modèle ne convient ni aux familles, ni aux personnes qui cherchent à s’installer durablement. Enfin, l’abondance d’annonces très compactes peut donner l’illusion d’une politique ambitieuse alors qu’elle ne fait souvent que déplacer le problème. En pratique, les micro-logements rendent service à un public précis, sans résoudre la pénurie de fond ni l’écart entre les revenus et les loyers.
    prompt: Selon le texte, que faut-il penser des micro-logements ?
    options:
    - Ils constituent une solution durable pour tous.
    - Ils ne servent qu'à embellir les annonces.
    - Ils dépannent un public limité.
    - Ils sont trop grands pour les célibataires.
    answer: 2
    explanation: L’auteur parle d’un « hébergement de transition » qui « rend service à un public précis
      » sans résoudre la pénurie de fond. Cela correspond à l’idée qu’ils dépannent un public limité.
