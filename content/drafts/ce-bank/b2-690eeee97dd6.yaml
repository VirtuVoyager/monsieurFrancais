      Quand la dématérialisation oublie une partie du public

      La préfecture de Montserin s’est félicitée cette semaine du succès de son nouveau portail unique. En théorie, tout y est plus simple : prise de rendez-vous, dépôt de pièces, suivi du dossier et notification des décisions. Les délais de traitement ont bien diminué pour certaines demandes courantes, et l’administration y voit la preuve qu’un service plus numérique est forcément plus efficace. Pourtant, les associations d’usagers décrivent une autre réalité. D’après leur enquête, près d’un tiers des personnes de plus de soixante-cinq ans n’ont jamais réussi à finaliser seules une procédure en ligne. Même chez les actifs, le taux d’abandon reste élevé dès que le dossier devient un peu complexe.

      Le problème n’est donc pas la modernisation en elle-même, mais l’idée qu’un écran suffit à remplacer l’accompagnement humain. En transformant les démarches en parcours entièrement numériques, on transfère sur le citoyen une partie du travail de l’État, sans toujours lui donner les moyens de le faire. Le portail peut être pratique pour certains, mais il devient vite un filtre social pour d’autres. Tant que l’on n’aura pas maintenu des guichets accessibles et du personnel disponible, la promesse de simplicité restera inégale.
    prompt: Selon le texte, quel est le principal problème de la dématérialisation ?
    options:
    - Elle remplace totalement le papier.
    - Elle réduit les impôts locaux.
    - Elle laisse certains usagers sans solution.
    - Elle complique seulement les dossiers urgents.
    answer: 2
    explanation: L’article insiste sur les personnes qui n’arrivent pas à terminer une procédure en ligne
      et sur la nécessité de garder des guichets accessibles. Les autres propositions ne correspondent
      pas au sens du texte.
