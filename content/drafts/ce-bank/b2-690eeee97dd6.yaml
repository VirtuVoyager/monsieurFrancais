      Transformer des bureaux en logements : une piste séduisante, mais encadrée

      Avec la montée du télétravail, la capitale régionale de Saint-Aven a vu se vider une partie de ses immeubles de bureaux. La ville annonce qu’elle souhaite convertir une partie de cette surface inoccupée en appartements, afin d’accélérer l’offre de logements sans artificialiser de nouveaux terrains. Les chiffres donnent le vertige : près d’un million huit cent mille mètres carrés seraient aujourd’hui vacants dans l’agglomération. Sur le plan politique, l’idée plaît, car elle donne le sentiment d’une réponse rapide à la crise.

      Mais les professionnels du bâtiment rappellent que la réalité est moins simple. Beaucoup d’immeubles sont trop profonds, mal ventilés ou mal situés pour accueillir des habitations conformes. D’autres nécessitent des travaux lourds, notamment pour les issues de secours, l’isolation ou la lumière naturelle. Au final, seule une fraction des locaux pourra vraiment être transformée à coût raisonnable. C’est pourquoi les experts interrogés se montrent prudents : oui, il faut avancer sur cette piste, mais non, elle ne suffira pas à elle seule. Elle peut soulager certaines zones centrales et recycler un patrimoine vide ; elle ne remplacera jamais une politique de construction plus large et plus régulière.
    prompt: Pourquoi cette solution ne suffit-elle pas, selon le texte ?
    options:
    - Les immeubles sont tous protégés.
    - La plupart des locaux sont déjà occupés.
    - Les communes n'y voient aucun intérêt.
    - La transformation est techniquement limitée.
    answer: 3
    explanation: Le texte précise que beaucoup d’immeubles sont trop profonds, mal ventilés ou exigent
      des travaux lourds, ce qui limite fortement les transformations possibles. Les autres réponses ne
      sont pas appuyées par le document.
