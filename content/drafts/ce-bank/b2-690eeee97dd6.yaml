    passage: |-
      Des guichets mobiles pour ne pas laisser les villages à l’écart

      Dans la communauté de Valmont, l’administration a décidé de faire circuler deux véhicules équipés pour les démarches courantes : demandes d’état civil, renouvellement de titres, aide aux formulaires en ligne. Selon la mairie, près d’un habitant sur cinq renonce encore à certaines formalités parce qu’il habite trop loin du centre ou qu’il ne maîtrise pas les outils numériques. Depuis trois mois, les équipes se rendent deux fois par semaine dans les bourgs les plus isolés, et la fréquentation est réelle : les rendez-vous sont presque tous pris avant midi.

      L’initiative mérite d’être saluée. Elle rappelle que l’accès au service public ne devrait pas dépendre du code postal. Pour autant, le dispositif ne doit pas servir d’alibi. Un véhicule n’a pas vocation à remplacer des antennes fixes partout où la demande est durable. Les habitants ont aussi besoin de continuité, d’agents identifiés et de réponses complètes, pas d’un passage rapide entre deux tournées. Le vrai succès de cette politique se mesurera donc moins au nombre de kilomètres parcourus qu’à la capacité de la collectivité à maintenir une présence stable, même modeste, dans les zones les plus éloignées.
    prompt: Quel est l'avis de l'auteur sur ces guichets mobiles ?
    options:
    - Ils remplacent utilement les bureaux fermés.
    - Ils coûtent plus cher que prévu.
    - Ils concernent surtout les démarches touristiques.
    - Ils sont utiles, mais pas suffisants.
    answer: 3
    explanation: L’auteur dit que l’initiative « mérite d’être saluée », mais précise qu’elle ne doit
      pas servir d’« alibi » et qu’elle ne remplace pas une présence stable. Les autres propositions ne
      correspondent ni au jugement ni au contenu du texte.
