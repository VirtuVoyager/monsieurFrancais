      L’encadrement des loyers, un remède imparfait mais réel

      À Riveclaire, où le marché locatif est resté très tendu pendant des années, la municipalité publie des chiffres qui ont relancé le débat. Depuis la mise en place de l’encadrement des loyers, le loyer moyen des nouveaux baux a augmenté de 2,8 % en un an, contre 6,1 % l’année précédente. Dans les quartiers les plus recherchés, la hausse a nettement ralenti, et les services de contrôle ont relevé davantage de contrats conformes qu’au début du dispositif. En revanche, le nombre de logements proposés à la location a baissé de 11 % dans les secteurs où l’offre était déjà faible.

      Faut-il en conclure que la mesure échoue ? Ce serait aller trop vite. L’encadrement ne crée pas de logements, mais il limite les excès et redonne un peu d’air à des ménages qui consacraient une part trop importante de leurs revenus au loyer. Le vrai tort serait de lui demander de résoudre seul une crise qui vient aussi du manque de construction, de la spéculation et du gel de certains terrains. Pris isolément, le dispositif reste insuffisant ; intégré à une politique plus large, il demeure pourtant l’un des rares outils capables de freiner une flambée immédiate.
    prompt: Quelle est la position de l'auteur sur l'encadrement des loyers ?
    options:
    - Il est utile, mais ne suffit pas seul.
    - Il faut l'abandonner rapidement.
    - Il est efficace dans tous les cas.
    - Il profite surtout aux propriétaires.
    answer: 0
    explanation: Le texte affirme que la mesure « limite les excès » et qu’elle reste « l’un des rares
      outils » utiles, mais qu’elle est « insuffisante » seule. Les autres réponses contredisent clairement
      cette appréciation nuancée.
