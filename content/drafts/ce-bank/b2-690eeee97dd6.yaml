      Une chambre chez l’autre, et un peu plus qu’un toit

      Dans plusieurs villes universitaires, la cohabitation intergénérationnelle séduit de plus en plus. Le principe est simple : une personne âgée disposant d’une chambre libre accueille un étudiant en échange d’un loyer modeste, parfois complété par une présence rassurante le soir ou par de petits services du quotidien. Selon l’association Aurore-Logis, plus de deux mille quatre cents binômes ont été constitués en deux ans, avec un taux de maintien élevé au-delà du premier semestre. Les étudiants y trouvent un logement moins cher, les seniors rompent une solitude parfois pesante, et les communes y voient une manière d’optimiser un parc immobilier déjà existant.

      L’engouement est compréhensible. Pour autant, il faut éviter de présenter ce modèle comme la réponse miracle à la crise du logement. D’une part, il repose sur une vraie compatibilité de modes de vie, ce qui limite naturellement le nombre de candidatures. D’autre part, il concerne surtout des chambres disponibles, donc des situations particulières, et non des familles qui cherchent un appartement entier. En réalité, cette formule fonctionne parce qu’elle articule une aide concrète et un bénéfice réciproque. C’est une solution intelligente, mais ciblée, qui complète utilement d’autres dispositifs sans les remplacer.
    prompt: Que montre surtout l'article sur la cohabitation intergénérationnelle ?
    options:
    - Elle règle le manque de logements.
    - Elle profite surtout aux jeunes diplômés.
    - Elle concerne uniquement les grandes villes.
    - Elle apporte une aide réelle mais limitée.
    answer: 3
    explanation: Le texte parle d’une formule « intelligente, mais ciblée » qui « complète utilement d’autres
      dispositifs sans les remplacer ». Cela correspond à l’idée d’une aide réelle mais limitée, et non
      à une solution totale.
