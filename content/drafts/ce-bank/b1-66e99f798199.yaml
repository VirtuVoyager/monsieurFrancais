    passage: |-
      Bonjour Karim,
      Depuis que j’ai changé de quartier, je me suis rendu compte que je commandais trop souvent des repas tout prêts. À la fin du mois, la facture est énorme, et en plus je mange souvent n’importe quoi. J’ai donc décidé de faire les courses le samedi et de préparer plusieurs plats pour la semaine. J’ai même commencé à noter mes dépenses chaque soir, et cela m’aide déjà beaucoup. Si tu veux, viens dîner dimanche : je te montrerai mes recettes simples et mon petit tableau de budget. Tu verras, on peut se faire plaisir sans dépenser autant.
      À bientôt,
      Mina
    prompt: Pourquoi Mina écrit-elle cette lettre ?
    options:
    - Pour demander à Karim de déménager
    - Pour annoncer un voyage à l’étranger
    - Pour remercier Karim d’un cadeau
    - Pour parler de ses nouvelles habitudes et dépenser moins
    answer: 3
    explanation: Mina explique qu’elle commandait trop souvent des repas et qu’elle a décidé de mieux
      gérer ses achats pour réduire ses dépenses. Les autres propositions ne correspondent pas à son objectif.
