    cefr: C1
    origin: generated
    focus: fonction du paragraphe
    passage: |-
      Les applications qui composent automatiquement les menus de la semaine promettent une vie plus simple. En quelques clics, elles proposent des recettes selon le budget, l’âge des enfants, les restes du réfrigérateur ou le temps disponible. L’argument est séduisant : moins d’hésitation, moins de gaspillage, moins de courses inutiles. Pour beaucoup de familles débordées, l’outil a tout d’un allié discret.

      Mais le deuxième mouvement de l’argumentation est moins enthousiaste. À mesure que l’on délègue la préparation des repas à une suite d’algorithmes, le geste d’acheter perd sa part de discussion. On ne décide plus vraiment ensemble ce que l’on mangera ; on valide un programme. Le repas cesse d’être l’aboutissement d’une négociation domestique, d’un compromis entre envies, contraintes et improvisations. Il devient une succession d’options raisonnables, classées par efficacité.

      Cette normalisation a un coût difficile à mesurer. Elle ne prive pas seulement la cuisine de sa spontanéité ; elle modifie la manière dont une famille se représente elle-même. Faire ses courses n’est pas un simple acte technique : c’est aussi choisir quand on accepte de céder, quand on insiste, quand on varie. L’outil promet du temps, mais il réorganise en profondeur ce qui semblait relever des petits désordres ordinaires.
    prompt: Quel est le rôle du deuxième paragraphe ?
    options:
    - Décrire les fonctions techniques.
    - Montrer la perte de spontanéité.
    - Rappeler un exemple historique.
    - Prouver que les familles économisent toujours.
    answer: 1
    explanation: 'Le deuxième paragraphe introduit le contre-argument : la délégation aux algorithmes
      transforme un choix familial en validation de programme. Les autres propositions ne correspondent
      pas à cette fonction argumentative.'
