    slug: ce-c1-maison-partagee
    cefr: C1
    origin: generated
    focus: implicite sociétal
    passage: |-
      On parle beaucoup du retour des familles sous un même toit, comme s’il s’agissait d’un simple regain de tradition. L’image rassure : des grands-parents, des parents, parfois des adultes revenus après une séparation ou une période d’instabilité, tous réunis dans une même maison. Pourtant, les raisons de ce rapprochement sont rarement sentimentales seules. Elles tiennent autant au prix du logement qu’au besoin de garde, à la fragilité de certains emplois qu’au désir de ne pas vieillir isolé.

      La cohabitation intergénérationnelle est donc moins une restauration du passé qu’un arrangement avec le présent. Elle peut naître d’une contrainte, puis se transformer en ressource. Un couple qui accueille temporairement un parent malade y trouve parfois un soutien imprévu ; un jeune adulte qui revient habiter chez ses parents y cherche parfois une respiration financière ; un grand-parent qui partage les repas peut y gagner une place utile, à condition que cette utilité ne soit pas confondue avec une obligation de service.

      Les tensions ne disparaissent pas pour autant. Elles changent seulement de forme. Ce qui se négocie désormais n’est plus l’autorité d’un chef de famille, mais la frontière entre aide et dépendance, entre intimité et promiscuité, entre protection et intrusion. C’est sans doute pour cela que ces configurations réclament davantage qu’un discours sur la solidarité. Elles demandent une capacité à ajuster les rôles au lieu de les figer. Le foyer partagé n’est pas une solution magique ; c’est un équilibre provisoire que l’on rend vivable par des règles souples.
    prompt: Que suggère l’auteur à propos de ce retour sous un même toit ?
    options:
    - Il relève d’une mode sans lendemain.
    - Il résout tous les conflits familiaux.
    - Il concerne surtout les campagnes.
    - Il répond à des contraintes et à des choix.
    answer: 3
    explanation: Le texte insiste sur des causes concrètes — logement, garde, travail, isolement — puis
      sur des usages variés et ajustés. Les autres propositions sont trop catégoriques ou ne sont jamais
      établies.
