    focus: implicite critique
    passage: |-
      Les promotions qui rassurent

      À première vue, tout incite à croire que le consommateur moderne a gagné en liberté. Il compare, il clique, il fait jouer la concurrence, et les vitrines lui promettent sans relâche des prix « exceptionnels ». Pourtant, cette liberté a une curieuse manière de se présenter sous forme d’itinéraires très balisés. L’application lui suggère ce qu’il « pourrait aimer » ; le site lui rappelle qu’il ne reste plus que deux exemplaires ; la carte de fidélité lui offre une réduction à condition d’acheter davantage. Chaque geste semble relever de la décision personnelle, alors qu’il a souvent été préparé de longue date.

      Ce n’est pas que le consommateur soit dupe à chaque instant. Il sait bien, en théorie, qu’un rabais n’est pas une faveur. Mais il accepte de jouer parce que le jeu lui paraît avantageux : il a le sentiment de gagner du temps, d’économiser, de ne pas être exclu de la circulation générale des objets et des services. C’est là que réside l’efficacité du système : il ne contraint presque jamais de face, il oriente. Il ne dit pas « achetez », il murmure « ce serait dommage de laisser passer cela ».

      On comprend alors pourquoi tant de discours sur la sobriété échouent lorsqu’ils se contentent d’appeler à la raison individuelle. Le problème n’est pas seulement l’absence de retenue ; il tient à une mise en scène de la nécessité. Acheter devient un acte qui se présente comme prudent, puis comme normal, enfin comme inévitable. Le consommateur ne perd pas seulement de l’argent : il perd la possibilité de distinguer clairement le désir du réflexe.
    prompt: Quelle idée l’auteur défend-il surtout ?
    options:
    - Les consommateurs manquent d’éducation.
    - Les rabais compensent les achats inutiles.
    - La concurrence a disparu des marchés.
    - Les vendeurs fabriquent un sentiment de liberté.
    answer: 3
    explanation: 'Le texte insiste sur une liberté apparente, « préparée de longue date », puis sur un
      système qui « oriente » sans contraindre. Les autres propositions sont contredites ou trop absolues
      : l’auteur ne parle ni d’un manque d’éducation, ni d’un avantage réel des rabais, ni de la disparition
      de la concurrence.'
