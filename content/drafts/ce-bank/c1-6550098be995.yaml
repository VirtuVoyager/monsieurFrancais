  item:
    slug: ce-c1-dimanches-herites
    cefr: C1
    origin: generated
    focus: valeur implicite du souvenir
    passage: |-
      Les dimanches de mon enfance avaient une stabilité trompeuse. On disait que la famille se retrouvait autour de la table, mais en réalité chacun retrouvait surtout sa place. Ma mère quittait la cuisine à peine quelques minutes, le temps d’apporter le plat principal, puis elle repartait vérifier le four, couper le pain, répondre à une demande, replacer une serviette. Mon père parlait, comme on parle quand on est sûr que l’organisation matérielle suivra d’elle-même. Nous, les enfants, attendions la suite avec l’impatience tranquille de ceux qui n’ont pas à se soucier de l’ensemble.

      Longtemps, j’ai pris cette scène pour une évidence affectueuse. Il y avait du bruit, des rires, des phrases interrompues ; de là à voir une répartition inégale du travail, je n’y songeais pas. Ce n’est que plus tard que j’ai compris combien la convivialité peut masquer la mécanique qui la rend possible. Le repas familial est souvent célébré comme un lieu de lien ; on oublie qu’il repose aussi sur une logistique invisible, et que cette logistique repose rarement sur les mêmes épaules.

      Ce souvenir ne m’invite pas à condamner les repas d’autrefois ni à idéaliser ceux d’aujourd’hui. Il montre plutôt qu’une habitude, parce qu’elle est ancienne, se donne facilement les airs de la nature. On finit par croire que certaines personnes « aiment » recevoir, « aiment » préparer, « aiment » servir, alors qu’elles ont surtout appris à tenir la maison debout en silence. La nostalgie, ici, serait une forme de paresse morale.
    prompt: L’évocation des dimanches d’enfance sert surtout à montrer que...
    options:
    - les repas étaient autrefois plus calmes.
    - les enfants prenaient déjà part aux décisions.
    - la cuisine était au centre de toutes les disputes.
    - les rôles domestiques se transmettent sans être questionnés.
    answer: 3
    explanation: Le narrateur explique que la scène paraissait naturelle avant de révéler la « mécanique
      » et la répartition inégale du travail. Les autres choix reprennent des éléments du texte, mais
      ils ne disent pas ce que ce souvenir démontre.
