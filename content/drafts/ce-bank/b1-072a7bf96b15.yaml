  item:
    slug: ce-b1-train-touristique
    cefr: B1
    origin: generated
    focus: intention de l'auteur
    passage: 'Le vieux train touristique de la vallée reprend du service chaque week-end d''avril à septembre.
      Entre Lormont et Belair, il traverse trois ponts et longe les vergers avant d''arriver au village
      de Saint-Luce, où les passagers disposent d''une heure pour visiter le marché et prendre un café.
      Le billet comprend aussi un petit guide historique distribué à bord. Les responsables du syndicat
      touristique insistent : ce n''est pas un moyen de transport rapide, mais une manière de découvrir
      la région autrement, sans voiture. Cette année, un arrêt supplémentaire a été ajouté près du belvédère
      pour permettre aux randonneurs de commencer leur marche plus facilement.'
    prompt: Quel est le but principal de ce train ?
    options:
    - Transporter les voyageurs très vite
    - Faire découvrir la région aux voyageurs
    - Remplacer les bus urbains
    - Desservir l'aéroport
    answer: 1
    explanation: Le texte insiste sur la découverte de la région « autrement » et sur le caractère touristique
      du trajet. Il ne s’agit ni de rapidité, ni de bus urbains, ni de liaison vers un aéroport.
