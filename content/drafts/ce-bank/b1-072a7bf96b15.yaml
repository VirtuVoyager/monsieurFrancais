  item:
    slug: ce-b1-reprise-du-cine-club
    cefr: B1
    origin: generated
    focus: intention de l'auteur
    passage: Le Ciné-Agora a rouvert cette semaine dans la salle Iris, après plusieurs mois de travaux.
      Le lieu ne propose plus seulement des projections du vendredi soir. Désormais, chaque séance sera
      suivie d'un échange de vingt minutes animé par un critique local, et le programme changera chaque
      mois selon les votes des adhérents. La direction a aussi choisi de baisser le tarif pour les moins
      de vingt-cinq ans et d'ajouter une séance en après-midi le dimanche. Selon sa responsable, l'objectif
      n'est pas d'attirer les grands succès du moment, mais de faire venir un public plus large, y compris
      des personnes qui n'osaient pas entrer au cinéma. Le premier cycle sera consacré aux films d'aventure.
    prompt: Quel est l'objectif principal du Ciné-Agora ?
    options:
    - Vendre plus de popcorn
    - Diffuser uniquement des nouveautés
    - Fermer le dimanche
    - Attirer un public plus varié
    answer: 3
    explanation: 'Le texte précise que la responsable veut « faire venir un public plus large ». Les autres
      propositions ne correspondent pas : il n’est pas question de nourriture, d’exclusivité des nouveautés
      ni de fermeture.'
