  item:
    slug: ce-b1-covoiturage-culturel
    cefr: B1
    origin: generated
    focus: idée principale
    passage: 'Pour faciliter les sorties au théâtre et au musée, la ville de Bréval lance une nouvelle
      plateforme de covoiturage baptisée « Sorties ensemble ». Le principe est simple : les habitants
      qui vont au même spectacle ou au même concert peuvent proposer une place libre dans leur voiture
      et partager les frais de route. La mairie espère réduire les problèmes de stationnement autour des
      salles culturelles, surtout le samedi soir. Les usagers pourront aussi signaler s''ils partent tôt
      ou s''ils souhaitent rentrer juste après la représentation. Le service est gratuit, mais il faut
      créer un compte avec une adresse électronique. Selon les premiers tests, ce système intéresse surtout
      les personnes qui vivent en périphérie et n''ont pas de bus après 22 heures.'
    prompt: De quoi parle cet article ?
    options:
    - D'une hausse du prix des places
    - De la fermeture des musées
    - D'un nouveau parking couvert
    - D'une plateforme de covoiturage pour les sorties
    answer: 3
    explanation: 'L’article présente une plateforme qui permet de partager sa voiture pour aller à des
      sorties culturelles. Les autres réponses ne correspondent pas au contenu : il n’est ni question
      d’augmenter les tarifs, ni de fermer des lieux, ni de construire un parking.'
