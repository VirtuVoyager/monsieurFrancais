  item:
    slug: ce-b1-travaux-du-tram
    cefr: B1
    origin: generated
    focus: idée principale
    passage: Depuis ce lundi, les voyageurs de la ligne de tram T3 doivent s'organiser autrement. La circulation
      est interrompue entre la gare Saint-Pierre et le quartier du Port jusqu'au 18 septembre, en raison
      de travaux sur les rails. Pendant toute la durée du chantier, des bus de remplacement desserviront
      les mêmes arrêts, mais leur trajet sera légèrement plus long. La société de transport conseille
      aux passagers de prévoir dix minutes de marge, surtout aux heures de pointe. Les commerces du secteur
      restent ouverts, et les abonnés peuvent utiliser leur carte habituelle dans les bus. Les conducteurs
      espèrent une reprise normale avant la rentrée d'octobre, si les conditions météo ne retardent pas
      le chantier.
    prompt: Quelle est l'idée principale du texte ?
    options:
    - Un nouveau tram est inauguré
    - Le billet coûte moins cher
    - Les commerces ferment pour l'été
    - Le tram est modifié temporairement
    answer: 3
    explanation: Le texte annonce une interruption temporaire et des bus de remplacement à cause de travaux.
      Il ne s’agit ni d’une inauguration, ni d’un changement de prix, ni d’une fermeture des commerces.
