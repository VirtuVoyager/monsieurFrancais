  item:
    slug: ce-b1-festival-litteraire
    cefr: B1
    origin: generated
    focus: idée principale
    passage: 'Du 8 au 10 juillet, la ville de Montreval accueillera la première édition de « Pages d''été
      ». L''événement ne sera pas réservé aux lecteurs passionnés : les organisateurs ont prévu des rencontres
      avec trois auteurs, des lectures dans le jardin public, un atelier d''écriture pour adolescents
      et deux concerts en soirée. Les livres resteront au centre de la programmation, mais l''idée est
      d''offrir des activités différentes pour que chacun puisse y trouver sa place. Les billets vendus
      à l''avance donnent aussi accès à une visite commentée de l''ancienne imprimerie, transformée depuis
      peu en salle d''exposition. La mairie espère ainsi faire du festival un rendez-vous culturel plus
      vivant qu''une simple suite de conférences.'
    prompt: De quoi parle surtout cet article ?
    options:
    - D'un concours de romans
    - D'une fermeture de salle
    - Du programme varié d'un festival
    - D'une grève des libraires
    answer: 2
    explanation: 'L’article présente surtout les différentes activités prévues pour « Pages d''été ».
      Les autres propositions ne sont pas développées : il n’y a ni concours, ni fermeture, ni grève.'
