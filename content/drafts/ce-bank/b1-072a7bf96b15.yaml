    cefr: B1
    origin: generated
    focus: détail important
    passage: À l'occasion de la Fête des quais, le réseau Urbis met en place deux lignes de bus de nuit,
      N1 et N2, du vendredi au dimanche inclus. Les départs auront lieu toutes les vingt minutes entre
      onze heures du soir et deux heures du matin. Pour le retour, les arrêts seront marqués près de la
      place des Halles, du théâtre municipal et du parc des Érables. Le dernier départ de la ligne N1
      est fixé à une heure quarante au départ de la place des Halles ; après cette heure, il n'y aura
      plus de passage jusqu'au lendemain. Les usagers sont invités à préparer leur titre de transport
      à l'avance afin de monter plus rapidement.
    prompt: Jusqu'à quelle heure part le dernier bus de la ligne N1 ?
    options:
    - Une heure quarante
    - Deux heures
    - Onze heures
    - Vingt heures
    answer: 0
    explanation: 'Le document donne clairement l’horaire du dernier départ : une heure quarante. Deux
      heures est l’heure de fin du service, onze heures est l’heure de début, et vingt heures ne correspond
      pas au texte.'
