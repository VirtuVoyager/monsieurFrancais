    passage: |-
      Livrer la ville autrement

      Dans le centre de Lormont, plusieurs commerces ont adopté la livraison à vélo cargo pour les petits colis. L’étude menée sur six mois montre que chaque vélo remplace en moyenne six utilitaires sur les trajets de moins de trois kilomètres, avec à la clé moins de bruit, moins d’embouteillages et des livraisons souvent plus rapides aux heures de pointe. Pour les rues étroites, où le stationnement est difficile, l’intérêt est évident.

      Cependant, l’auteur refuse de présenter cette pratique comme une solution miracle. Les vélos cargo ne conviennent ni aux marchandises lourdes, ni aux longues distances, ni aux quartiers mal desservis par des pistes cyclables. Plusieurs commerçants interrogés soulignent aussi qu’il faut des points de chargement bien placés pour éviter de perdre du temps entre deux tournées.

      Le texte défend donc une approche pragmatique : la ville n’a pas besoin d’opposer vélo et camion, mais de réserver chaque mode de transport aux situations où il est le plus pertinent. En clair, le vélo cargo n’est pas l’avenir unique de la logistique urbaine ; il en est une composante efficace, à condition que l’aménagement urbain suive.
    prompt: Quelle est l’idée principale du texte ?
    options:
    - Le vélo cargo est utile dans certains trajets urbains.
    - Le camion reste le seul moyen efficace en ville.
    - La livraison à vélo est toujours plus rapide.
    - Les commerces doivent abandonner leurs livraisons.
    answer: 0
    explanation: Le texte montre des avantages concrets, mais aussi des limites claires, et conclut à
      une utilisation ciblée. Les autres options sont trop absolues ou contraires au texte.
