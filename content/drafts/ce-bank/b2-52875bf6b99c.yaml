  item:
    slug: ce-b2-fuites-deau
    cefr: B2
    origin: generated
    focus: ce qu’on apprend dans le texte
    passage: |-
      Des capteurs contre les fuites

      Dans plusieurs immeubles anciens de la ville de Bréval, des capteurs connectés ont été installés sur les compteurs d’eau. Leur rôle : alerter le syndic lorsqu’une consommation inhabituelle laisse penser qu’une fuite s’est déclarée. Après huit mois d’expérimentation, le bilan est intéressant : les pertes d’eau ont diminué de 35 %, et trois dégâts importants ont été détectés avant d’endommager les appartements voisins.

      Mais le système ne fait pas l’unanimité. Certains habitants jugent les messages trop fréquents, notamment lorsque des pics de consommation sont provoqués par des fêtes de famille ou des travaux. D’autres s’inquiètent de la manière dont les données sont conservées : qui y a accès, combien de temps, et dans quel but ? Les gestionnaires répondent que les relevés sont anonymisés, mais reconnaissent que la confiance dépendra de règles plus claires.

      L’article n’affirme donc pas que la technologie suffit à elle seule. Au contraire, il montre qu’un outil efficace peut devenir contesté s’il n’est pas accompagné d’un cadre transparent et d’une maintenance régulière. Le résultat est positif, mais seulement si l’on accepte que la technique, à elle seule, ne remplace ni la vigilance humaine ni des règles de gestion précises.
    prompt: Qu’apporte surtout le texte ?
    options:
    - La technologie est utile, mais elle doit être encadrée.
    - Les capteurs suppriment tous les problèmes d’eau.
    - Les habitants refusent toute nouveauté technique.
    - Les fuites n’existent que dans les grands immeubles.
    answer: 0
    explanation: Le bilan est positif, mais le texte insiste sur la nécessité de règles transparentes
      et d’un suivi humain. Les autres propositions ne correspondent pas au contenu.
