      Le reconditionné, un choix secondaire ?

      Chaque année, des millions de téléphones, d’ordinateurs portables et de tablettes quittent les rayons alors qu’ils fonctionnent encore très bien. Or, selon une enquête publiée dans un magazine spécialisé, la remise en état d’un appareil émet en moyenne six fois moins de gaz à effet de serre que la fabrication d’un modèle neuf. Mieux encore, 1,8 million d’équipements ont été reconditionnés l’an dernier dans le pays, un chiffre en hausse de 22 %.

      Le bilan écologique est donc net. Pourtant, les obstacles persistent : certains consommateurs doutent de la garantie, d’autres redoutent une batterie usée ou l’absence de pièces de rechange. L’article rappelle aussi que les administrations, les écoles et les entreprises ont un rôle décisif, car leurs achats en volume peuvent faire basculer le marché.

      Pour l’auteur, le reconditionné ne doit plus être perçu comme une solution de seconde zone réservée aux budgets serrés. Il devrait devenir un réflexe normal chaque fois que l’usage prévu ne justifie pas l’achat d’un appareil flambant neuf. Dans cette perspective, la vraie modernité n’est pas de remplacer plus vite, mais de faire durer davantage ce que l’on possède déjà.
    prompt: Comment l’auteur voit-il le matériel reconditionné ?
    options:
    - Comme une solution normale à privilégier.
    - Comme une option trop risquée pour être fiable.
    - Comme un marché utile seulement aux administrations.
    - Comme un choix réservé aux appareils défectueux.
    answer: 0
    explanation: L’auteur dit explicitement que le reconditionné devrait devenir un réflexe normal, pas
      un pis-aller. Les autres options restreignent ou déforment sa position.
