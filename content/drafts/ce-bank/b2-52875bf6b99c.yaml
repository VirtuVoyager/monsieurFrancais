  item:
    slug: ce-b2-prime-a-reparer
    cefr: B2
    origin: generated
    focus: ce qu’on apprend dans le texte
    passage: |-
      Réparer, enfin rentable ?

      Un an après l’élargissement de la prime à la réparation, le ministère de la Transition écologique publie un premier bilan encourageant. Sur la période, le nombre d’appareils pris en charge par des ateliers labellisés a augmenté de 9 % à 17 % selon les catégories, tandis que 3 200 tonnes de déchets ont été évitées. Les téléviseurs et les machines à laver figurent parmi les objets les plus souvent réparés, car la réduction de prix y est désormais significative.

      Mais l’étude met aussi en lumière une fracture territoriale. Dans les grandes agglomérations, les consommateurs trouvent facilement un réparateur en moins de dix kilomètres. À l’inverse, dans certaines zones rurales, il faut parcourir plus de trente kilomètres, voire renoncer faute de professionnel agréé. Résultat : la prime est bien utilisée là où l’offre existe déjà, beaucoup moins ailleurs.

      Pour l’auteur du rapport, l’aide publique a donc prouvé son efficacité, mais elle ne suffit pas à elle seule. Sans réseau d’ateliers, sans pièces détachées disponibles et sans information claire au moment de l’achat, le réflexe de réparation reste fragile. La mesure fonctionne, conclut-il, à condition d’être accompagnée d’une politique plus large en faveur de la durée de vie des équipements.
    prompt: Qu’apprend-on surtout dans ce texte ?
    options:
    - Les téléviseurs sont devenus les objets les plus jetés.
    - La prime marche, mais seulement si l’offre de réparation suit.
    - Les zones rurales reçoivent davantage d’aide que les villes.
    - La réparation a remplacé l’achat de neuf partout.
    answer: 1
    explanation: Le bilan est positif, mais le texte insiste sur la nécessité d’un réseau de réparateurs
      et de pièces détachées. Les autres options déforment les données ou inversent la situation décrite.
