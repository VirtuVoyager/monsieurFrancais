  item:
    slug: ce-b2-chaleur-des-serveurs
    cefr: B2
    origin: generated
    focus: conséquence implicite
    passage: |-
      Quand les serveurs chauffent des logements

      Dans le quartier des Rives, un centre de données alimente désormais le réseau de chaleur municipal. La chaleur produite par ses serveurs, auparavant dissipée dans l’air, est récupérée puis envoyée vers deux ensembles d’immeubles et une école. Selon la société exploitante, ce dispositif couvre près de 12 % des besoins de chauffage du secteur pendant l’hiver et permet d’éviter l’émission de plusieurs centaines de tonnes de CO2 par an.

      L’idée séduit, car elle donne une seconde vie à une énergie perdue. Toutefois, les ingénieurs interrogés dans l’article rappellent que la solution n’a rien d’automatique. Elle exige une proximité géographique entre le centre de données et les bâtiments à chauffer, un investissement élevé dans les conduites, ainsi qu’une activité informatique relativement stable. Quand les serveurs tournent moins, la chaleur récupérable baisse aussi.

      L’auteur se montre donc favorable, mais refuse l’enthousiasme facile. Pour lui, ces projets ont de la valeur lorsqu’ils s’intègrent à une planification urbaine cohérente ; ils deviennent moins convaincants dès qu’on les présente comme une réponse universelle à la transition énergétique. La récupération de chaleur n’est pas un slogan : c’est un outil parmi d’autres, utile dans certains cas précis.
    prompt: Que suggère implicitement l’auteur ?
    options:
    - Elle suffit à elle seule pour chauffer une ville.
    - Elle fonctionne surtout quand les serveurs s’arrêtent.
    - Cette solution est prometteuse, mais elle reste limitée.
    - Elle ne réduit jamais les émissions.
    answer: 2
    explanation: Le texte souligne des avantages réels, mais aussi des contraintes de distance, de coût
      et d’activité. Les autres réponses contredisent directement ces éléments.
