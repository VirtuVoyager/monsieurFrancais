    focus: idée principale
    passage: |-
      IA et énergie : sortir du faux débat

      À entendre certains discours, l’intelligence artificielle serait soit une menace absolue pour le climat, soit une invention totalement anodine. La réalité est plus nuancée. Une étude publiée cette semaine rappelle qu’une simple requête textuelle consomme relativement peu, mais que l’usage massif de modèles complexes, notamment pour l’image et la vidéo, finit par peser sur les centres de données. Dans le même temps, les auteurs soulignent que ces outils permettent aussi de réduire certaines dépenses : une entreprise de logistique a par exemple diminué de 40 % le temps passé à rédiger des comptes rendus internes grâce à un modèle local, moins gourmand qu’un service distant.

      Le vrai enjeu n’est donc pas de sacraliser l’IA ni de la condamner en bloc, mais de distinguer les usages. Faut-il générer dix versions d’un même slogan ou réserver les calculs lourds à des tâches réellement utiles ? Faut-il exiger des fournisseurs qu’ils publient leur consommation électrique et la part d’énergies renouvelables utilisée ? C’est à ces questions qu’il faut répondre si l’on veut éviter que la technologie ne progresse en silence, tandis que sa facture écologique est supportée par tous.

      En somme, l’auteur plaide pour une utilisation plus sélective et plus transparente des outils d’IA.
    prompt: Quel est le message principal du texte ?
    options:
    - Il faut bannir l’IA au nom de l’écologie.
    - L’IA n’a aucun impact énergétique.
    - Il faut mesurer et limiter certains usages de l’IA.
    - Les modèles locaux sont toujours moins performants.
    answer: 2
    explanation: Le texte défend une utilisation sélective, avec des données de consommation publiées.
      Il ne prône ni l’interdiction, ni l’innocuité totale de l’IA, ni une supériorité systématique des
      modèles locaux.
