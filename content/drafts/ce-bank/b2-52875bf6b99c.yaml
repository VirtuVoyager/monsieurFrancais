    passage: |-
      Tarifs électriques : qui gagne, qui perd ?

      Depuis l’an dernier, plusieurs fournisseurs proposent des tarifs dynamiques : l’électricité coûte moins cher à certaines heures, plus cher à d’autres. L’objectif affiché est simple : déplacer une partie de la consommation vers les moments où le réseau est moins sollicité. D’après les premiers relevés, les foyers qui peuvent programmer leurs usages – lave-linge, recharge d’un vélo électrique, chauffe-eau – réalisent des économies de 8 à 12 % sur leur facture.

      Le problème apparaît dès qu’on regarde la situation de plus près. Les ménages qui travaillent tôt le matin, les familles nombreuses ou les logements chauffés à l’électricité disposent de marges de manœuvre bien plus réduites. Pour eux, la facture peut même augmenter, car on ne choisit pas toujours l’heure à laquelle on rentre, on cuisine ou on se chauffe. Le mécanisme récompense donc la flexibilité plus qu’il ne récompense la sobriété.

      L’auteur ne rejette pas l’idée, mais il en pointe clairement l’effet social. À ses yeux, un tarif variable peut être pertinent s’il reste lisible et s’accompagne de protections pour les usagers les plus contraints. Sans cela, il risque de transformer une innovation présentée comme écologique en outil de tri entre ceux qui peuvent adapter leur vie et ceux qui ne le peuvent pas.
    prompt: Quelle idée implicite se dégage du texte ?
    options:
    - Ils simplifient la vie de tous les ménages.
    - Ils ne concernent que les grandes entreprises.
    - Ces tarifs peuvent creuser les inégalités.
    - Ils font baisser la facture sans effort.
    answer: 2
    explanation: Le texte explique que les foyers flexibles gagnent, tandis que d’autres peuvent payer
      plus. Cela implique un risque d’inégalités, contrairement aux autres propositions.
