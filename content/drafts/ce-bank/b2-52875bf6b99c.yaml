    passage: |-
      Arrosage intelligent : la promesse, et ses limites

      Depuis le printemps, la ville de Valmont teste dans trois parcs un système d’arrosage piloté par des capteurs d’humidité. Quand la terre est suffisamment sèche, les tuyaux s’activent ; sinon, l’eau est coupée automatiquement. Selon la municipalité, la consommation a baissé de 28 % en quatre mois, et les équipes techniques ont réduit de 15 % leurs tournées. À première vue, l’opération semble donc gagnante.

      Il serait toutefois naïf d’y voir une solution miracle. Les capteurs ne détectent ni les fuites dans les canalisations, ni l’effet d’une vague de chaleur prolongée sur certaines espèces fragiles. Surtout, les jardiniers doivent encore interpréter les données et ajuster les réglages : sans suivi humain, le système se trompe autant qu’il économise. La ville a d’ailleurs dû remplacer plusieurs sondes mal installées par des modèles plus précis.

      L’intérêt de cette technologie n’est pas de supprimer le métier de terrain, mais de lui éviter des tâches répétitives et de mieux cibler les interventions. Autrement dit, l’arrosage « intelligent » devient réellement pertinent lorsqu’il s’inscrit dans une stratégie globale de gestion de l’eau, et non lorsqu’on l’utilise comme un gadget destiné à afficher une modernité de façade.
    prompt: Quelle est la position de l’auteur sur ce système ?
    options:
    - Il remplace avantageusement les jardiniers.
    - Il coûte trop cher pour être testé.
    - Il ne sert qu’en période de chaleur.
    - Il est utile, mais doit rester encadré.
    answer: 3
    explanation: L’auteur dit que le système réduit la consommation, mais qu’il ne fonctionne bien qu’avec
      un suivi humain et une stratégie globale. Les autres propositions vont trop loin ou contredisent
      le texte.
