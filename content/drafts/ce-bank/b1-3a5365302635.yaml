  item:
    slug: ce-b1-week-end-sans-voiture
    cefr: B1
    origin: generated
    focus: intention de l'auteur
    passage: 'Passer un week-end sans voiture est plus simple qu’on ne le pense, écrit une journaliste
      spécialisée dans les voyages. Dans son article, elle raconte une formule proposée dans une vallée
      : arrivée en train, transfert en navette électrique, randonnée à pied et nuit chez des hôtes locaux.
      Selon elle, ce type de séjour permet de découvrir un territoire plus lentement et de mieux soutenir
      les petites entreprises de la région. Elle insiste sur le fait qu’il ne s’agit pas de renoncer au
      confort, mais de changer ses habitudes pour quelques jours. Pour elle, ce sont souvent les trajets
      les plus courts qui laissent les meilleurs souvenirs.'
    prompt: Quel est le but de l’article ?
    options:
    - présenter une station balnéaire de luxe
    - comparer plusieurs compagnies ferroviaires
    - annoncer des travaux dans une vallée
    - montrer qu’un séjour écologique peut être agréable
    answer: 3
    explanation: L’article cherche à convaincre que voyager sans voiture peut rester plaisant et confortable.
      Il ne s’agit ni d’une présentation de luxe, ni d’une comparaison de compagnies, ni d’une annonce
      de travaux.
