  item:
    slug: ce-b1-restes-au-restaurant
    cefr: B1
    origin: generated
    focus: idée principale
    passage: 'Dans plusieurs rues du centre-ville, des restaurants testent depuis un mois un même principe
      : proposer automatiquement une petite part d’entrée et permettre au client de demander davantage
      s’il le souhaite. Selon les gérants, cette méthode plaît car elle évite de jeter des assiettes presque
      pleines. Elle est aussi appréciée par les personnes qui n’ont pas très faim à midi. L’association
      Mangeons juste, à l’origine du projet, espère convaincre d’autres établissements de suivre cet exemple
      avant l’été. Plusieurs restaurateurs disent déjà que leurs clients prennent moins de nourriture
      qu’avant, sans que le plaisir du repas soit remis en cause, en général.'
    prompt: De quoi parle surtout l’article ?
    options:
    - de la création d’un nouveau menu touristique
    - de la fermeture des restaurants du centre
    - de la promotion des repas plus chers
    - de la réduction du gaspillage dans les restaurants
    answer: 3
    explanation: 'L’article met en avant une solution pour jeter moins de nourriture. Les autres choix
      ne correspondent pas : il n’est question ni de fermeture, ni de tourisme, ni de hausse des prix.'
