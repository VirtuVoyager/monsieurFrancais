    focus: détail important
    passage: |-
      Service de restauration

      À partir du lundi trois avril, la commande des repas devra être faite avant onze heures, et non plus avant midi. Ce changement nous permettra de préparer le nombre exact de portions et de réduire les restes. La salle du rez-de-chaussée restera ouverte, mais seuls les plats réservés à l’avance y seront servis. Les personnes qui souhaitent un repas végétarien devront le préciser au moment de la commande. Merci de respecter ces nouvelles consignes afin de faciliter le travail de l’équipe. Un affichage sera installé à l’entrée pour rappeler ces changements chaque matin, dès lundi, aux salariés.
    prompt: Qu’est-ce qui change dès lundi ?
    options:
    - la salle du rez-de-chaussée sera fermée
    - les repas seront désormais gratuits
    - les plats chauds disparaissent du menu
    - les commandes doivent être faites avant onze heures
    answer: 3
    explanation: Le texte dit clairement que la commande devra être passée avant onze heures. La salle
      reste ouverte, les repas ne deviennent pas gratuits et les plats chauds ne sont pas supprimés.
