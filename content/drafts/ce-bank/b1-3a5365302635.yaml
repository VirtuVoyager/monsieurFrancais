  item:
    slug: ce-b1-train-de-nuit
    cefr: B1
    origin: generated
    focus: détail important
    passage: |-
      Salut Nora,

      Je t’écris depuis le train de nuit qui nous mène à Porto-Elia. Finalement, nous n’avons pas pris la voiture comme prévu, car la route de montagne est encore en travaux et le parking près du port coûte trop cher. Le train nous a semblé plus simple : on monte le soir, on dort un peu et on arrive demain matin sans avoir à chercher un hôtel pour une seule nuit. En plus, les billets achetés tôt étaient moins chers que l’essence et les péages. Je t’en dirai plus quand nous serons installés. Nous voyageons enfin sans stress et sans fatigue inutile.

      Bises,
      Mina
    prompt: Pourquoi Mina a-t-elle renoncé à la voiture ?
    options:
    - le port était fermé
    - ils ont raté leur train
    - la route de montagne était en travaux et le parking coûtait trop cher
    - ils cherchaient un hôtel de luxe
    answer: 2
    explanation: Mina précise que la route de montagne est encore en travaux et que le parking près du
      port coûte trop cher. Les autres options ne donnent pas la raison mentionnée dans la lettre.
