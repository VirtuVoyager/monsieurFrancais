    passage: Partir en voyage hors vacances scolaires n’a rien d’ennuyeux, affirme l’auteur de cet article.
      Au contraire, on y gagne souvent des prix plus bas, des rues moins bondées et un contact plus facile
      avec les habitants. Dans certaines villes, les musées restent ouverts, les cafés sont plus calmes
      et les visites guidées prennent davantage de temps. L’auteur reconnaît que tous les services ne
      fonctionnent pas toujours au même rythme, mais il estime que cette souplesse est largement compensée
      par le confort du séjour. Il conseille donc de regarder le calendrier avant de réserver. L’auteur
      s’adresse surtout aux voyageurs qui hésitent encore.
