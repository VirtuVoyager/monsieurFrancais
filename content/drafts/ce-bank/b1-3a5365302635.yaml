  item:
    slug: ce-b1-carte-des-visiteurs
    cefr: B1
    origin: generated
    focus: idée principale
    passage: La ville de Saint-Cerf vient de lancer une carte destinée aux visiteurs qui restent deux
      ou trois jours. En l’achetant une seule fois, on peut utiliser le tram, le bateau-bus et les vélos
      en libre-service sans payer à chaque trajet. La carte donne aussi une réduction dans cinq musées
      et dans certains cafés du vieux port. La municipalité espère ainsi encourager les touristes à laisser
      leur voiture à l’extérieur du centre. Le dispositif sera testé jusqu’en septembre, puis évalué par
      les habitants et les professionnels. Des informations seront aussi affichées sur le site de la ville.
    prompt: À quoi sert principalement cette carte ?
    options:
    - à offrir des visites guidées gratuites
    - à remplacer tous les hôtels du centre
    - à faciliter les déplacements des visiteurs
    - à réserver des places au musée
    answer: 2
    explanation: Le texte explique que la carte permet surtout de se déplacer facilement dans la ville.
      Les réductions dans les musées existent, mais ce n’est pas son but principal ; les autres propositions
      ne sont pas indiquées.
