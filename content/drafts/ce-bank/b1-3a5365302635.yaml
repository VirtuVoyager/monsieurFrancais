    focus: intention de l'auteur
    passage: |-
      Bonjour Julien,

      J’ai pensé à toi en recevant, depuis trois semaines, le panier de légumes de la ferme Lenoir. Au début, j’étais sceptique, mais les produits sont très frais et je ne perds plus de temps à faire les courses après le travail. Le mercredi, je trouve la recette dans le courrier électronique du producteur, et cela m’aide à varier les repas. Même Paul a recommencé à manger des soupes ! Si tu cherches une solution simple pour mieux cuisiner sans y passer la soirée, je te conseille d’essayer au moins un mois. Le panier arrive le vendredi, ce qui me laisse le week-end pour cuisiner.

      À bientôt,
      Camille
    prompt: Pourquoi Camille écrit-elle à Julien ?
    options:
    - pour lui proposer une solution pratique pour les repas
    - pour lui raconter un voyage à la campagne
    - pour lui demander de préparer un grand dîner
    - pour lui annoncer un changement de travail
    answer: 0
    explanation: 'Camille explique son expérience avec le panier de légumes et conseille à Julien d’essayer
      cette formule. Les autres réponses ne sont pas le but de la lettre : elle ne parle ni d’un voyage,
      ni d’un dîner, ni d’un travail.'
