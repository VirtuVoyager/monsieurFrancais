    slug: ce-b1-cantine-renovee
    cefr: B1
    origin: generated
    focus: intention de l'auteur
    passage: 'La direction de l’entreprise Valmonta a décidé de revoir la pause déjeuner. À partir de
      lundi, la cantine proposera deux formules simples : un plat chaud préparé sur place et un assortiment
      froid à emporter. Les employés pourront réserver leur repas jusqu’à dix heures sur l’intranet, ce
      qui permettra d’éviter les files d’attente. L’objectif est aussi de limiter le gaspillage grâce
      à des quantités mieux adaptées. Une enquête menée en juin a montré que beaucoup de salariés voulaient
      manger plus vite sans renoncer à des produits frais. Une note interne précisera les modalités de
      réservation et les horaires de retrait dès lundi.'
    prompt: Quel est l’objectif principal du texte ?
    options:
    - annoncer une nouvelle organisation du déjeuner
    - décrire un concours de cuisine
    - expliquer une hausse des prix
    - inviter les salariés à dîner dehors
    answer: 0
    explanation: 'Le texte présente surtout les changements prévus pour la cantine et leur but. Les autres
      propositions ne correspondent pas : il n’y a ni concours, ni hausse des prix, ni invitation à sortir
      déjeuner.'
