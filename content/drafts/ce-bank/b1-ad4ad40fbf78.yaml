  item:
    slug: ce-b1-arrosage-du-parc
    cefr: B1
    origin: generated
    focus: idée principale
    passage: La ville de Montrevert va modifier l’arrosage de son grand parc municipal. Jusqu’ici, les
      pelouses et les massifs étaient arrosés à heures fixes, même après une pluie. Désormais, des capteurs
      mesureront l’humidité du sol et déclencheront l’arrosage seulement lorsque cela sera nécessaire.
      Le système fonctionnera surtout la nuit, afin de limiter l’évaporation. Selon le service des espaces
      verts, cette mesure permettra de préserver la qualité des plantations tout en réduisant la consommation
      d’eau. Les jardiniers continueront à surveiller les zones les plus fragiles, notamment les jeunes
      arbres et les fleurs de saison. La mairie précise que l’installation des nouveaux capteurs se fera
      en plusieurs étapes, sans fermer le parc au public. Une campagne d’information sera affichée à l’entrée
      dès la semaine prochaine.
    prompt: Quel est l’objectif principal de cette mesure ?
    options:
    - Augmenter les horaires du parc
    - Remplacer les jardiniers
    - Fermer le parc le soir
    - Économiser l’eau d’arrosage
    answer: 3
    explanation: 'Le texte dit clairement que le nouveau système sert à « réduire la consommation d’eau
      ». Les autres propositions ne sont pas l’objectif annoncé : le parc reste ouvert, les jardiniers
      ne sont pas remplacés et les horaires ne changent pas.'
