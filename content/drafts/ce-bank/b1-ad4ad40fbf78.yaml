      Bonjour,

      Dans le cadre de la mise à jour de notre système informatique, toutes les équipes doivent transférer leurs dossiers de travail sur le serveur partagé avant vendredi dix-huit heures. Merci de conserver une copie locale jusqu’à la validation par le service informatique, car certains fichiers devront être vérifiés manuellement. Les dossiers concernés sont ceux de l’année en cours seulement ; les archives resteront dans leur emplacement actuel.

      Pour éviter toute perte, nommez clairement les fichiers et ne modifiez pas leur structure de base. Si vous avez des documents trop volumineux ou des difficultés de connexion, contactez l’assistance technique dès aujourd’hui. À partir de lundi, l’ancien espace de stockage sera en lecture seule.

      Cette organisation doit améliorer la sécurité des données et faciliter le travail à distance.

      Le service informatique
