  item:
    slug: ce-b1-batteries-usees
    cefr: B1
    origin: generated
    focus: idée principale
    passage: Dès le mois prochain, les habitants de Clairval pourront déposer leurs piles et petites batteries
      usées dans de nouveaux points de collecte installés chez trois commerçants de la ville. Le dispositif
      concerne les piles de télécommande, de lampe de poche, de jouets et d’appareils sans fil. Une fois
      les boîtes pleines, les objets seront récupérés par une entreprise spécialisée, puis envoyés dans
      un centre de traitement. D’après la mairie, cette solution évitera que des déchets dangereux finissent
      dans les ordures ménagères ou dans la nature. Un afficheur explicatif sera placé près des caisses
      pour rappeler les bons gestes de tri. Les habitants pourront aussi obtenir gratuitement un petit
      sac de stockage à l’accueil de la mairie pendant tout le printemps. Cette opération s’inscrit dans
      un programme plus large de réduction des déchets.
    prompt: De quoi parle surtout ce texte ?
    options:
    - D’une hausse des taxes
    - D’un nouveau système de collecte
    - D’une panne d’électricité
    - D’un changement de marque
    answer: 1
    explanation: 'L’article présente l’installation de points de collecte pour les piles et batteries
      usées. Les autres réponses ne conviennent pas : il n’est pas question de taxe, de panne ni de marque.'
