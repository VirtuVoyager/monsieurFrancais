    slug: ce-b1-cafe-de-reparation
    cefr: B1
    origin: generated
    focus: intention de l'auteur
    passage: |-
      Bonjour Lucie,

      Samedi dernier, j’ai découvert le café de réparation du quartier, et j’ai tout de suite pensé à toi. On y apporte un objet abîmé, puis des bénévoles vous aident à le remettre en état. J’y ai fait réparer mon grille-pain, et une étudiante a même réussi à redémarrer mon vieux portable. L’ambiance était simple et conviviale : chacun échange des conseils, et personne ne repart avec l’impression d’avoir jeté de l’argent par la fenêtre.

      La prochaine rencontre aura lieu le premier samedi du mois prochain, à la maison des associations. Si tu as une lampe, un aspirateur ou un appareil électronique qui ne fonctionne plus, viens avec moi. Ce sera l’occasion de tester ce service et de limiter les déchets.

      À bientôt,
      Nicolas
    prompt: Pourquoi Nicolas écrit-il à Lucie ?
    options:
    - Pour l’inviter à participer
    - Pour lui vendre un appareil
    - Pour se plaindre d’une panne
    - Pour annoncer un déménagement
    answer: 0
    explanation: 'Nicolas termine sa lettre en proposant à Lucie de venir avec lui au café de réparation.
      Les autres réponses ne correspondent pas : il ne vend rien, ne se plaint pas d’une panne et ne parle
      pas de déménagement.'
