  item:
    slug: ce-b1-trajet-en-train
    cefr: B1
    origin: generated
    focus: détail important
    passage: |-
      Salut Élodie,

      Je voulais te prévenir que je ne viendrai pas en voiture comme prévu. J’ai regardé les informations routières, et il y aura des travaux sur l’autoroute tout le week-end. J’ai donc pris un billet de train pour samedi matin. Finalement, ce sera plus calme, et je pourrai avancer sur mon dossier pendant le trajet. En plus, je n’aurai pas à chercher une place de stationnement en arrivant en ville.

      Je serai à la gare vers dix heures et demie. Si tu peux venir me chercher, ce sera parfait ; sinon, je prendrai le tram jusqu’à ton quartier. J’apporterai seulement mon sac et l’ordinateur, car je n’ai pas besoin d’autres affaires pour deux jours.

      À samedi,
      Martin
    prompt: Pourquoi Martin change-t-il de moyen de transport ?
    options:
    - Pour transporter des cartons
    - À cause des travaux et pour travailler
    - Pour faire une visite imprévue
    - Pour partir plus tard que prévu
    answer: 1
    explanation: Martin explique qu’il évite la voiture à cause des travaux sur l’autoroute et qu’il profite
      du train pour avancer sur son dossier. Les autres réponses ne correspondent pas au contenu de la
      lettre.
