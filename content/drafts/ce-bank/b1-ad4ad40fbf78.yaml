  item:
    slug: ce-b1-toits-solaires
    cefr: B1
    origin: generated
    focus: attitude de l'auteur
    passage: |-
      On voit parfois les projets écologiques comme des dépenses de plus. Pourtant, l’installation de panneaux solaires sur les toits des bâtiments publics mérite d’être prise au sérieux. À Saint-Laurent, l’école Victor-Hugo produit déjà une partie de son électricité grâce à ces équipements, et la facture annuelle a nettement baissé. Surtout, les élèves suivent maintenant de près la consommation du bâtiment et proposent eux-mêmes des idées pour éviter le gaspillage. Bien sûr, ce type d’aménagement demande un investissement de départ, mais les bénéfices apparaissent rapidement lorsque la gestion est rigoureuse.

      Il serait donc regrettable de réserver ces solutions aux grandes entreprises. Les collectivités locales peuvent, elles aussi, montrer l’exemple et encourager des habitudes plus responsables. Dans une période où l’énergie coûte cher, il est utile de soutenir ce genre d’initiative plutôt que de le considérer comme un simple effet de mode.
    prompt: Quelle est l’opinion de l’auteur sur ce projet ?
    options:
    - Il le soutient clairement
    - Il le juge inutile
    - Il veut le reporter
    - Il le trouve dangereux
    answer: 0
    explanation: 'L’auteur défend l’installation de panneaux solaires et estime qu’il faut soutenir ce
      type d’initiative. Les autres réponses sont contredites par le texte : il ne parle ni d’inutilité,
      ni de report, ni de danger.'
