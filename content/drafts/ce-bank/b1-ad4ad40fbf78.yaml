  item:
    slug: ce-b1-tri-au-bureau
    cefr: B1
    origin: generated
    focus: détail important
    passage: |-
      Bonjour à toutes et à tous,

      À partir de lundi, notre service passe à une nouvelle organisation pour limiter l’usage du papier. Les contrats, notes internes et comptes rendus seront désormais envoyés par voie électronique. Pour les documents de travail indispensables, merci d’utiliser l’impression recto verso et de vérifier d’abord si une version numérique peut suffire. Nous installerons aussi un dossier partagé sur l’intranet, afin que chacun retrouve facilement les fichiers à jour. Pensez à y déposer vos documents avant la fin de la semaine, car les anciennes versions seront ensuite archivées.

      Cette évolution ne demande pas de matériel particulier, mais elle suppose l’attention de chacun. Si vous avez besoin d’aide pour classer vos dossiers ou signer un document en ligne, l’équipe informatique restera disponible mardi et jeudi matin.

      Merci de votre coopération,
      Camille Morel
    prompt: Que doivent faire les employés pour les documents de travail ?
    options:
    - Les envoyer par courrier
    - Les traduire avant lundi
    - Les supprimer après lecture
    - Imprimer seulement si c’est indispensable
    answer: 3
    explanation: 'Le message demande de limiter l’impression et d’utiliser d’abord la version numérique.
      Les autres options sont incompatibles avec le texte : il n’est pas question de courrier, de traduction
      ni de suppression des documents.'
