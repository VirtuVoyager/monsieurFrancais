    origin: generated
    focus: intention de l'auteur
    passage: |-
      La médiathèque Jules-Ferry propose, à partir du 12 mars, un atelier numérique gratuit destiné aux adultes de plus de soixante ans. Pendant six séances d’une heure et demie, un médiateur expliquera comment envoyer un message, joindre une photo, utiliser une application de transport et prendre rendez-vous sur Internet. Les participants pourront venir avec leur propre téléphone ou emprunter une tablette sur place. L’objectif n’est pas de former des experts, mais de rendre chacun plus autonome dans les gestes du quotidien.

      Le groupe sera limité à dix personnes afin de permettre un accompagnement individuel. Les inscriptions se font à l’accueil ou par téléphone jusqu’au 8 mars. Aucune connaissance préalable n’est demandée, mais il est conseillé d’apporter ses lunettes et, si possible, le code de déverrouillage de son appareil.
    prompt: Quel est le but de cet atelier ?
    options:
    - Acheter un nouvel appareil
    - Réparer la médiathèque
    - Apprendre des gestes simples
    - Réduire la durée des séances
    answer: 2
    explanation: 'Le texte précise que l’atelier sert à aider les participants à réaliser des actions
      courantes et à devenir plus autonomes. Les autres propositions ne sont pas mentionnées : on n’y
      vend rien, on ne répare pas le bâtiment et la durée des séances ne change pas.'
