  item:
    slug: ce-b2-musee-gratuit
    cefr: B2
    origin: generated
    focus: portée de la gratuité
    passage: 'Le musée d’art de Rivehaute a rendu gratuite l’entrée de ses collections permanentes chaque
      premier dimanche du mois. Après un an, le bilan est nuancé. La fréquentation globale a augmenté
      de 9 %, mais surtout grâce à des visiteurs déjà familiers des musées. Les enquêtes de sortie montrent
      que les nouveaux venus restent souvent moins longtemps, visitent une seule salle et repartent sans
      revenir avant plusieurs mois. L’auteur ne nie pas l’intérêt symbolique de la mesure : elle donne
      au musée une image plus ouverte et réduit l’impression d’exclusion que peuvent ressentir certaines
      familles. Mais il refuse d’y voir une politique culturelle suffisante. Selon lui, la gratuité attire,
      certes, mais elle ne garantit ni la compréhension des œuvres ni l’envie de revenir. Il faudrait
      donc l’associer à des médiateurs, à des parcours plus courts et à une meilleure information dans
      les quartiers éloignés. Sans cela, la mesure profite surtout à ceux qui venaient déjà.'
    prompt: Que suggère surtout l’auteur ?
    options:
    - La gratuité doit être accompagnée.
    - Le musée doit fermer certains dimanches.
    - Les collections sont trop anciennes.
    - L’entrée devrait être payante pour tous.
    answer: 0
    explanation: 'L’auteur dit que la gratuité a un intérêt, mais qu’elle doit être complétée par de la
      médiation, des parcours adaptés et de l’information : elle doit donc être accompagnée. Les autres
      propositions ne sont pas défendues dans le texte.'
