  item:
    slug: ce-b2-train-combine
    cefr: B2
    origin: generated
    focus: rôle de l’information
    passage: 'L’autorité régionale a lancé un billet combiné pour encourager les trajets en train hors
      des heures de pointe. Le principe est simple : le tarif baisse fortement entre dix heures et seize
      heures, puis les voyageurs peuvent poursuivre leur déplacement en bus local sans payer davantage.
      Les premiers résultats montrent une hausse de 12 % sur les créneaux visés, mais la progression varie
      beaucoup selon les gares. Là où les panneaux sont clairs et les correspondances bien expliquées,
      le nouveau billet séduit ; là où les voyageurs doivent chercher les informations sur plusieurs sites,
      l’effet reste faible. L’auteur rappelle que les économies promises ne suffisent pas toujours à modifier
      un comportement très installé. Ce qui fait la différence, écrit-il, n’est pas seulement le prix,
      mais la lisibilité du service : horaires compréhensibles, réservations simples, correspondances
      visibles. En somme, le billet combiné a du potentiel, mais il n’agit vraiment que si l’usager comprend
      immédiatement comment l’utiliser.'
    prompt: Que montre surtout l’article ?
    options:
    - Le prix suffit à lui seul.
    - Les trains sont trop nombreux.
    - Les gares doivent fermer la nuit.
    - L’information est décisive.
    answer: 3
    explanation: 'Le texte insiste sur la clarté des panneaux, la simplicité de réservation et la visibilité
      des correspondances : c’est donc l’information qui fait la différence. Les autres réponses ne sont
      pas soutenues par les données de l’article.'
