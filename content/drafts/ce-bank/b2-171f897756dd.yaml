  item:
    slug: ce-b2-pass-musees
    cefr: B2
    origin: generated
    focus: avis sur le pass
    passage: 'La ville de Montrevie a lancé au début de l’année un pass culturel annuel à quinze euros,
      valable dans quatre musées et deux petites salles de spectacle. Les premiers chiffres semblent encourageants
      : en six mois, la fréquentation a augmenté de 14 %, et les achats de pass ont surtout concerné des
      personnes de moins de trente-cinq ans. Pourtant, le bilan n’est pas aussi simple. D’après les responsables
      des lieux, beaucoup de nouveaux visiteurs sont venus une seule fois, souvent par curiosité, puis
      ne sont pas revenus. Le journaliste souligne aussi que les horaires restent peu adaptés à ceux qui
      travaillent tard, et que les lignes de bus vers le quartier des musées cessent tôt le soir. Autrement
      dit, le prix bas enlève un frein, mais il ne suffit pas à créer une habitude. Pour l’auteur, il
      faudrait accompagner ce pass de visites commentées, d’horaires élargis et d’une meilleure desserte,
      sinon l’effet restera limité.'
    prompt: Quelle est la position de l’auteur sur le nouveau pass ?
    options:
    - Il devrait viser surtout les touristes.
    - Il faut le supprimer dès maintenant.
    - Il est utile, mais il ne suffit pas.
    - Il sert surtout à financer les travaux.
    answer: 2
    explanation: 'Le texte dit clairement que le pass « enlève un frein, mais ne suffit pas à créer une
      habitude » et qu’il faudrait d’autres mesures. Les autres propositions ne correspondent pas : il
      n’est pas réservé aux touristes, il n’est pas présenté comme inutile, et rien n’indique qu’il finance
      des travaux.'
