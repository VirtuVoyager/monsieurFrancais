  item:
    slug: ce-b2-theatre-et-bus
    cefr: B2
    origin: generated
    focus: obstacle principal
    passage: 'Selon une enquête publiée par le quotidien Le Regard, 62 % des moins de trente ans estiment
      que les places de théâtre sont trop chères. Le chiffre a beaucoup circulé, mais l’article invite
      à le lire avec prudence. Dans la même étude, 48 % des billets soldés de dernière minute ont été
      achetés par des personnes de plus de quarante-cinq ans, ce qui montre que le prix bas ne suffit
      pas à changer les habitudes. Surtout, un autre résultat ressort : parmi les personnes qui renoncent
      à sortir le soir, près d’un tiers citent le retour à la maison comme principal frein, devant le
      tarif du billet. Le journaliste en déduit que l’offre culturelle ne se joue pas seulement au guichet.
      Si le dernier tram passe trop tôt, si les correspondances sont rares ou si le trajet devient compliqué
      après minuit, une réduction de quelques euros perd une grande partie de son effet. Pour lui, les
      théâtres qui veulent élargir leur public doivent travailler avec les transports autant qu’avec la
      billetterie.'
    prompt: Quelle conclusion l’auteur tire-t-il des données ?
    options:
    - Les spectacles sont trop longs.
    - Les jeunes préfèrent le cinéma.
    - Le prix n’est pas l’obstacle principal.
    - Le théâtre doit être gratuit pour tous.
    answer: 2
    explanation: 'Le texte compare le prix et le retour à la maison, puis dit que le trajet pèse davantage
      que le billet : l’obstacle principal n’est donc pas le prix. Les autres options ne sont ni affirmées
      ni suggérées.'
