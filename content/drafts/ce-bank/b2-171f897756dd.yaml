  item:
    slug: ce-b2-tram-du-soir
    cefr: B2
    origin: generated
    focus: condition de réussite
    passage: 'La métropole de Valcenne a prolongé la circulation du tramway jusqu’à une heure du matin,
      du jeudi au samedi, afin de faciliter les sorties culturelles et les trajets de fin de soirée. Après
      trois mois, la fréquentation a augmenté de 22 % sur les lignes concernées, et les services de sécurité
      constatent moins d’incidents aux abords des gares. Le coût de l’opération s’est révélé inférieur
      aux prévisions, car la ville a réorganisé les équipes sans ouvrir de nouvelles infrastructures.
      L’auteur ne conteste donc pas le principe du dispositif ; au contraire, il le juge plutôt intelligent
      et socialement utile. Mais il estime que l’extension horaire n’a de sens que si les rames circulent
      assez souvent. Quand l’attente dépasse vingt minutes, écrit-il, les voyageurs finissent par reprendre
      leur voiture ou par renoncer à sortir. Son argument est clair : mieux vaut un service bien cadencé
      sur quelques nuits que des horaires théoriques, difficiles à utiliser dans la pratique.'
    prompt: À quelle condition l’auteur approuve-t-il la mesure ?
    options:
    - Qu’elle soit moins chère.
    - Qu’elle circule assez souvent.
    - Qu’elle s’arrête plus tôt.
    - Qu’elle passe seulement l’été.
    answer: 1
    explanation: L’auteur dit explicitement que la mesure n’a de sens que si les rames circulent assez
      souvent, sinon les voyageurs renoncent. Les autres propositions ne correspondent pas au texte.
