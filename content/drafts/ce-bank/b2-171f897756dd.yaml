  item:
    slug: ce-b2-bus-nocturnes
    cefr: B2
    origin: generated
    focus: stratégie de desserte
    passage: 'À la sortie des concerts, la municipalité de Bréville expérimente des bus nocturnes sur
      trois lignes desservant les quartiers culturels et la gare centrale. Les enquêtes menées sur place
      sont parlantes : 71 % des usagers déclarent qu’ils ne seraient pas restés jusqu’à la fin du spectacle
      sans ce service, et la moitié d’entre eux a moins de trente-cinq ans. En revanche, la fréquentation
      est nettement plus faible du lundi au mercredi. Partant de ces chiffres, l’auteur juge inutile de
      prolonger la desserte toutes les nuits par principe. Il défend une approche plus fine : concentrer
      les moyens sur les soirées où la demande est forte, relier les lieux où l’on sort vraiment, et éviter
      de disperser le budget sur des trajets presque vides. Selon lui, le débat n’oppose pas la culture
      et le transport, mais la bonne utilisation de l’argent public et l’efficacité du service. Autrement
      dit, mieux vaut un réseau ciblé et visible qu’un dispositif uniforme, affiché pour son image mais
      peu utilisé.'
    prompt: Quelle politique l’auteur juge-t-il la plus pertinente ?
    options:
    - Cibler les nuits de forte demande.
    - Étendre tous les soirs.
    - Limiter aux grands axes.
    - Supprimer les concerts tardifs.
    answer: 0
    explanation: 'Le texte recommande de concentrer les moyens sur les soirées où la demande est forte
      et sur les lieux où l’on sort vraiment : c’est donc une desserte ciblée. Les autres options vont
      contre cette idée ou n’apparaissent pas dans l’article.'
