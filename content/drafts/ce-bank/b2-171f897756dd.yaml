  item:
    slug: ce-b2-bibliotheque-tardive
    cefr: B2
    origin: generated
    focus: vocation de la bibliothèque
    passage: 'À Saint-Véran, la médiathèque a décidé d’ouvrir deux soirs par semaine jusqu’à vingt-deux
      heures, avec des lectures publiques, des ateliers de jeux et une petite scène pour des concerts
      acoustiques. La municipalité se félicite des résultats : la fréquentation a progressé de 30 % le
      soir, et les inscriptions de jeunes adultes ont nettement augmenté. Mais l’article rappelle aussi
      une autre réalité : les salles de consultation, elles, sont moins calmes qu’avant, et plusieurs
      habitués disent avoir du mal à travailler dans le bruit. L’auteur reconnaît l’intérêt d’une bibliothèque
      plus vivante, capable d’attirer ceux qui n’y venaient jamais. Il juge pourtant que l’établissement
      risque de perdre ce qui faisait sa force si l’animation prend toute la place. À ses yeux, une médiathèque
      n’a pas à choisir entre culture et silence, mais elle doit conserver un équilibre net, sous peine
      de transformer un lieu de lecture en simple espace de loisirs.'
    prompt: Que redoute l’auteur ?
    options:
    - La hausse des tarifs.
    - La fermeture du bâtiment.
    - Le manque de livres.
    - La perte du silence.
    answer: 3
    explanation: 'L’auteur explique que le bruit gêne les habitués et que la médiathèque pourrait perdre
      « ce qui faisait sa force » si l’animation domine : il redoute donc la disparition du calme. Les
      autres propositions ne sont pas évoquées dans le texte.'
