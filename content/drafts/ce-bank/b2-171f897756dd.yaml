  item:
    slug: ce-b2-parkings-relais
    cefr: B2
    origin: generated
    focus: avis sur le projet
    passage: La ville de Noyar a décidé de supprimer plusieurs places de stationnement gratuites en centre-ville
      pour financer deux parkings relais reliés au métro toutes les huit minutes. Le projet divise les
      commerçants, qui craignent une baisse de passage, mais les urbanistes cités dans l’article rappellent
      que les automobilistes perdent en moyenne quinze minutes à chercher une place dans les rues commerçantes.
      L’auteur ne se contente pas d’opposer les deux camps. Il admet que le plan peut déstabiliser les
      habitudes, surtout au début, mais il estime qu’il pourrait rendre le centre plus agréable si les
      conditions pratiques sont réunies. À ses yeux, un parking relais n’a d’intérêt que s’il est moins
      coûteux que le stationnement en centre et si le métro reste assez fréquent pour éviter l’attente.
      Sans cela, les conducteurs continueront à entrer en ville. L’article ne présente donc pas la mesure
      comme une solution miracle, mais comme une réforme crédible, à condition qu’elle soit pensée pour
      l’usage réel des voyageurs.
    prompt: Que pense l’auteur du projet ?
    options:
    - Il est surtout symbolique.
    - Il favorise les embouteillages.
    - Il ne concerne que les touristes.
    - Il est prometteur à certaines conditions.
    answer: 3
    explanation: 'L’auteur dit que le projet peut être utile et crédible « à condition » que le coût et
      la fréquence du métro soient adaptés. Les autres options contredisent son propos : il ne le juge
      ni purement symbolique, ni favorable aux embouteillages, ni limité aux touristes.'
