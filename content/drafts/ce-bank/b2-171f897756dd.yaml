  item:
    slug: ce-b2-festival-muet
    cefr: B2
    origin: generated
    focus: accès au festival
    passage: Le festival des Écrans silencieux, consacré au cinéma muet accompagné de musiciens, a rassemblé
      cette année plus de cinq mille six cents spectateurs, soit une hausse de 18 % par rapport à l’an
      dernier. Les organisateurs attribuent une partie de cette progression au premier week-end gratuit,
      qui a attiré davantage de familles et de visiteurs venus des quartiers périphériques. L’étude menée
      à la sortie des séances montre d’ailleurs que près d’un tiers de ces nouveaux venus n’était jamais
      entré dans une salle du festival. En revanche, les entrées payantes du jeudi soir ont moins bien
      marché, malgré une programmation très ambitieuse. Le chroniqueur observe que l’opération n’est pas
      rentable à court terme, mais qu’elle change la composition du public et donne une autre image de
      l’événement. Selon lui, supprimer la gratuité reviendrait à faire du festival une manifestation
      plus fermée, plus conforme aux habitudes des amateurs avertis, mais moins ouverte à ceux qui hésitent
      à franchir la porte.
    prompt: Pourquoi l’auteur défend-il le premier week-end gratuit ?
    options:
    - Pour équilibrer le budget.
    - Pour fidéliser les cinéphiles.
    - Pour réduire la durée du festival.
    - Pour élargir le public.
    answer: 3
    explanation: 'Le texte insiste sur le fait que la gratuité attire des familles, des habitants des
      périphéries et des personnes qui n’étaient jamais venues : l’objectif est donc d’ouvrir le festival
      à d’autres publics. Les autres réponses contredisent le document : l’auteur dit même que l’opération
      n’est pas rentable, et il ne parle ni de fidélisation ni de réduction de la durée.'
