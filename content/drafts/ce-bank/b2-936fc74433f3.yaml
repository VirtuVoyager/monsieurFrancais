  item:
    slug: ce-b2-teletravail-hybride
    cefr: B2
    origin: generated
    focus: cadre du télétravail
    passage: |-
      Deux jours à distance, trois jours sur place : la formule s’est imposée dans de nombreuses sociétés de services. D’après les données publiées, elle a réduit les démissions de 12 % en un an et amélioré la satisfaction des salariés. Pourtant, les mêmes données montrent aussi une montée des malentendus entre équipes, surtout quand les consignes changent d’un manager à l’autre.

      L’auteur du dossier ne s’en prend pas au télétravail en lui-même. Il observe plutôt que les problèmes apparaissent lorsque l’entreprise l’utilise pour faire des économies sans clarifier ce qu’elle attend. Certains collaborateurs ne savent plus quand être joignables, d’autres assistent à des réunions en visioconférence alors qu’ils sont déjà au bureau, et la frontière entre autonomie et disponibilité permanente devient floue.

      La position défendue est donc nuancée : le travail hybride peut améliorer l’équilibre de vie et la fidélité des salariés, mais seulement si les règles sont simples, stables et partagées. Sans cadre commun, la flexibilité annoncée risque de se transformer en désorganisation discrète.
    prompt: D’après le texte, le principal risque du télétravail hybride est…
    options:
    - la baisse de salaire
    - l’isolement des clients
    - le flou des règles
    - l’absence de matériel
    answer: 2
    explanation: Le deuxième paragraphe montre que les difficultés viennent surtout de consignes floues
      et changeantes. Les autres options ne correspondent pas au diagnostic présenté dans l’article.
