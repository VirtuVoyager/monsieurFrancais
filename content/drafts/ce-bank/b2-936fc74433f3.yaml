  item:
    slug: ce-b2-nuit-reorganisee
    cefr: B2
    origin: generated
    focus: organisation des nuits
    passage: |-
      Dans un hôpital public, le service des urgences a revu les horaires de nuit après une série d’incidents mineurs. Les équipes ne travaillaient plus selon un roulement fixe : elles passaient désormais d’une garde de nuit à une garde plus courte, puis à une journée de récupération. Au bout de quatre mois, le nombre d’erreurs de transmission a diminué de 15 % et les arrêts maladie ont légèrement reculé.

      Pour l’auteur du compte rendu, ce résultat ne prouve pas qu’il suffirait de « demander un effort supplémentaire » aux soignants. Il montre surtout qu’un horaire inadapté finit par coûter plus cher qu’il ne rapporte. Les nuits successives, les changements trop brusques et le manque de repos fragilisent autant l’attention que la qualité des soins.

      Le texte défend une idée simple : les établissements de santé devraient cesser de considérer le temps de travail comme une variable purement comptable. Adapter les plannings au rythme biologique des équipes n’est pas un luxe ; c’est une manière de protéger à la fois les patients et ceux qui les prennent en charge.
    prompt: Quel est le message principal du compte rendu ?
    options:
    - Il faut réduire les urgences
    - Il faut adapter les horaires de nuit
    - Il faut embaucher davantage de cadres
    - Il faut prolonger les gardes
    answer: 1
    explanation: Le dernier paragraphe explique qu’il faut adapter les plannings au rythme biologique.
      Les autres réponses s’éloignent de cette idée ou contredisent l’argument du texte.
