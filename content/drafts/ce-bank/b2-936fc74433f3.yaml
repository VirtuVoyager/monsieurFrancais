  item:
    slug: ce-b2-retour-au-bureau
    cefr: B2
    origin: generated
    focus: conditions du retour
    passage: |-
      Le retour massif au bureau a été présenté comme une réponse au manque de cohésion. Pourtant, dans une enquête menée auprès de salariés de trois secteurs, 64 % disent que l’open space les aide à échanger, mais 71 % affirment qu’il nuit à leur concentration. Ce paradoxe a conduit plusieurs entreprises à réaménager leurs locaux : box silencieux, créneaux sans réunion, espaces de discussion séparés. Certaines équipes disent aussi que les échanges informels diminuent quand les postes sont mal répartis, alors que c’est précisément ce lien qu’elles cherchent à renforcer.

      L’auteur de l’article ne défend pas l’idée d’un travail entièrement à distance. Il remarque au contraire que la présence physique reste précieuse pour les décisions rapides, l’accueil des nouveaux et la circulation des informations tacites. En revanche, il juge naïf de croire qu’un bureau rempli suffit à produire une équipe soudée et efficace.

      Son point de vue est clair : pour que le retour au bureau ait un sens, il faut autre chose qu’une obligation de présence. Il faut des lieux qui permettent autant la coordination que le travail concentré, sinon les salariés restent ensemble sans vraiment mieux collaborer.
    prompt: L’auteur pense que le retour au bureau doit surtout…
    options:
    - imposer la présence complète
    - supprimer l’open space
    - remplacer le télétravail
    - mieux organiser les espaces
    answer: 3
    explanation: L’auteur dit qu’il faut des lieux qui permettent à la fois coordination et concentration,
      d’où les box silencieux et les espaces séparés. Les autres options ne reprennent pas cette idée
      d’aménagement réfléchi.
