  item:
    slug: ce-b2-soins-rapides
    cefr: B2
    origin: generated
    focus: continuité des soins
    passage: |-
      Les centres de consultations sans rendez-vous séduisent par leur promesse de rapidité. Dans les quartiers étudiés, la fréquentation a augmenté de 22 % en deux ans, en particulier chez des personnes qui renonçaient jusque-là à voir un médecin pour une toux persistante, un renouvellement de traitement ou une petite inquiétude de santé. Sur le papier, le bilan paraît donc positif.

      Mais l’auteur de l’article invite à la prudence. Il note que la rapidité peut fragmenter le suivi : un patient voit un professionnel différent à chaque passage, les examens se répètent et les conseils se contredisent parfois. À force de traiter des épisodes isolés, on perd la vue d’ensemble, surtout chez les malades chroniques ou les personnes âgées. Le gain d’accès ne suffit alors pas à garantir de meilleurs soins.

      La conclusion est équilibrée : aller vite est une bonne chose quand il s’agit de ne pas laisser des symptômes s’aggraver. En revanche, si l’on confond vitesse et qualité, on risque d’obtenir un système plus réactif, mais moins cohérent.
    prompt: D’après l’article, les consultations rapides…
    options:
    - résolvent les maladies chroniques
    - remplacent le médecin traitant
    - sont surtout utilisées pour les urgences graves
    - améliorent l’accès, mais pas toujours le suivi
    answer: 3
    explanation: Le troisième paragraphe dit que la rapidité améliore l’accès mais peut fragmenter le
      suivi. Les autres réponses vont trop loin ou déplacent le propos vers les urgences graves.
