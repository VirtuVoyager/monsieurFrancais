  item:
    slug: ce-b2-pauses-actives
    cefr: B2
    origin: generated
    focus: prévention au bureau
    passage: |-
      Dans les entreprises qui ont testé les pauses actives, les salariés devaient s’arrêter cinq minutes toutes les heures pour marcher, s’étirer ou changer de posture. Après trois mois, les douleurs au cou et aux épaules ont baissé chez une partie des participants, et les absences courtes ont légèrement diminué. Les responsables ont vite voulu présenter l’initiative comme une réussite simple et peu coûteuse.

      L’auteur du billet refuse toutefois de s’en tenir à ce constat. Selon lui, les exercices n’ont d’effet durable que s’ils s’inscrivent dans une réflexion plus large sur l’organisation du travail : écrans mal réglés, objectifs irréalistes, réunions trop longues et cadence continue. Si l’on demande aux salariés de respirer entre deux dossiers sans réduire la pression, on soulage les symptômes sans traiter la cause.

      Le texte défend donc une prévention concrète mais exigeante. Bouger davantage est utile, bien sûr, mais la vraie question est de savoir pourquoi tant de corps finissent par se bloquer au bureau. Autrement dit, la santé au travail ne se limite pas à quelques gestes de détente.
    prompt: Selon l’auteur, les pauses actives…
    options:
    - suppriment les douleurs
    - sont suffisantes à elles seules
    - obligent à travailler moins
    - ne règlent pas le problème de fond
    answer: 3
    explanation: Le texte affirme que les exercices ont un effet limité si l’organisation du travail reste
      inchangée. Les autres réponses exagèrent leur efficacité ou ajoutent une conséquence qui n’est pas
      défendue.
