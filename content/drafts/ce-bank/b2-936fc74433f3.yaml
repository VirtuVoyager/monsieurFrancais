  item:
    slug: ce-b2-semaine-reduite
    cefr: B2
    origin: generated
    focus: réorganisation du travail
    passage: |-
      Dans plusieurs PME du secteur administratif, la semaine de quatre jours a été testée pendant six mois. Les responsables espéraient d’abord un gain d’attractivité. Ils ont bien obtenu des candidatures supplémentaires, et le taux d’absentéisme a baissé de 18 %. En revanche, les résultats sont restés très inégaux d’une équipe à l’autre.

      Pourquoi ? Parce que la journée plus courte n’a pas produit les mêmes effets partout. Là où l’on a simplement supprimé un jour de présence sans revoir les priorités, les salariés ont travaillé plus vite, avec davantage de fatigue. Là où les tâches ont été réorganisées, les réunions limitées et les dossiers partagés plus clairement, les équipes ont maintenu la production et même réduit les erreurs.

      La conclusion du rapport est prudente, mais nette : la semaine réduite n’est pas une récompense automatique. Elle fonctionne quand elle oblige l’entreprise à éliminer le superflu et à mieux définir ce qui compte vraiment. Autrement dit, le changement d’horaire n’a d’intérêt que s’il s’accompagne d’un changement de méthode.
    prompt: Selon l’auteur, la semaine de quatre jours…
    options:
    - n’est utile qu’avec une réorganisation
    - améliore tout de suite la productivité
    - convient surtout aux grandes entreprises
    - fait forcément augmenter la fatigue
    answer: 0
    explanation: Le dernier paragraphe dit clairement que le changement d’horaire n’a d’intérêt que s’il
      s’accompagne d’un changement de méthode. Les autres propositions contredisent cette prudence ou
      ajoutent une idée absente du texte.
