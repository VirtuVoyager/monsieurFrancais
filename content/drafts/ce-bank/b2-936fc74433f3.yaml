  item:
    slug: ce-b2-recrutement-agiste
    cefr: B2
    origin: generated
    focus: diversité des âges
    passage: |-
      Une étude sur le recrutement dans les entreprises de services montre qu’à compétence égale, un candidat de plus de cinquante ans reçoit moins souvent une réponse positive qu’un profil plus jeune. Les recruteurs interrogés disent privilégier des personnes « plus souples », « plus faciles à former » ou « plus en phase avec la culture maison ». Or les mêmes entreprises se plaignent ensuite de manquer de stabilité dans les équipes et d’expérience client.

      L’auteur du papier prend clairement position contre cette logique. Il rappelle que les salariés expérimentés changent moins souvent d’emploi, maîtrisent mieux les situations délicates et transmettent plus vite les méthodes aux nouveaux arrivants. Les chiffres cités vont dans le même sens : les équipes mêlant différentes tranches d’âge enregistrent moins d’erreurs et une meilleure satisfaction des usagers.

      Le texte ne prétend pas que l’âge suffit à faire un bon recrutement. Il soutient plutôt qu’écarter les seniors par réflexe relève d’une mauvaise gestion, non d’un choix rationnel. Pour l’auteur, la diversité des âges n’est pas une question d’image, mais un levier de performance et de continuité.
    prompt: Quelle est la position de l’auteur ?
    options:
    - Les seniors coûtent trop cher
    - Les équipes mixtes sont un atout
    - L’âge devrait être un critère central
    - Les jeunes recrutés sont toujours plus efficaces
    answer: 1
    explanation: Le dernier paragraphe présente la diversité des âges comme un levier de performance et
      de continuité. Les autres propositions contredisent l’étude ou réduisent l’âge à un critère unique.
