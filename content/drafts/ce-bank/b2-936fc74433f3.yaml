  item:
    slug: ce-b2-depistage-mobile
    cefr: B2
    origin: generated
    focus: nécessité du suivi
    passage: |-
      Faire venir le dépistage sur le lieu de travail peut sembler anecdotique ; c’est pourtant l’une des rares mesures qui touchent aussi des salariés habituellement éloignés du système de soins. Dans une enquête menée auprès de neuf entreprises, les unités mobiles ont permis d’examiner plus de huit mille personnes. Près d’un tiers d’entre elles n’avaient pas consulté depuis plus de deux ans.

      Les défenseurs du dispositif soulignent un avantage simple : pendant la pause de midi, on se fait prendre la tension, on reçoit un conseil, on repère un risque sans perdre une demi-journée de travail. Mais l’auteure du rapport rappelle un point essentiel : un dépistage qui se contente de distribuer des chiffres ne change rien. Quand les résultats sont transmis sans explication ou que les salariés ne savent pas vers qui se tourner ensuite, l’effet retombe très vite.

      Le texte ne présente donc pas ces campagnes comme une solution miracle. Il les juge utiles, à condition qu’elles soient organisées avec discrétion, qu’elles débouchent sur un vrai suivi médical et qu’elles ne servent pas seulement à afficher de bons chiffres de prévention.
    prompt: Pour l’auteure, le dépistage en entreprise est…
    options:
    - suffisant s’il est fréquent
    - réservé aux salariés à risque
    - trop compliqué à mettre en place
    - utile s’il est bien accompagné
    answer: 3
    explanation: Le texte insiste sur le suivi médical et la confidentialité ; il ne présente pas le dépistage
      comme une solution suffisante en soi. Les autres réponses ignorent cette condition centrale.
