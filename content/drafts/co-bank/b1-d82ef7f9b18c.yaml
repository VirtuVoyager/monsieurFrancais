  item:
    slug: co-b1-article-fiable
    cefr: B1
    origin: generated
    focus: qualité recherchée
    audio_text: 'Dans une rédaction, on me demande souvent pourquoi je vérifie autant les faits avant
      de publier. La réponse est simple : un article peut être brillant, mais s’il contient une erreur,
      le lecteur perd confiance. Je préfère donc travailler plus lentement et donner une information solide.
      À mon avis, le rôle d’un média n’est pas seulement de faire réagir ; c’est aussi d’être fiable,
      même quand le sujet est complexe.'
    prompt: Quelle qualité défend-elle ?
    options:
    - La fiabilité
    - La rapidité
    - La distraction
    - La compétition
    answer: 0
    explanation: Elle dit préférer une information « solide » et précise, car le lecteur doit pouvoir
      faire confiance au média. La rapidité est au contraire relativisée, et rien n’évoque la distraction
      ou la compétition.
