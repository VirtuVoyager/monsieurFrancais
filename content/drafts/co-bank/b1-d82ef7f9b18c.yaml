  item:
    slug: co-b1-retard-du-train
    cefr: B1
    origin: generated
    focus: décision de voyage
    audio_text: |-
      - Tu as confirmé le train pour Marseille ?
      - Oui, mais j’ai reçu un message : le départ de huit heures est retardé à dix heures trente.
      - Ça change tout. On ne pourra pas arriver à temps pour la réunion.
      - Dans ce cas, j’ai réservé deux billets pour la veille au soir. On dormira près de la gare et on sera tranquilles.
      - Bonne idée. Je préviens Claire qu’on partira plus tôt.
    prompt: Quelle est leur décision ?
    options:
    - Garder l’horaire initial
    - Partir la veille
    - Annuler le déplacement
    - Prendre l’avion
    answer: 1
    explanation: 'Il dit qu’ils ont réservé deux billets pour la veille au soir et qu’ils dormiront près
      de la gare. Les autres réponses ne conviennent pas : ils ne gardent pas l’horaire, ils n’annulent
      pas le déplacement et ils ne parlent pas d’avion.'
