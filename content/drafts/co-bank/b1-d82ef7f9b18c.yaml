    cefr: B1
    origin: generated
    focus: objectif du vlog
    audio_text: |-
      - Vos vidéos de voyage ont changé. Qu’est-ce qui vous a poussé à modifier votre façon de faire ?
      - J’avais peur que tout devienne trop parfait. On voit souvent des paysages magnifiques, mais pas les retards, la fatigue ou les imprévus. Moi, je voulais montrer autre chose.
      - Plus de réalité, en somme ?
      - Exactement. Je filme moins, je parle davantage, et je laisse une place aux petits accidents du voyage.
    prompt: Quel est son objectif ?
    options:
    - Faire des clips très courts
    - Vanter une agence
    - Expliquer la météo
    - Montrer un voyage authentique
    answer: 3
    explanation: Le locuteur veut montrer la réalité du voyage, avec ses imprévus et ses défauts, plutôt
      qu’une image parfaite. Il ne cherche ni des clips très courts, ni à faire de la publicité, ni à
      parler de météo.
