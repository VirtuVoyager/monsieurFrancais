  item:
    slug: co-b1-train-et-paysage
    cefr: B1
    origin: generated
    focus: idée principale du reportage
    audio_text: |-
      - Vous avez parcouru plusieurs pays en train pour votre reportage. Qu’est-ce qui vous a plu ?
      - Le rythme, surtout. Quand on prend le temps de voyager, on remarque davantage les paysages et les gens. En avion, j’arrive vite, mais je ne vois rien. En train, le trajet devient une partie du voyage, pas seulement une étape.
      - Vous recommanderiez donc ce mode de transport ?
      - Oui, à ceux qui veulent découvrir un pays sans se presser.
    prompt: Quelle est son idée principale ?
    options:
    - Le train est plus économique
    - L’avion est plus agréable
    - Le trajet fait partie du voyage
    - Il vaut mieux rester en ville
    answer: 2
    explanation: 'Il explique clairement que, pour lui, le trajet compte autant que la destination. Les
      autres réponses ne correspondent pas : il ne parle ni d’économie, ni d’avion plus agréable, ni de
      rester en ville.'
