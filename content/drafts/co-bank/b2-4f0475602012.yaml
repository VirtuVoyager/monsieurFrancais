  item:
    slug: co-b2-camping-cars-en-ville
    cefr: B2
    origin: generated
    focus: raison implicite
    audio_text: 'Dans cette commune de montagne, l’arrivée massive de camping-cars a changé le quotidien.
      Les parkings débordaient, les rues étaient encombrées, et les habitants ne trouvaient plus place
      près des commerces. La mairie a donc créé une aire de stationnement en périphérie et interdit le
      centre aux véhicules les plus volumineux. La décision a fait grincer des dents, mais elle a aussi
      apaisé les tensions. Les touristes marchent davantage, découvrent les ruelles à pied, et les habitants
      retrouvent un peu de calme. Le maire le dit sans détour : il ne s’agit pas de punir les visiteurs,
      mais de faire en sorte que chacun puisse profiter du lieu sans le saturer.'
    prompt: Pourquoi la mairie a-t-elle pris cette décision ?
    options:
    - attirer plus de cars
    - fermer le centre
    - augmenter les parkings
    - préserver la vie locale
    answer: 3
    explanation: Le texte précise que la mesure vise à éviter la saturation et à redonner du calme aux
      habitants. Les autres réponses ne correspondent pas à cette motivation, même si un stationnement
      en périphérie est créé.
