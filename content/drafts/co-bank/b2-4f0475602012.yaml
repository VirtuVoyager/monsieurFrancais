  item:
    slug: co-b2-vieux-quartier
    cefr: B2
    origin: generated
    focus: attitude du locuteur
    audio_text: |-
      - La commune impose désormais une réservation pour accéder au vieux quartier. N’est-ce pas décourageant pour les touristes ?
      - Nous voulons surtout éviter les foules qui empêchent les habitants de vivre. Le quartier reste ouvert, mais à un rythme raisonnable.
      - Vous avez eu des critiques ?
      - Bien sûr, certains commerçants craignaient une baisse de fréquentation. Pourtant, depuis quelques mois, les visiteurs restent plus longtemps et circulent mieux.
      - Vous ne cherchez donc pas à fermer le site ?
      - Pas du tout. Nous cherchons un équilibre : accueillir les voyageurs, sans transformer le centre en décor saturé.
    prompt: Quelle est l’attitude du responsable ?
    options:
    - augmenter les tarifs
    - interdire les visites
    - satisfaire les commerçants
    - favoriser un tourisme limité
    answer: 3
    explanation: Le responsable insiste sur « un équilibre » et sur la nécessité d’éviter les foules,
      donc il défend un tourisme encadré. Les autres options ne reflètent pas cette recherche de modération.
