  item:
    slug: co-b2-radio-numerique
    cefr: B2
    origin: generated
    focus: attitude du locuteur
    audio_text: |-
      - Votre station va abandonner la diffusion traditionnelle ?
      - Pas du tout. Nous changeons surtout de point d’entrée.
      - Pourtant, vous investissez beaucoup dans les podcasts et l’application mobile.
      - Parce que l’auditeur écoute désormais en marchant, en voiture, le soir. Il ne veut pas choisir entre la radio et le numérique.
      - Donc vous pensez que le direct va disparaître ?
      - Non. Le direct garde son intérêt pour l’information et les grandes émissions. Mais le numérique nous permet de retrouver ceux qui n’étaient jamais devant l’antenne à l’heure prévue.
      - C’est une stratégie offensive, alors ?
      - Je dirais plutôt une continuité. Nous ne tournons pas la page ; nous l’ouvrons autrement.
    prompt: Que pense le directeur de la station ?
    options:
    - le numérique complète la radio
    - le direct doit disparaître
    - les podcasts sont accessoires
    - l’application remplace tout
    answer: 0
    explanation: Il dit clairement que le numérique et le direct coexistent, le premier permettant d’atteindre
      d’autres auditeurs. Les autres options contredisent cette idée de complémentarité.
