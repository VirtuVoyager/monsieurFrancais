  item:
    slug: co-b2-rubrique-de-corrections
    cefr: B2
    origin: generated
    focus: intention du locuteur
    audio_text: |-
      - Vous lancez une rubrique de corrections très visible. N’est-ce pas risqué pour votre journal ?
      - Au contraire. Quand une erreur circule, la cacher abîme davantage la confiance que la reconnaître.
      - Vous avez pourtant peur que les lecteurs retiennent surtout la faute ?
      - S’ils voient qu’on explique l’origine du problème et qu’on publie la version juste, ils comprennent que la rédaction travaille sérieusement.
      - Donc ce n’est pas un aveu de faiblesse ?
      - Non, c’est une manière de montrer nos méthodes. Nous voulons que le lecteur puisse vérifier, pas seulement nous croire sur parole.
      - Et si cela prend du temps ?
      - Mieux vaut une correction claire qu’un correctif discret au fond d’une page.
    prompt: Quelle est l’intention principale du rédacteur en chef ?
    options:
    - promouvoir un nouveau format
    - éviter les critiques
    - justifier la rapidité
    - rassurer sur la fiabilité
    answer: 3
    explanation: Il explique que publier des corrections sert à montrer le sérieux de la rédaction et
      à renforcer la confiance du lecteur. Les autres réponses ne correspondent pas à son objectif, qui
      n’est ni commercial ni fondé sur la vitesse.
