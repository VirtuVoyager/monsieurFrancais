  item:
    slug: co-b2-images-choquantes
    cefr: B2
    origin: generated
    focus: nuance argumentative
    audio_text: |-
      - Vous jugez parfois les chaînes trop prudentes quand elles coupent certaines images. Pourquoi ?
      - Parce qu’il ne suffit pas d’annoncer un événement ; il faut en mesurer la portée. Si l’on montre une scène brutale sans explication, on choque sans éclairer.
      - Mais cacher les images, n’est-ce pas minimiser la réalité ?
      - Non, à condition de raconter clairement ce qui s’est passé, de vérifier les faits et de replacer l’image dans son contexte.
      - Donc vous êtes pour ou contre la diffusion de ces séquences ?
      - Pour, mais pas n’importe comment. Le rôle d’un média n’est pas de retenir l’attention à tout prix ; c’est d’aider le public à comprendre.
    prompt: Quelle est la position du second intervenant ?
    options:
    - diffuser sans précaution
    - tout cacher
    - diffuser avec contexte
    - privilégier le choc
    answer: 2
    explanation: Il accepte la diffusion, mais seulement avec explication, vérification et contexte. Les
      autres propositions vont contre cette position nuancée.
