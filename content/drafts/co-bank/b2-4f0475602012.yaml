  item:
    slug: co-b2-comptes-de-voyage
    cefr: B2
    origin: generated
    focus: information implicite
    audio_text: 'Sur les réseaux, certains comptes de voyage donnent l’impression qu’un lieu se résume
      à trois adresses et à un coucher de soleil. Le problème n’est pas qu’ils parlent de leurs séjours
      ; c’est qu’ils effacent tout ce qui gêne : la météo, les files d’attente, les trajets compliqués,
      le budget réel. À force, on vend une expérience lisse, presque irréelle. Je ne demande pas des récits
      pessimistes, mais un minimum d’honnêteté. Quand un influenceur précise qu’il a été invité, qu’il
      a voyagé hors saison ou que certaines images ont été mises en scène, le public peut enfin se faire
      une idée juste. Sinon, on entretient une frustration inutile.'
    prompt: Selon le locuteur, le principal défaut de ces comptes est…
    options:
    - parler trop des trajets
    - manquer d’images
    - encourager le voyage hors saison
    - embellir la réalité
    answer: 3
    explanation: Il reproche aux influenceurs de présenter une expérience « lisse, presque irréelle »,
      donc d’embellir la réalité. Les autres propositions reprennent des éléments cités dans le document,
      mais ce n’est pas ce qui lui est reproché.
