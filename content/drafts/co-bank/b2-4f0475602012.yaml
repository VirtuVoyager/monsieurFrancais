  item:
    slug: co-b2-voyager-hors-saison
    cefr: B2
    origin: generated
    focus: information implicite
    audio_text: Je conseille souvent de partir hors saison, non pas pour faire des économies à tout prix,
      même si elles existent, mais parce qu’on voit alors le lieu autrement. Les sites ne sont pas envahis,
      les employés des petits cafés ont le temps d’échanger, et les habitants supportent mieux la présence
      des voyageurs. On découvre moins une carte postale qu’un vrai quotidien. Bien sûr, il faut accepter
      un ciel parfois moins parfait ou des horaires plus réduits. Mais si l’on cherche à comprendre une
      destination, la tranquillité vaut souvent mieux que la foule. Au fond, voyager hors saison, c’est
      accepter quelques limites pour gagner en qualité de rencontre.
    prompt: Pourquoi le guide recommande-t-il cette période ?
    options:
    - la météo est meilleure
    - les rencontres sont meilleures
    - le prix est plus bas
    - les horaires sont plus longs
    answer: 1
    explanation: Il explique que l’intérêt principal est la qualité des échanges avec les habitants et
      la découverte d’un quotidien plus authentique. Les autres propositions sont évoquées comme secondaires
      ou contraires au document.
