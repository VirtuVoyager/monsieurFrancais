  item:
    slug: co-b2-billets-a-bas-prix
    cefr: B2
    origin: generated
    focus: prise de position nuancée
    audio_text: 'Quand on compare les vols, on ne peut plus se contenter d’un prix d’appel. Les compagnies
      à bas coût ont rendu l’avion accessible à beaucoup de gens, c’est vrai, et ce n’est pas négligeable.
      Mais elles supposent un passager très organisé, qui n’a pas besoin de changer d’horaires et qui
      voyage léger. Dès qu’on ajoute un bagage, un siège choisi à l’avance ou une correspondance manquée,
      l’affaire est moins avantageuse. Je ne dis pas qu’il faut les éviter ; simplement, il faut les considérer
      pour ce qu’elles sont : une solution pratique pour certains séjours, pas une bonne réponse à tous
      les déplacements. En réalité, le vrai gain dépend moins de la compagnie que de notre façon de voyager.'
    prompt: Selon le locuteur, les compagnies à bas coût sont surtout…
    options:
    - idéales pour tous les trajets
    - intéressantes seulement avec bagage
    - utiles pour des voyages simples
    - réservées aux longs voyages
    answer: 2
    explanation: Le locuteur dit qu’elles sont « une solution pratique pour certains séjours », mais pas
      pour tous les déplacements. Les autres propositions contredisent cette nuance ou ajoutent une condition
      absente du document.
