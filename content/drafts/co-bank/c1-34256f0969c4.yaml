  item:
    slug: co-c1-centre-numerique
    cefr: C1
    origin: generated
    focus: objectif du dispositif
    audio_text: 'Dans notre centre, nous recevons chaque jour les mêmes demandes : changer un mot de passe,
      retrouver un formulaire, comprendre une démarche. Jusqu’ici, ces questions simples encombraient
      nos agents, qui passaient parfois plus de temps à répéter la même explication qu’à traiter les cas
      vraiment délicats. Nous avons donc testé un assistant numérique. Il ne prend pas les décisions,
      il ne ferme aucun dossier et il ne remplace personne. Son rôle est plus modeste, mais essentiel
      : répondre immédiatement aux demandes évidentes, orienter vers le bon service et signaler quand
      un dossier exige une vérification humaine. Certains y ont vu une manière de faire des économies.
      Ce n’est pas notre logique. Si nous l’adoptons, c’est pour que les conseillers puissent écouter
      plus longtemps les situations compliquées, celles où il faut comprendre un contexte, faire preuve
      de discernement, parfois même déroger à la règle. Autrement dit, la technologie n’est pas ici une
      fin en soi ; elle sert à redonner du temps au service public.'
    prompt: Pourquoi ce dispositif est-il mis en place ?
    options:
    - Pour traiter uniquement les urgences
    - Pour remplacer les conseillers
    - Pour réserver les conseillers aux cas complexes
    - Pour collecter plus de données personnelles
    answer: 2
    explanation: Le document précise que l’assistant répond aux demandes simples afin de laisser les conseillers
      aux situations compliquées. Les autres propositions contredisent clairement le texte ou lui prêtent
      un objectif absent.
