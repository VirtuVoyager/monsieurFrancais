  item:
    slug: co-c1-tutorat-en-ligne
    cefr: C1
    origin: generated
    focus: suivi des étudiants
    audio_text: |-
      - Nos étudiants apprécient les capsules vidéo, mais j’ai peur qu’ils s’illusionnent sur leur autonomie.
      - Comment ça ?
      - Une vidéo peut expliquer une notion. Elle ne repère pas la mauvaise méthode d’un élève, ni ne lui apprend à formuler une question. Or, sans ce va-et-vient, on finit par confondre consultation et compréhension.
      - Vous pensez donc que le problème n’est pas l’outil, mais le suivi ?
      - Exactement. Le tutorat en ligne est utile s’il sert à préparer un entretien, à orienter vers une ressource, à garder un lien entre deux séances. Mais si l’on remplace tout accompagnement par des contenus en accès libre, les plus autonomes avancent et les autres décrochent en silence.
      - Vous défendez donc un usage complémentaire.
      - Oui. Le numérique doit soutenir l’encadrement, pas l’effacer. Sinon, on appelle responsabilité individuelle ce qui est simplement abandon.
    prompt: Quel risque la femme veut-elle surtout éviter ?
    options:
    - Que les étudiants restent seuls
    - Que les vidéos soient gratuites
    - Que le campus ferme tôt
    - Que les professeurs corrigent plus
    answer: 0
    explanation: 'Elle dit clairement que, sans accompagnement, les moins autonomes décrochent en silence
      : elle veut donc éviter qu’ils restent seuls. Les autres propositions ne sont pas le sujet du dialogue.'
