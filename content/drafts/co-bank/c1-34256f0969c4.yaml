  item:
    slug: co-c1-competences-qui-passent
    cefr: C1
    origin: generated
    focus: rôle de la formation
    audio_text: Notre entreprise a changé plus vite que nos habitudes. En cinq ans, les logiciels ont
      évolué, les clients ont demandé des réponses plus rapides et plusieurs métiers se sont transformés
      sans qu’on s’en rende compte. Dans ce contexte, former les salariés n’est pas un luxe ni un avantage
      accessoire. C’est une manière de préserver une expertise collective. Quand un employé expérimenté
      part à la retraite, il emporte avec lui des gestes, des réflexes, des astuces qu’aucun mode d’emploi
      ne remplace. Nous avons donc mis en place un programme où les plus anciens transmettent leurs méthodes,
      pendant que les plus jeunes apportent leur aisance avec les outils numériques. Le but n’est pas
      d’obtenir un certificat de plus, ni d’imposer un cursus uniforme. Il s’agit d’accompagner une transition
      réelle, afin que chacun puisse tenir son poste sans se retrouver dépassé par les changements. En
      somme, nous investissons dans la formation pour que la transformation des métiers ne se fasse pas
      contre les personnes, mais avec elles.
    prompt: Pourquoi l’entreprise investit-elle dans la formation ?
    options:
    - Pour augmenter les tâches administratives
    - Pour remplacer les chefs d’équipe
    - Pour accompagner l’évolution des métiers
    - Pour réduire les salaires
    answer: 2
    explanation: Le texte dit explicitement que la formation sert à accompagner une transition réelle
      face à la transformation des métiers. Les autres réponses sont absentes du document et contredisent
      son intention.
