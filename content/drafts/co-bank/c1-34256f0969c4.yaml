  item:
    slug: co-c1-rattrapage-scolaire
    cefr: C1
    origin: generated
    focus: objectif social
    audio_text: 'Dans plusieurs quartiers, des élèves rentrent chez eux dans des conditions très différentes.
      Certains disposent d’une chambre calme, d’un ordinateur, parfois d’un parent pour relire une consigne.
      D’autres travaillent sur la table de la cuisine, au milieu du bruit, ou partagent un seul appareil
      avec leurs frères et sœurs. Nous avons donc ouvert des clubs d’étude en fin de journée, dans des
      bibliothèques de quartier. L’idée n’est pas de refaire les cours ni de transformer les bénévoles
      en professeurs. Il s’agit d’offrir un lieu stable, du matériel et surtout des adultes qui aident
      à s’organiser : comprendre la consigne, préparer un exposé, apprendre à chercher une source fiable.
      Ce cadre n’est pas spectaculaire, mais il compense une différence très concrète. Quand on dit qu’un
      élève doit travailler seul, on oublie souvent que tout le monde n’est pas seul de la même façon.
      Notre initiative part de ce constat, et c’est pour cela qu’elle vise en priorité les jeunes qui
      ont le moins de ressources à la maison.'
    prompt: À quel problème répond cette initiative ?
    options:
    - Au manque de loisirs
    - À l’absence d’évaluations régulières
    - Aux inégalités devant le travail scolaire
    - À la surcharge des programmes scolaires
    answer: 2
    explanation: Le texte insiste sur les conditions de travail très inégales à la maison et sur l’aide
      apportée après la classe. Les autres options ne correspondent pas au problème décrit.
