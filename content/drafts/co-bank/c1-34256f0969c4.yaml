  item:
    slug: co-c1-ecole-en-ligne
    cefr: C1
    origin: generated
    focus: nécessité d’échanges
    audio_text: |-
      - Avec les cours enregistrés, nos étudiants gagnent en souplesse. Ils peuvent revoir une explication, avancer à leur rythme, arriver en classe moins perdus.
      - Je suis d’accord, à condition de ne pas confondre souplesse et isolement. Si la vidéo remplace tout, on perd les questions imprévues, les hésitations utiles, l’échange qui fait émerger les malentendus.
      - Vous voulez donc garder des séances en présence ?
      - Oui, parce que la présence sert à discuter, à confronter les points de vue, à résoudre un problème ensemble. Le support numérique peut préparer, compléter, rappeler. Mais c’est en classe que l’apprentissage devient vivant.
      - Donc, pour vous, le modèle hybride n’est pas un compromis par défaut ?
      - Non, c’est un choix pédagogique, à condition que la partie en ligne libère du temps pour l’interaction, au lieu de l’appauvrir. Sinon, on gagne en confort ce qu’on perd en profondeur.
    prompt: Sur quoi repose leur accord ?
    options:
    - La supériorité du tout-en-ligne
    - L’abandon des contenus
    - Le retour aux manuels papier
    - La nécessité de maintenir les échanges
    answer: 3
    explanation: Les deux interlocuteurs s’accordent sur l’importance des échanges en présentiel, que
      le numérique doit soutenir et non remplacer. Les autres options déforment complètement leur position.
