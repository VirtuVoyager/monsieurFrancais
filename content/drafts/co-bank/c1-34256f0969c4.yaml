  item:
    slug: co-c1-algorithme-ouvert
    cefr: C1
    origin: generated
    focus: transparence des critères
    audio_text: 'On nous répète souvent que les algorithmes ne sont que des outils neutres, et qu’il suffit
      de les laisser fonctionner pour améliorer nos services. Cette idée est commode, mais elle oublie
      une chose simple : un outil qui trie, classe ou recommande finit par orienter nos choix, même s’il
      ne parle jamais. Quand un système décide quels contenus nous verrons en premier, quels dossiers
      remonteront ou quelles offres seront jugées pertinentes, il produit déjà une forme de pouvoir. C’est
      pourquoi notre association ne demande pas la disparition de ces systèmes. Nous demandons autre chose
      : que les critères soient explicables, que des audits indépendants puissent vérifier les effets
      indésirables et que les usagers sachent au moins pourquoi une proposition leur a été faite. Sans
      cette exigence de transparence, on confond efficacité technique et légitimité démocratique. Le vrai
      débat ne porte donc pas sur la technologie en elle-même, mais sur le droit de comprendre ce qui
      influence nos décisions.'
    prompt: Que réclame principalement l’intervenant ?
    options:
    - La transparence des critères
    - L’interdiction des plateformes
    - La suppression des publicités
    - La gratuité des logiciels
    answer: 0
    explanation: 'L’intervenant demande que les critères soient explicables et vérifiables par des audits
      indépendants : c’est bien une exigence de transparence. Les autres propositions ne correspondent
      pas à son argument.'
