  item:
    slug: co-b2-langue-au-travail
    cefr: B2
    origin: generated
    focus: rôle de l'entreprise
    audio_text: 'On demande souvent aux personnes immigrées de suivre des cours du soir, comme si cela
      réglait tout. En réalité, beaucoup travaillent en horaires décalés, gardent leurs enfants ou enchaînent
      plusieurs emplois. Dans ces conditions, venir deux soirs par semaine n''est pas toujours possible.
      Ce qui accélère vraiment l''apprentissage, c''est d''avoir aussi des occasions de parler au travail
      : une consigne expliquée calmement, un collègue qui corrige sans juger, un chef d''équipe qui accepte
      quelques minutes de plus au début. Les entreprises disent parfois qu''elles ne peuvent pas se mêler
      de formation linguistique. Pourtant, elles créent déjà les conditions de l''exclusion ou de l''intégration.
      Si elles veulent garder leurs salariés, elles ont intérêt à leur donner du temps et des situations
      concrètes pour progresser.'
    prompt: Quelle solution défend-il ?
    options:
    - Des cours obligatoires le soir.
    - Un soutien aussi au travail.
    - Des contrôles plus stricts.
    - Un apprentissage uniquement en ligne.
    answer: 1
    explanation: 'Le locuteur explique que l’apprentissage progresse quand l’entreprise offre du temps
      et des situations concrètes pour parler. Les autres réponses ne correspondent pas à son argument
      : il ne propose ni obligation du soir, ni contrôle, ni formation seulement en ligne.'
