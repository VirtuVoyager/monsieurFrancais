  item:
    slug: co-b2-bibliotheque-ouverte
    cefr: B2
    origin: generated
    focus: premier contact
    audio_text: |-
      - Dans votre bibliothèque, on voit des ateliers pour les nouveaux arrivants. Est-ce vraiment utile ?
      - Au début, je me posais la même question. Puis j'ai vu que beaucoup de personnes n'osent pas franchir la porte d'un équipement culturel. Elles viennent pour imprimer un document, chercher une adresse, et repartent si personne ne leur parle.
      - Et vos ateliers changent cela ?
      - Oui. Nous proposons des lectures très simples, un club de conversation, parfois des jeux avec les enfants. Ce n'est pas spectaculaire, mais cela donne un premier point d'appui.
      - Vous pensez donc que la bibliothèque remplit une mission sociale ?
      - Une mission parmi d'autres. Elle ne remplace ni l'école ni les associations. En revanche, c'est souvent l'endroit où quelqu'un se sent enfin autorisé à poser une question.
    prompt: Quel est son point de vue sur la bibliothèque ?
    options:
    - Elle peut servir de porte d'entrée.
    - Elle doit remplacer l'école.
    - Elle est utile seulement pour les enfants.
    - Elle devrait supprimer les livres difficiles.
    answer: 0
    explanation: Elle présente la bibliothèque comme un lieu où l’on ose entrer et poser une question,
      donc comme une porte d’entrée. Elle précise aussi qu’elle ne remplace ni l’école ni les associations,
      ce qui exclut les autres options.
