  item:
    slug: co-b2-fete-de-quartier
    cefr: B2
    origin: generated
    focus: fonction du festival
    audio_text: 'Dans le quartier de Montlierre, le festival de rue attire chaque année des habitants
      qui ne se parlaient jamais. Les organisateurs y voient un moyen simple de lancer des contacts :
      une scène, des stands, des repas préparés par des familles venues d''ailleurs et des anciens du
      quartier. Mais ils se gardent bien de présenter l''événement comme une solution miracle. « Un concert
      de deux heures ne suffit pas à créer un sentiment d''appartenance », explique le responsable. Selon
      lui, ce type de fête ouvre la porte, donne envie de revenir, puis il faut des lieux plus réguliers
      : ateliers sportifs, réunions d''école, jardin partagé. En d''autres termes, le festival n''est
      pas la fin du travail, c''est le début.'
    prompt: Quelle est l'attitude du responsable ?
    options:
    - Il juge la fête suffisante.
    - Il préfère supprimer les activités collectives.
    - Il pense qu'elle coûte trop cher.
    - Il la voit comme un point de départ.
    answer: 3
    explanation: Le responsable dit explicitement que le festival « ouvre la porte » et que « c’est le
      début », pas la fin. Les autres propositions contredisent cette idée ou ajoutent un reproche financier
      absent du document.
