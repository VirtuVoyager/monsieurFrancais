  item:
    slug: co-b2-theatre-mobile
    cefr: B2
    origin: generated
    focus: public actif
    audio_text: |-
      - Votre troupe joue dans des salles minuscules et parfois dans des gymnases. Est-ce un choix par défaut ?
      - Pas seulement. Nous voulons aller vers des publics qui ne viennent jamais au théâtre. Mais je ne crois pas qu'il suffise d'offrir un spectacle gratuit pour que les gens se sentent concernés.
      - Qu'est-ce qui manque alors ?
      - Le temps d'échanger. Après la représentation, nous restons pour discuter, et parfois le public choisit la seconde partie du programme. Quand quelqu'un propose un thème ou raconte ce qu'il a compris, il devient plus qu'un simple spectateur.
      - Donc vous cherchez moins à remplir la salle qu'à créer une expérience commune ?
      - Exactement. Si les gens repartent avec l'impression d'avoir été consultés, même un peu, ils reviendront. Sinon, le théâtre n'est qu'une sortie de plus.
    prompt: Qu'est-ce qui compte le plus pour lui ?
    options:
    - La gratuité des spectacles.
    - La participation du public.
    - Le nombre de représentations.
    - La longueur des pièces.
    answer: 1
    explanation: Il insiste sur l’échange après la représentation, sur le choix du programme et sur le
      fait d’être « consultés ». Les autres réponses ne correspondent pas à ce qu’il valorise le plus.
