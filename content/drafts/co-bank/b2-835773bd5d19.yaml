  item:
    slug: co-b2-sport-de-rencontre
    cefr: B2
    origin: generated
    focus: conditions de rencontre
    audio_text: 'On imagine souvent qu''un équipement sportif crée naturellement du lien. C''est faux.
      Si l''on laisse les nouveaux venus sur le bord du terrain, ils restent entre eux ou n''osent pas
      revenir. Dans notre centre, nous avons donc modifié les règles : équipes mélangées, séances plus
      courtes pour les débutants, bénévoles chargés d''expliquer sans juger. Nous invitons aussi les clubs
      à varier les activités, parce qu''un adulte n''a pas toujours le même rapport au sport qu''un adolescent.
      Le plus difficile n''est pas d''ouvrir la porte, c''est d''organiser la rencontre. Quand cela marche,
      on voit des gens qui ne se seraient jamais parlé discuter après l''entraînement. C''est là que le
      loisir devient un vrai outil d''intégration.'
    prompt: Selon lui, qu'est-ce qui est indispensable ?
    options:
    - Préparer les rencontres.
    - Laisser chacun pratiquer seul.
    - Réserver le centre aux licenciés.
    - Allonger les séances.
    answer: 0
    explanation: Le locuteur affirme que le plus important n’est pas d’ouvrir la porte, mais « d’organiser
      la rencontre ». Les autres propositions vont à l’encontre des mesures décrites dans le document,
      comme les équipes mélangées et l’accueil des débutants.
