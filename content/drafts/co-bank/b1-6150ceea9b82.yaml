    cefr: B1
    origin: generated
    focus: but de l'annonce
    audio_text: Bonjour à toutes et à tous. Le centre numérique de Valmont organise samedi matin une séance
      d'initiation pour apprendre à créer une adresse électronique, envoyer des documents et sécuriser
      ses mots de passe. Les personnes qui débutent sont les bienvenues, et des ordinateurs seront disponibles
      sur place. L'inscription se fait à l'accueil ou par téléphone avant vendredi soir. Si vous voulez
      mieux utiliser les services en ligne du quotidien, cette séance est pour vous.
    prompt: Quel est le but de cette annonce ?
    options:
    - présenter un nouveau site
    - proposer une séance d'initiation
    - annoncer une fermeture
    - vendre des ordinateurs
    answer: 1
    explanation: L'annonce invite le public à participer à une séance d'initiation au numérique. Elle
      ne présente pas un site, n'annonce pas une fermeture et ne cherche pas à vendre du matériel.
