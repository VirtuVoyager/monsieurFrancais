  item:
    slug: co-b1-application-d-etude
    cefr: B1
    origin: generated
    focus: avis sur l'application
    audio_text: J'ai repris des études le soir, après le travail, et j'avais besoin d'un outil simple.
      L'application que j'utilise maintenant me permet de faire de courtes révisions dans le métro, puis
      de retrouver mes erreurs plus tard. J'aime aussi les rappels automatiques, parce qu'ils m'évitent
      d'oublier mes séances. Ce n'est pas magique, mais pour quelqu'un qui manque de temps, c'est un vrai
      soutien.
    prompt: Quelle est son opinion sur l'application ?
    options:
    - elle est trop compliquée
    - elle l'aide beaucoup
    - elle remplace les cours
    - elle coûte trop cher
    answer: 1
    explanation: 'La personne dit qu''elle peut réviser partout, retrouver ses erreurs et s''organiser
      grâce à l''application : elle l''aide donc beaucoup. Rien dans le témoignage ne parle d''un prix
      élevé, d''une complexité excessive ou d''un remplacement des cours.'
