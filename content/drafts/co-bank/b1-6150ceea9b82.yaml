  item:
    slug: co-b1-dossiers-partages
    cefr: B1
    origin: generated
    focus: idée principale
    audio_text: |-
      - Tu as vu le message de Nora ? Elle propose qu'on utilise un espace partagé pour les dossiers du projet.
      - Oui, j'ai lu ça. Au lieu d'envoyer dix versions du même fichier par courriel, on mettrait tout au même endroit.
      - Exactement. Et chacun pourrait commenter directement les documents.
      - Je trouve l'idée bonne, surtout pour éviter les erreurs de dernière minute.
      - On en parle à la réunion de demain ?
      - Oui, parce que ce n'est pas un gros changement, mais ça peut nous faire gagner du temps.
    prompt: De quoi les collègues parlent-ils surtout ?
    options:
    - d'une panne d'ordinateur
    - de mieux organiser leurs dossiers
    - d'un changement de poste
    - d'une réunion avec la direction
    answer: 1
    explanation: Ils discutent d'un espace commun pour centraliser leurs fichiers et gagner du temps.
      La panne, le changement de poste et la réunion sont seulement mentionnés, mais ce n'est pas le sujet
      principal.
