  item:
    slug: co-b1-batterie-du-portable
    cefr: B1
    origin: generated
    focus: décision prise
    audio_text: |-
      - Mon ordinateur portable ne tient plus la charge. J'hésite à en acheter un autre.
      - Tu l'as montré à la boutique de réparation ?
      - Oui, et le technicien m'a dit que la batterie pouvait être changée pour bien moins cher qu'un appareil neuf.
      - Alors, tu devrais le faire réparer. En plus, ce serait plus raisonnable pour l'environnement.
      - Tu as raison. Et pour mes cours, il me le faut encore une bonne année.
      - Dans ce cas, je vais le déposer demain matin.
    prompt: Quelle décision prennent-ils ?
    options:
    - en acheter un neuf
    - faire changer la batterie
    - le prêter à un ami
    - attendre les soldes
    answer: 1
    explanation: Ils décident de le déposer pour remplacer la batterie, donc de le faire réparer. L'achat
      d'un neuf, le prêt et l'attente des soldes ne correspondent pas à ce qu'ils se disent.
