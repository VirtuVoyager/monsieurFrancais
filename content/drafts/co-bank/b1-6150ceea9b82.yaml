  item:
    slug: co-b1-cours-a-distance
    cefr: B1
    origin: generated
    focus: avantage du cours en ligne
    audio_text: Quand j'ai commencé le cours à distance, j'avais peur d'être seul devant mon écran. Finalement,
      ce qui m'aide le plus, c'est que je peux revoir les vidéos autant de fois que nécessaire et avancer
      à mon rythme. Sur le forum, on pose des questions et l'enseignante répond vite. Bien sûr, il faut
      être organisé, mais pour moi, c'est plus pratique que de courir chaque soir au centre de formation.
    prompt: Pourquoi cet étudiant apprécie-t-il surtout ce cours ?
    options:
    - il avance à son propre rythme
    - il n'a pas d'évaluations
    - il apprend sans effort
    - il n'a pas besoin de prof
    answer: 0
    explanation: Il explique que la possibilité de revoir les vidéos et d'avancer à son rythme est ce
      qu'il apprécie le plus. Les autres réponses vont à l'encontre de son témoignage, puisqu'il parle
      au contraire d'organisation, de questions et de réponse de l'enseignante.
