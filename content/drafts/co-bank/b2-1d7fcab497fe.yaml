  item:
    slug: co-b2-borne-itinerante
    cefr: B2
    origin: generated
    focus: Attitude nuancée
    audio_text: 'Depuis deux mois, la commune fait circuler une borne itinérante dans les villages éloignés.
      On y imprime un justificatif, on y vérifie une demande de logement ou on y lit avec un agent un
      courrier administratif. Pour le responsable du projet, le succès est réel, parce que des habitants
      qui renonçaient à se déplacer osent enfin demander de l’aide. Mais il refuse d’en faire une solution
      miracle. Certains dossiers exigent un entretien en mairie, d’autres un délai plus long que la tournée
      hebdomadaire. Autrement dit, ce service ne remplace pas le guichet traditionnel : il réduit surtout
      la distance entre l’administration et les usagers.'
    prompt: Quel est le point de vue du responsable sur ce service ?
    options:
    - Il veut le remplacer par la mairie.
    - Il le trouve trop coûteux pour être conservé.
    - Il le juge utile mais insuffisant.
    - Il estime qu’il suffit à tous les besoins.
    answer: 2
    explanation: Le texte dit clairement que le service a du succès, mais qu’il ne remplace pas le guichet
      traditionnel. Les autres propositions contredisent cette nuance ou exagèrent son efficacité.
