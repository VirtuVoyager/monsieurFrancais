  item:
    slug: co-b2-permanence-numerique
    cefr: B2
    origin: generated
    focus: Autonomie des usagers
    audio_text: 'Dans cette permanence numérique installée à la maison de quartier, les bénévoles ne font
      pas les démarches à la place des habitants. Ils montrent comment créer un compte, scanner une pièce
      justificative, retrouver un mot de passe ou envoyer un formulaire. Beaucoup de personnes arrivent
      avec une peur très simple : se tromper et devoir tout recommencer. La coordinatrice estime que le
      plus important n’est pas de fermer un dossier pendant la séance, mais de faire en sorte que chacun
      puisse recommencer seul la fois suivante. Si besoin, ils laissent aussi une note simple pour refaire
      la démarche chez soi. C’est pourquoi l’équipe prend le temps d’expliquer, quitte à aller moins vite.'
    prompt: Quel est l’objectif principal de cette permanence ?
    options:
    - Faire les démarches à la place des usagers.
    - Rendre les usagers plus autonomes.
    - Réserver l’aide aux spécialistes.
    - Déplacer tous les services en ligne.
    answer: 1
    explanation: Le texte insiste sur l’apprentissage et sur la capacité à recommencer seul ensuite. Les
      autres réponses contredisent cette logique en proposant de faire les démarches à la place des personnes
      ou de limiter l’aide.
