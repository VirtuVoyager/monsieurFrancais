    focus: Avantage du dispositif
    audio_text: Dans plusieurs quartiers, la ville a installé un atelier mobile où l’on peut faire réparer
      un grille-pain, une lampe ou un aspirateur. L’élue chargée du projet précise qu’il ne s’agit pas
      de concurrencer les professionnels, mais d’éviter que des objets soient jetés trop vite. Des bénévoles
      et quelques techniciens accueillent les habitants, montrent les gestes simples et expliquent aussi
      quand la réparation n’est pas raisonnable. Ce qui plaît le plus, dit-elle, c’est que les visiteurs
      ne repartent pas seulement avec un appareil en état de marche. Ils comprennent mieux comment l’entretenir
      et se sentent moins dépendants du remplacement immédiat. L’atelier se déplace de quartier en quartier.
    prompt: Quel avantage du dispositif est surtout souligné ?
    options:
    - Les objets sont remplacés immédiatement.
    - Les habitants apprennent à réparer eux-mêmes.
    - Le service fonctionne sans bénévoles.
    - Les réparations sont toujours gratuites.
    answer: 1
    explanation: 'Le texte insiste sur l’apprentissage des gestes simples et sur l’autonomie des habitants.
      Les autres options déforment le projet : on ne remplace pas les objets, le service utilise des bénévoles
      et la gratuité n’est jamais affirmée.'
