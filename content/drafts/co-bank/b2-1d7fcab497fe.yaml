  item:
    slug: co-b2-mediation-de-quartier
    cefr: B2
    origin: generated
    focus: Rôle du service
    audio_text: 'Le service de médiation de quartier reçoit des habitants bien avant que la colère ne
      devienne un dossier. Les médiateurs n’ont pas pour mission de décider qui a tort ou raison. Ils
      écoutent, reformulent, et aident chacun à dire les choses sans agresser l’autre. Quand cela suffit,
      ils rédigent un accord simple que les deux parties signent. Quand cela ne suffit pas, ils orientent
      vers l’aide appropriée. Ils peuvent aussi proposer un premier rendez-vous commun quand les échanges
      deviennent tendus. La responsable insiste sur ce point : leur travail n’est ni celui de la police
      ni celui d’un juge. Il sert surtout à éviter que des tensions ordinaires se transforment en conflit
      durable.'
    prompt: À quoi sert principalement ce service ?
    options:
    - À sanctionner les voisins qui font du bruit.
    - À éviter que les tensions se transforment en conflit.
    - À gérer les dossiers envoyés au tribunal.
    - À défendre systématiquement un habitant.
    answer: 1
    explanation: La fin du document précise que le service sert surtout à empêcher l’escalade des tensions.
      Les autres réponses décrivent un rôle de sanction, de justice ou de parti pris, que le texte exclut.
