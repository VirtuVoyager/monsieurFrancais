  item:
    slug: co-b2-permanence-juridique
    cefr: B2
    origin: generated
    focus: Prévention des blocages
    audio_text: Chaque semaine, une association tient une permanence juridique dans le centre social.
      Les visiteurs n’y viennent pas seulement quand un litige est déjà engagé. Beaucoup arrivent avec
      un courrier incompris, une échéance qui approche ou une question avant de signer un document. Les
      bénévoles n’interviennent pas à la place d’un avocat et ne tranchent pas les conflits. Ils aident
      surtout à lire les pièces, à repérer le point sensible et à préparer les bonnes questions. La responsable
      rappelle que ce travail discret évite souvent des erreurs coûteuses. En clair, mieux vaut passer
      les voir avant que la situation ne se bloque.
    prompt: Pourquoi cette permanence est-elle utile ?
    options:
    - Elle permet d’agir avant que la situation ne se bloque.
    - Elle règle les procès à la place des avocats.
    - Elle s’adresse uniquement aux salariés.
    - Elle remplace les formulaires administratifs.
    answer: 0
    explanation: 'La dernière phrase donne la réponse : l’intérêt est d’intervenir avant le blocage. Les
