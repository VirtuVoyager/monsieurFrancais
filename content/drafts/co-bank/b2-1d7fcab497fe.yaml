  item:
    slug: co-b2-repas-solidaires
    cefr: B2
    origin: generated
    focus: Valeur du lien
    audio_text: |-
      - Votre association a remplacé les distributions de paniers par des ateliers de cuisine. Pourquoi ce choix ?
      - Parce qu’un colis aide sur le moment, mais il laisse parfois les gens passifs. Dans les ateliers, chacun prépare, discute, goûte, emporte une part et, surtout, se sent utile. Nous travaillons avec des produits donnés par la banque alimentaire, mais l’idée n’est pas seulement de nourrir. C’est aussi de recréer des habitudes, d’échanger des recettes et de faire en sorte que personne ne vienne ici comme un simple bénéficiaire.
      - Donc vous cherchez autre chose qu’un service pratique.
      - Exactement. Nous voulons que l’aide soit vécue comme une relation, pas comme une file d’attente.
    prompt: Quelle idée défend le responsable ?
    options:
    - L’aide doit rester anonyme.
    - L’aide doit aussi créer du lien.
    - L’aide doit se concentrer sur les colis.
    - L’aide doit être réservée aux urgences.
    answer: 1
    explanation: Le responsable explique que l’objectif n’est pas seulement de nourrir, mais de recréer
      des habitudes et des échanges. Les autres propositions vont contre cette idée ou la réduisent à
      une simple distribution.
