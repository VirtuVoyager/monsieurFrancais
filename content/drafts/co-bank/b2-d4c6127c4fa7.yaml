  item:
    slug: co-b2-tarifs-variables
    cefr: B2
    origin: generated
    focus: logique de la tarification
    audio_text: |-
      - Vos tarifs changent beaucoup d’un jour à l’autre. Beaucoup de voyageurs ont l’impression d’être pénalisés.
      - Je comprends cette impression. Pourtant, l’objectif n’est pas de faire payer tout le monde au maximum. Quand un train se remplit, le prix plus élevé sert à répartir les réservations sur plusieurs jours et à éviter que tous les départs soient pris d’assaut au dernier moment. Ceux qui s’organisent tôt paient souvent moins, et cela nous aide à mieux remplir les trains.
      - Mais ce système reste difficile à lire.
      - Oui, et c’est un vrai problème. Si le client ne comprend pas la logique du tarif, il finit par penser que tout est arbitraire. Nous travaillons justement à rendre l’information plus lisible.
    prompt: Pourquoi ces tarifs variables sont-ils utilisés ?
    options:
    - Pour faire payer davantage les abonnés
    - Pour répartir les réservations dans le temps
    - Pour remplacer les réductions de dernière minute
    - Pour supprimer les trains trop remplis
    answer: 1
    explanation: 'Le représentant explique que les prix servent à répartir les réservations sur plusieurs
      jours et à éviter l’afflux de dernière minute. Les autres options ne correspondent pas : il ne parle
      pas de punir les abonnés, de remplacer des réductions, ni de supprimer des trains.'
- status: ok
