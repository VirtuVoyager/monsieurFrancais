  item:
    slug: co-b2-consigne-colis
    cefr: B2
    origin: generated
    focus: avantage principal
    audio_text: 'Recevoir un colis en consigne automatique, ce n’est pas seulement une question de confort.
      Pour les transporteurs, le système évite beaucoup d’allers-retours inutiles : quand un client est
      absent, le livreur n’a pas à repasser le lendemain. Pour les villes, cela limite aussi le nombre
      de camionnettes qui tournent dans les rues. Évidemment, le service n’est intéressant que si le point
      de retrait se trouve sur un trajet habituel, près du travail ou du domicile. Sinon, on perd son
      temps à faire un détour. Mais lorsqu’il est bien placé, le casier devient une solution assez sobre
      : moins d’échecs de livraison, moins de circulation et, souvent, des frais un peu plus bas que la
      remise à domicile.'
    prompt: Quel avantage principal est mis en avant ?
    options:
    - Moins de livraisons ratées et moins de circulation
    - Un service réservé aux gros colis
    - Un retrait plus rapide que partout ailleurs
    - Des frais identiques à domicile
    answer: 0
    explanation: 'Le document met en avant la réduction des échecs de livraison et du trafic de camionnettes
      en ville. Les autres propositions sont incompatibles avec le texte : le service n’est pas réservé
      aux gros colis, n’est pas présenté comme toujours plus rapide et n’a pas des frais identiques à
      domicile.'
