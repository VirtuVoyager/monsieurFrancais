  item:
    slug: co-b2-achats-sans-emballage
    cefr: B2
    origin: generated
    focus: nuance sur les comportements
    audio_text: 'Dans les enquêtes d’opinion, une majorité de consommateurs dit vouloir moins d’emballages.
      Mais, sur le terrain, le discours change dès qu’il faut apporter son contenant, attendre un peu
      plus longtemps ou vérifier le poids de ses achats. Beaucoup réclament des rayons en vrac, puis choisissent
      le produit déjà emballé parce qu’il paraît plus pratique. Ce n’est pas forcément de la mauvaise
      foi : le quotidien impose des contraintes réelles. Cependant, il faut reconnaître que la demande
      de simplicité est souvent plus forte que la volonté de limiter les déchets. Les enseignes l’ont
      compris et travaillent surtout sur des solutions très faciles à utiliser, faute de quoi les bonnes
      intentions restent au niveau des sondages.'
    prompt: Quelle nuance le journaliste souligne-t-il ?
    options:
    - Les consommateurs passent souvent de l’intention à la pratique
    - Les magasins ne veulent pas réduire les emballages
    - Le vrac est toujours moins cher
    - Les clients achètent surtout par manque de choix
    answer: 0
    explanation: 'Le document oppose les déclarations favorables aux emballages réduits et les choix réels
      des clients en magasin. Les autres réponses ne résument pas le propos : le journaliste ne dit pas
      que les magasins refusent de changer, ni que le vrac est toujours moins cher, ni que le problème
      vient seulement du manque de choix.'
- status: ok
