  item:
    slug: co-b2-telephone-reconditionne
    cefr: B2
    origin: generated
    focus: avantage du produit
    audio_text: On me demande souvent si acheter un téléphone reconditionné est un bon calcul. La réponse
      est oui, mais pas pour les raisons que l’on croit. Ce n’est pas un produit miracle ni un gadget
      d’occasion vendu à moitié prix. L’intérêt, c’est qu’il a été vérifié, remis en état, puis revendu
      avec une garantie. Du coup, on évite de payer le tarif du dernier modèle, alors que, pour la plupart
      des usages, la différence est minime. Et surtout, on prolonge la vie d’un appareil qui aurait pu
      finir au rebut. Bien sûr, il faut accepter qu’il ne soit pas neuf et qu’il présente parfois une
      batterie moins performante. Mais si l’on cherche un achat raisonnable, c’est souvent un meilleur
      compromis que le tout neuf acheté sur un coup de tête.
    prompt: Pourquoi la journaliste trouve-t-elle cet achat intéressant ?
    options:
    - Il est toujours plus performant
    - Il permet de payer moins et d’éviter le gaspillage
    - Il remplace la garantie du fabricant
    - Il convient seulement aux petits budgets
    answer: 1
    explanation: 'Le document insiste sur le fait qu’on paie moins que pour le dernier modèle et qu’on
      prolonge la vie de l’appareil. Les autres réponses sont fausses : le téléphone n’est pas présenté
      comme plus performant, ni comme remplaçant la garantie, ni comme réservé aux petits budgets.'
