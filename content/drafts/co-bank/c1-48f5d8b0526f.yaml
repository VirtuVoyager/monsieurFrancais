  item:
    slug: co-c1-programme-passerelles
    cefr: C1
    origin: generated
    focus: objectif du programme
    audio_text: 'Dans notre ville, beaucoup de personnes arrivent avec un diplôme, une expérience, parfois
      des enfants, mais sans réseau. Le problème, ce n’est pas seulement la langue ou le logement ; c’est
      le passage entre le statut de nouvel arrivant et une vraie place dans la cité. C’est pour cela que
      nous lançons le programme Passerelles. Chaque participant est accompagné par un binôme de bénévoles
      : on fait d’abord les démarches utiles, puis on découvre les services du quartier, la médiathèque,
      le centre sportif, les associations. L’idée n’est pas d’imposer un modèle unique ni de remplacer
      les dispositifs existants. Nous voulons créer des points d’appui concrets, afin que chacun puisse
      choisir, comprendre, oser parler, et surtout rencontrer des habitants qui ne soient pas seulement
      des fonctionnaires ou des professeurs. Quand on se sent attendu quelque part, on apprend plus vite
      et on reste davantage. C’est cela, pour nous, l’intégration : pas une injonction, mais une relation.'
    prompt: Quel est l’objectif principal du programme présenté ?
    options:
    - Créer des points d’appui pour faciliter l’intégration
    - Multiplier les cours intensifs de français
    - Recruter des bénévoles pour l’été
    - Financer des activités de loisirs pour les étudiants
    answer: 0
    explanation: Le texte dit clairement que le programme vise à créer des « points d’appui concrets »
      pour que les nouveaux arrivants trouvent leur place. Les autres propositions ne correspondent qu’à
      des éléments secondaires ou absents du document.
