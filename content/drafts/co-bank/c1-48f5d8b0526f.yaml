  item:
    slug: co-c1-loisirs-citoyens
    cefr: C1
    origin: generated
    focus: attitude du chroniqueur
    audio_text: 'On présente souvent les loisirs comme un luxe, une récompense après les choses sérieuses.
      Cette façon de voir est trompeuse. Dans un quartier où les habitants se croisent peu, une bibliothèque
      de rue, un atelier de danse, une projection en plein air ou un cercle de jeu ne sont pas des fioritures
      ; ce sont des lieux où l’on apprend à coexister sans se ressembler. Le plaisir partagé n’est pas
      l’ennemi de la citoyenneté, il en est parfois la condition. Bien sûr, il ne faut pas idéaliser un
      concert de quartier comme s’il allait résoudre les inégalités. Mais on aurait tort de croire que
      la culture de proximité est un simple divertissement. Elle tisse des habitudes de présence, de respect,
      d’écoute. En ce sens, la vraie question n’est pas : « Faut-il de la culture pour s’amuser ? » C’est
      plutôt : « Comment une ville choisit-elle de vivre ensemble ? »'
    prompt: Quel est le point de vue du chroniqueur ?
    options:
    - Les loisirs doivent rester réservés à l’élite
    - La culture de quartier est une dépense inutile
    - Les loisirs peuvent favoriser le lien collectif
    - Le loisir relève surtout d’une obligation administrative
    answer: 2
    explanation: Le chroniqueur défend l’idée que les loisirs et la culture de proximité contribuent au
      vivre-ensemble. Les autres propositions déforment complètement son jugement.
