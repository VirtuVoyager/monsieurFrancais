  item:
    slug: co-c1-rencontres-de-quartier
    cefr: C1
    origin: generated
    focus: implicite sur l’intégration
    audio_text: |-
      - Vous insistez beaucoup sur ces ateliers de cuisine et ces sorties au parc. On pourrait croire que ce n’est qu’un supplément sympathique.
      - Justement, si l’on réduit l’accueil à un dossier bien rempli et à quelques consignes, on passe à côté de l’essentiel.
      - Vous pensez aux contacts informels ?
      - Oui. Quand une famille nouvellement arrivée vient préparer un repas avec des voisins, quand un adolescent joue au football avec des jeunes du quartier, il apprend des codes qu’aucun livret n’explique. On ne demande pas aux gens de « s’intégrer » comme on coche une case. On leur donne l’occasion de participer.
      - Donc, pour vous, la priorité n’est pas d’organiser plus de réunions institutionnelles ?
      - Elles sont utiles, bien sûr. Mais sans lieux où l’on se rencontre réellement, l’intégration reste un mot abstrait. Ce qui change la donne, c’est la pratique partagée.
    prompt: Que veut montrer la femme ?
    options:
    - Que la mairie doit contrôler les arrivées
    - Que les associations sont devenues inutiles
    - Que l’intégration passe par des activités vécues ensemble
    - Que les réunions officielles suffisent à créer du lien
    answer: 2
    explanation: Elle explique que les ateliers, le sport et les repas partagés donnent des codes et créent
      une participation réelle. Les autres réponses reprennent des idées contredites par le dialogue.
