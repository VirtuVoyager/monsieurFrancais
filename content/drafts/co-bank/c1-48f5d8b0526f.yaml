  item:
    slug: co-c1-scene-partagee
    cefr: C1
    origin: generated
    focus: objectif de la programmation
    audio_text: |-
      - Pourquoi avoir invité des troupes très différentes au même événement ? On aurait pu faire un cycle consacré uniquement aux artistes venus d’ailleurs.
      - C’est précisément ce que nous voulions éviter.
      - Vous craignez l’effet vitrine ?
      - Oui. Quand on isole les créateurs selon leur origine, on croit les valoriser, mais on les enferme souvent dans une étiquette. Notre festival réunit des compagnies locales, des artistes récemment installés et des formations plus anciennes, parce que la rencontre artistique vaut mieux qu’un discours sur la diversité.
      - D’où les ateliers dans les écoles et les répétitions ouvertes ?
      - Exactement. Le but n’est pas de montrer une différence une fois par an, mais de créer des habitudes de travail communes. Le public vient pour un spectacle, et il repart avec une perception plus large de ce que peut être une scène partagée.
    prompt: Pourquoi cette programmation a-t-elle été pensée ?
    options:
    - Pour refuser un tri par origine et favoriser la rencontre
    - Pour remplacer les spectacles par des ateliers scolaires
    - Pour réserver le festival à un public spécialisé
    - Pour mettre en avant une seule esthétique
    answer: 0
    explanation: La responsable explique que le festival veut éviter d’enfermer les artistes dans leur
      origine et créer un travail commun. Les autres réponses contredisent directement ce qui est dit.
