  item:
    slug: co-c1-loisir-dintegration
    cefr: C1
    origin: generated
    focus: structure du raisonnement
    audio_text: 'Quand une personne s’installe dans un pays nouveau, on lui demande d’abord de comprendre
      les règles, de trouver un logement, de travailler, d’apprendre la langue. Tout cela est essentiel.
      Mais si l’on s’arrête là, on oublie qu’un individu ne vit pas seulement de procédures. Il a aussi
      besoin de récits, de repos, de moments gratuits, de lieux où l’on partage quelque chose sans devoir
      tout expliquer. C’est pour cela que nous défendons l’accès aux activités culturelles dès les premiers
      mois d’installation. Non pas comme une récompense une fois les démarches terminées, mais comme un
      appui pour les accomplir. Aller au cinéma avec des voisins, suivre un atelier de photographie, participer
      à une chorale : ce sont parfois ces expériences qui donnent confiance pour oser ensuite téléphoner,
      demander, s’inscrire, parler. Le loisir, loin d’être un supplément, peut devenir une étape de l’intégration.'
    prompt: Comment l’intervenant organise-t-il son argumentation ?
    options:
    - Il part d’un besoin concret puis élargit à une idée générale
    - Il raconte une anecdote sans conclure
    - Il oppose deux partis politiques
    - Il accumule surtout des données chiffrées
    answer: 0
    explanation: L’intervenant commence par les besoins très concrets du nouvel arrivant, puis élargit
      à une thèse sur le rôle des activités culturelles. Les autres options ne correspondent pas à la
      progression du discours.
