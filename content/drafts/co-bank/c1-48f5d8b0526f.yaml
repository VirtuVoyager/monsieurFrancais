  item:
    slug: co-c1-club-inclusif
    cefr: C1
    origin: generated
    focus: condition d’intégration
    audio_text: |-
      - Vous dites que le club accueille tout le monde, mais certains nouveaux inscrits ne reviennent pas.
      - Parce qu’inscrire une personne ne suffit pas à l’intégrer.
      - Vous pensez aux vestiaires, aux habitudes du groupe ?
      - À tout cela. Si les plus anciens se connaissent déjà, rient entre eux et laissent les autres à la marge, la bonne volonté ne dure pas. Il faut des règles simples : des binômes qui changent, des entraînements mixtes, et surtout un encadrement qui surveille les petites exclusions.
      - Donc, l’objectif n’est pas seulement sportif.
      - Non. Le sport peut aider, à condition d’organiser la rencontre. Sinon, on reproduit les frontières du dehors à l’intérieur du club.
    prompt: Que reconnaissent les deux interlocuteurs ?
    options:
    - Qu’une activité commune doit être encadrée pour inclure vraiment
    - Qu’il faut séparer les groupes selon la langue
    - Qu’un club doit réduire les entraînements
    - Que le sport suffit toujours à créer du lien
    answer: 0
    explanation: Ils s’accordent sur le fait qu’il faut des règles et un encadrement pour que la rencontre
      produise de l’inclusion. Les autres propositions s’éloignent de ce constat ou le contredisent.
