  item:
    slug: co-c1-culture-hospitaliere
    cefr: C1
    origin: generated
    focus: idée principale
    audio_text: 'On dit souvent que les gens ne vont plus au théâtre, au musée, aux concerts de musique
      classique. On organise alors des opérations de séduction : un tarif symbolique, une photo sur les
      réseaux, quelques fauteuils plus confortables. C’est utile, sans doute, mais insuffisant. Le vrai
      obstacle n’est pas toujours le prix ; c’est le sentiment de ne pas avoir le bon code, le bon regard,
      la bonne façon de se tenir. Autrement dit, l’institution culturelle reste parfois conçue pour ceux
      qui savent déjà en pousser la porte. Il ne s’agit pas de simplifier les œuvres ni de les rendre
      inoffensives. Il s’agit de penser l’accueil, l’accompagnement, la parole, le droit de ne pas tout
      comprendre d’emblée. Une salle qui explique, qui donne envie de revenir, qui accepte les hésitations,
      gagne un public plus large sans renoncer à son exigence.'
    prompt: Quelle est l’idée principale de la chronique ?
    options:
    - Multiplier les horaires de soirée
    - Supprimer les expositions permanentes
    - Rendre la culture plus accueillante sans l’appauvrir
    - Réserver les lieux culturels aux connaisseurs
    answer: 2
    explanation: La chronique défend une culture plus accessible, mais sans renoncer à l’exigence artistique.
      Les autres options isolent un détail ou vont à l’encontre du propos.
