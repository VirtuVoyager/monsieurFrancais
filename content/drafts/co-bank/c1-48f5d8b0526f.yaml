  item:
    slug: co-c1-premier-accueil
    cefr: C1
    origin: generated
    focus: rôle du centre
    audio_text: 'Notre centre n’a pas vocation à se substituer aux services sociaux ni aux associations
      spécialisées. Nous avons plutôt conçu un lieu de première orientation. Une personne arrive, elle
      ne sait pas toujours à qui parler, ni dans quel ordre faire ses démarches. Ici, elle rencontre un
      agent qui écoute sa situation, identifie l’urgence, puis la dirige vers le bon interlocuteur : école,
      santé, emploi, logement, apprentissage du français. Nous proposons aussi des permanences collectives,
      parce qu’on comprend mieux une ville quand on la parcourt avec d’autres. Plusieurs visiteurs nous
      disent qu’ils se sentaient perdus dans les formulaires ; après deux ou trois rendez-vous, ils savent
      où aller et peuvent faire des choix plus sereinement. Ce service est donc moins un guichet qu’un
      point de départ.'
    prompt: À quoi sert surtout ce centre ?
    options:
    - Enseigner un métier en quelques semaines
    - Orienter les nouveaux arrivants vers les bons services
    - Délivrer des titres de séjour
    - Organiser des fêtes locales
    answer: 1
    explanation: Le texte insiste sur la « première orientation » et le fait de diriger chacun vers le
      bon interlocuteur. Les autres options ne sont pas l’objectif principal mentionné.
