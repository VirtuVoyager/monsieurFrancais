  item:
    slug: co-b1-marche-quotidienne
    cefr: B1
    origin: generated
    focus: avis sur l'effort
    audio_text: Pendant longtemps, je me disais que je n'avais pas le temps de faire du sport. Je rentrais
      tard, je m'asseyais immédiatement, et je finissais la semaine complètement vidé. Puis une collègue
      m'a proposé de marcher vingt minutes après le déjeuner. Au début, j'ai trouvé l'idée trop simple
      pour être efficace. Pourtant, en quelques semaines, j'ai dormi mieux et je me suis senti moins stressé.
      Je ne prétends pas qu'il faut devenir un athlète, mais je crois qu'il vaut mieux commencer petit
      et être régulier.
    prompt: Quelle est l'opinion du locuteur ?
    options:
    - Il faut un sport intense
    - Le repos est la seule solution
    - La marche fatigue davantage
    - Il vaut mieux commencer modestement
    answer: 3
    explanation: Le locuteur dit clairement qu’il vaut mieux « commencer petit et être régulier ». Les
      autres réponses sont contraires à son avis ou ne sont pas soutenues par ce qu’il raconte.
