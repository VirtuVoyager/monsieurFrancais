  item:
    slug: co-b1-climatisation-trop-forte
    cefr: B1
    origin: generated
    focus: proposition de solution
    audio_text: |-
      - Tu as l'air épuisée, Élodie.
      - Oui, j'ai mal à la tête depuis ce matin. Je pense que la climatisation est trop forte ici.
      - On pourrait ouvrir la fenêtre un moment.
      - Oui, et je vais demander à tout le monde de faire une vraie pause à midi. On travaille sans sortir depuis trop longtemps.
      - Tu as raison. Ça nous ferait du bien à tous.
    prompt: Quelle est l'intention de la femme ?
    options:
    - Se plaindre de l'ambiance
    - Reporter le travail
    - Parler d'un traitement
    - Trouver une solution
    answer: 3
    explanation: 'La femme ne fait pas que constater le problème : elle propose d’ouvrir la fenêtre, de
      faire une vraie pause et de demander un changement. Les autres réponses ne correspondent pas, car
      elle ne repousse pas le travail et ne parle pas d’un médicament.'
