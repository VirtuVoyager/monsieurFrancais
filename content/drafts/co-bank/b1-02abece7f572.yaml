  item:
    slug: co-b1-douleurs-de-dos
    cefr: B1
    origin: generated
    focus: conseil du spécialiste
    audio_text: |-
      - Dans votre cabinet, que conseillez-vous aux personnes qui ont souvent mal au dos ?
      - D'abord, de ne pas attendre que la douleur devienne forte. Souvent, quelques gestes simples suffisent : bouger un peu plus, régler la chaise, éviter de porter trop lourd.
      - Donc il ne faut jamais se reposer ?
      - Pas forcément. Le repos est parfois utile, mais il ne règle pas tout. Le plus important, c'est de demander conseil tôt, avant que le problème ne s'installe.
    prompt: Quel est le message du spécialiste ?
    options:
    - Il faut consulter rapidement
    - Il faut rester immobile
    - Le dos guérit toujours seul
    - Les chaises sont inutiles
    answer: 0
    explanation: Le spécialiste insiste sur l’importance de demander conseil tôt, avant que la situation
      ne s’aggrave. Les autres réponses sont contredites par le document ou vont trop loin.
