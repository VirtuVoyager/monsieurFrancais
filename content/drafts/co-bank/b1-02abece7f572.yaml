  item:
    slug: co-b1-bacs-de-tri
    cefr: B1
    origin: generated
    focus: changement de tri
    audio_text: À partir de lundi, les sacs verts seront remplacés par des bacs bruns dans tout le quartier.
      Vous pourrez y déposer les restes de repas, les épluchures et le marc de café. Les emballages en
      plastique continueront d'aller dans la poubelle jaune. Cette nouvelle organisation doit réduire
      les déchets envoyés à l'incinérateur et permettre la fabrication de compost pour les jardins municipaux.
      Un guide pratique sera distribué dans les boîtes aux lettres avant la fin de la semaine.
    prompt: Que doit-on comprendre ?
    options:
    - Les jardins ferment lundi
    - Le tri des déchets change
    - Le compost devient payant
    - Les sacs verts sont interdits partout
    answer: 1
    explanation: L’annonce explique qu’un nouveau système de collecte est mis en place avec des bacs bruns
      et un guide pratique. Les autres réponses ne sont pas annoncées ou déforment l’information.
