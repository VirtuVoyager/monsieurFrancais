  item:
    slug: co-b1-vaccin-contre-grippe
    cefr: B1
    origin: generated
    focus: utilité du vaccin
    audio_text: 'Cette année, la grippe arrive plus tôt que d''habitude. Le vaccin ne promet pas d''empêcher
      toute maladie, mais il réduit nettement les risques de formes graves. C''est particulièrement utile
      pour les personnes fragiles, mais aussi pour ceux qui vivent ou travaillent avec elles. Si vous
      hésitez encore, renseignez-vous auprès de votre médecin ou de votre pharmacien. Se protéger, ce
      n''est pas seulement penser à soi : c''est aussi limiter la circulation du virus dans son entourage.'
    prompt: Quel est le message principal ?
    options:
    - Le vaccin est indispensable pour tout le monde
    - La grippe ne concerne que les fragiles
    - Le vaccin est une mesure utile
    - Il faut éviter les contacts à tout prix
    answer: 2
    explanation: Le locuteur présente le vaccin comme une protection utile, même s’il ne garantit pas
      une absence totale de maladie. Les autres propositions sont trop fortes, inexactes ou ne reprennent
      pas l’idée centrale du message.
