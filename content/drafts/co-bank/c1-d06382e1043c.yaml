  item:
    slug: co-c1-campagne-sante-mentale
    cefr: C1
    origin: generated
    focus: objectif d’un organisme
    audio_text: 'Quand nous avons lancé l’Observatoire Bien-Être au Travail, nous ne voulions pas publier
      un énième guide qui finit sur une étagère. Notre problème était plus simple et plus grave : dans
      beaucoup d’entreprises, les signaux de détresse passent pour de la fatigue ordinaire. On attend
      que la personne s’isole, s’énerve ou s’absente longtemps pour réagir. Or, à ce stade, l’accompagnement
      devient plus lourd, pour elle comme pour l’équipe. C’est pourquoi notre nouvelle campagne, Parlons
      tôt, ne s’adresse pas d’abord aux psychologues, mais aux managers, aux représentants du personnel
      et aux collègues. Nous leur proposons des repères très concrets : une baisse brutale d’attention,
      un désengagement soudain, des phrases comme je n’y arrive plus. Nous ne promettons pas de diagnostiquer
      à distance ni de remplacer les professionnels. Nous voulons créer un réflexe simple : oser ouvrir
      la conversation avant que la situation ne se dégrade. Si la parole circule plus tôt, les personnes
      concernées acceptent plus facilement de consulter.'
    prompt: Quel est l’objectif principal de cette campagne ?
    options:
    - Aider à repérer plus tôt la détresse
    - Proposer une psychothérapie gratuite
    - Évaluer les managers
    - Remplacer les professionnels
    answer: 0
    explanation: 'Le locuteur dit clairement qu’il veut « ouvrir la conversation avant que la situation
      ne se dégrade » et faire repérer les signes de détresse plus tôt. Les autres propositions sont écartées
      dans le texte : il ne s’agit ni d’offrir des soins gratuits, ni d’évaluer les managers, ni de remplacer
      les professionnels.'
