  item:
    slug: co-c1-eau-du-robinet
    cefr: C1
    origin: generated
    focus: objectif d’une campagne
    audio_text: 'Dans plusieurs villes, on a longtemps laissé le marché des bouteilles décider de notre
      manière de boire. Or l’eau du robinet n’est ni un slogan ni un gadget écologique ; c’est un service
      public qui doit être visible et digne de confiance. C’est pourquoi la campagne lancée par Eau Claire
      ne se limite pas à dire : Buvez local. Elle installe des fontaines dans les lieux de passage, publie
      les résultats des analyses dans un langage compréhensible et répond aux inquiétudes sur le goût
      ou la qualité. Le but n’est pas de culpabiliser les personnes qui achètent encore de l’eau en bouteille.
      Il est plutôt de rappeler qu’une ressource déjà traitée, contrôlée et distribuée partout peut rester
      le premier réflexe, à condition qu’on la rende accessible et lisible. En réduisant les achats de
      plastique, on agit certes sur les déchets, mais on redonne aussi de la valeur à un bien commun que
      beaucoup utilisent sans y penser.'
    prompt: Quel est l’objectif principal de cette campagne ?
    options:
    - Rassurer sur l’eau du robinet
    - Interdire les bouteilles
    - Augmenter le prix de l’eau
    - Remplacer les analyses
    answer: 0
    explanation: Le document insiste sur la confiance, l’accessibilité et la lisibilité des contrôles
      pour faire de l’eau du robinet un réflexe. Il n’est nulle part question d’interdire les bouteilles,
      de changer le prix de l’eau ou de supprimer les analyses.
