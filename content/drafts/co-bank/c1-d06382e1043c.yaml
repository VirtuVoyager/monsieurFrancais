  item:
    slug: co-c1-reflexe-antibiotique
    cefr: C1
    origin: generated
    focus: structure de l’argumentation
    audio_text: 'Chaque hiver, le même réflexe revient : dès qu’une gorge brûle ou qu’un nez coule, certains
      réclament des antibiotiques comme on demanderait une assurance supplémentaire. C’est précisément
      contre ce réflexe que je veux revenir. Oui, personne n’aime être malade ; oui, attendre plusieurs
      jours quand on se sent faible n’a rien d’agréable. Mais transformer un inconfort en traitement systématique
      est une erreur. Les antibiotiques ne sont pas des calmants, et les utiliser à tort affaiblit leur
      efficacité pour les situations où ils sont vraiment indispensables. L’enjeu n’est donc pas de prôner
      la patience par principe, ni de nier la peur des complications. Il est de rappeler qu’une grande
      partie des infections hivernales sont virales et guérissent sans ce type de médicament. Si je commence
      par reconnaître l’impatience du patient, c’est pour mieux montrer que le bon choix n’est pas de
      céder à la demande immédiate, mais d’expliquer quand un traitement est utile et quand il ne l’est
      pas.'
    prompt: Comment le chroniqueur organise-t-il son argumentation ?
    options:
    - Il compare deux services hospitaliers
    - Il raconte l’histoire d’un patient
    - Il part d’un réflexe courant pour le remettre en cause
    - Il présente un nouveau médicament
    answer: 2
    explanation: Le chroniqueur commence par évoquer une demande très répandue, puis il montre pourquoi
      ce réflexe est discutable et dans quels cas il faut le corriger. Les autres propositions ne conviennent
      pas, car il ne compare pas des services, ne raconte pas une histoire particulière et ne fait pas
      la promotion d’un médicament.
