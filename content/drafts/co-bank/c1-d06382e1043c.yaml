  item:
    slug: co-c1-soins-de-proximite
    cefr: C1
    origin: generated
    focus: implicite
    audio_text: |-
      - Depuis l’ouverture de la navette médicale, on voit moins de rendez-vous manqués.
      - Il faut dire que, jusque-là, certains patients devaient choisir entre une demi-journée de travail et une consultation de suivi.
      - Vous pensez donc que le problème n’était pas seulement financier ?
      - Non. Quand le centre le plus proche est à une heure de bus, le moindre contrôle devient compliqué. On parle beaucoup de prévention, mais si l’on oblige les gens à parcourir tant de kilomètres, on les pousse à attendre que ça aille vraiment mal.
      - La navette ne fait pas de miracles.
      - Non, mais elle rappelle une chose simple : l’accès aux soins n’est pas abstrait ; il dépend aussi des trajets, des horaires et de l’énergie qu’il faut pour consulter.
    prompt: Que sous-entend le monsieur ?
    options:
    - La navette est trop coûteuse
    - La distance décourage les soins
    - Les patients préfèrent l’hôpital
    - La prévention est inutile
    answer: 1
    explanation: 'Le monsieur relie les rendez-vous manqués à la distance, au temps de trajet et aux contraintes
      pratiques, ce qui suggère que l’éloignement décourage les consultations. Les autres réponses ne
      correspondent pas : il ne critique ni le coût de la navette, ni le goût des patients pour l’hôpital,
      ni le principe de la prévention.'
