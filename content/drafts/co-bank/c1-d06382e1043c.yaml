  item:
    slug: co-c1-depistage-cible
    cefr: C1
    origin: generated
    focus: structure de l’argumentation
    audio_text: 'On entend souvent que les campagnes de dépistage inquiètent inutilement les gens, qu’elles
      fabriquent des faux positifs et des examens supplémentaires. L’objection n’est pas absurde. Si l’on
      dépiste sans discernement, on trouve des anomalies qui n’auraient peut-être jamais évolué. Mais
      c’est justement là que la discussion devient sérieuse : faut-il renoncer pour autant à tout dépistage
      ? Évidemment non. Il faut distinguer les programmes massifs, peu ciblés, des stratégies fondées
      sur l’âge, les antécédents et la qualité du suivi. Lorsqu’un test est proposé au bon moment et avec
      une information claire, il permet de détecter plus tôt des maladies qui, sans cela, seraient prises
      en charge trop tard. Autrement dit, le vrai enjeu n’est pas de choisir entre alarme et déni ; il
      est de concevoir des dispositifs précis, lisibles et accompagnés. Ce n’est pas le principe du dépistage
      qu’il faut condamner, c’est son usage approximatif.'
    prompt: Comment le chroniqueur construit-il son propos ?
    options:
    - Il compare deux hôpitaux
    - Il part d’une objection pour la nuancer
    - Il raconte une expérience personnelle
    - Il présente un nouveau médicament
    answer: 1
    explanation: 'Le texte commence par une objection fréquente, puis la discussion est progressivement
      nuancée par des conditions de dépistage plus précises. Les autres options sont fausses : il n’y
      a ni comparaison d’établissements, ni récit personnel, ni présentation d’un médicament.'
