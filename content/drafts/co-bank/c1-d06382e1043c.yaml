  item:
    slug: co-c1-compost-de-quartier
    cefr: C1
    origin: generated
    focus: rôle d’un organisme
    audio_text: 'Quand on parle de biodéchets, beaucoup de gens imaginent un effort supplémentaire imposé
      aux habitants. C’est l’inverse que nous avons essayé de faire avec l’association Terre Commune.
      Notre équipe accompagne les immeubles qui veulent transformer leurs déchets de cuisine en ressource
      locale. Nous commençons par les volontaires : une résidence pilote, quelques bacs bien placés, des
      consignes très simples, puis un suivi pendant trois mois. L’idée n’est pas de moraliser, encore
      moins de contrôler les ménages. Nous aidons les copropriétés à réduire le volume des poubelles,
      mais aussi à produire un compost utilisable dans les jardins partagés, les pieds d’immeubles ou
      les écoles du quartier. À terme, nous formons des référents parmi les habitants eux-mêmes, afin
      que le système tienne sans dépendre de nous. Notre rôle est donc double : rendre le tri praticable
      et montrer qu’un déchet organique peut redevenir une matière utile.'
    prompt: Quel est le rôle de l’association Terre Commune ?
    options:
    - Ramasser les ordures ménagères
    - Accompagner le compostage de quartier
    - Vendre des bacs de cuisine
    - Organiser des jardins d’enfants
    answer: 1
    explanation: 'L’association dit qu’elle accompagne les immeubles, forme des référents et aide à produire
      du compost local : son rôle est donc d’organiser le compostage de quartier. Elle ne se charge pas
      de la collecte des déchets, ne vend pas de matériel et n’organise pas des activités pour enfants.'
