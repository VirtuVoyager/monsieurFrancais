  item:
    slug: co-c1-corridors-ecologiques
    cefr: C1
    origin: generated
    focus: implicite
    audio_text: 'Quand on parle de biodiversité urbaine, on me répond souvent : D’accord pour les abeilles,
      mais est-ce vraiment prioritaire dans une ville déjà saturée ? La question est légitime, sauf qu’elle
      repose sur une idée trop étroite de la nature en ville. Les abeilles, les oiseaux, les vers de terre
      ou les plantes spontanées ne sont pas décoratifs. Ils forment un réseau discret qui filtre l’eau,
      rafraîchit les sols, limite certaines maladies des plantes et signale l’état général d’un quartier.
      C’est pourquoi les corridors écologiques ne servent pas seulement à sauver quelques espèces emblématiques.
      Ils relient des espaces fragmentés pour que les fonctions du vivant continuent de circuler. Si nous
      insistons sur les espèces discrètes, ce n’est pas par romantisme : c’est parce qu’elles rendent
      visible ce que l’on ne voit pas quand tout fonctionne mal. Une ville qui oublie ces liens devient
      plus fragile, même si, à première vue, elle paraît mieux aménagée.'
    prompt: Pourquoi le conférencier insiste-t-il sur les espèces discrètes ?
    options:
    - Pour montrer qu’elles révèlent la santé de l’ensemble
    - Pour défendre un simple décor végétal
    - Pour prouver que la ville n’a pas besoin de règles
    - Pour opposer la campagne à la ville
    answer: 0
    explanation: 'Le conférencier explique que ces espèces rendent visible l’état général d’un quartier
      et les fonctions du vivant. Les autres réponses sont erronées : il ne parle pas d’un décor, ne rejette
      pas les règles et ne construit pas une opposition ville/campagne.'
