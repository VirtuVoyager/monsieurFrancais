  item:
    slug: co-b2-habitat-participatif
    cefr: B2
    origin: generated
    focus: contrainte collective
    audio_text: 'Quand on parle d’habitat participatif, on imagine parfois une communauté un peu idéaliste.
      En réalité, les habitants que nous avons rencontrés sont très concrets : ils veulent mutualiser
      une buanderie, partager un jardin, décider ensemble de certains aménagements. Le projet attire des
      personnes qui cherchent du lien, mais pas au prix de leur indépendance. Il demande surtout du temps,
      beaucoup de discussions et une vraie capacité à trancher collectivement. C’est justement ce qui
      décourage certains candidats : on n’achète pas seulement un logement, on accepte aussi un mode de
      fonctionnement. Ceux qui restent disent souvent qu’ils y trouvent un équilibre qu’un immeuble classique
      ne leur offrait pas.'
    prompt: Que faut-il accepter dans ce type de logement ?
    options:
    - Prendre des décisions collectives
    - Avoir un jardin privé
    - Ne jamais discuter les règles
    - Acheter un logement neuf
    answer: 0
    explanation: Le document insiste sur le fait qu’il faut « décider ensemble » et accepter un « mode
      de fonctionnement ». Les distracteurs s’éloignent de cette idée de gestion collective.
