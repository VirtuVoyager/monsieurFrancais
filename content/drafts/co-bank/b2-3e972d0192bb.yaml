  item:
    slug: co-b2-formation-en-interne
    cefr: B2
    origin: generated
    focus: formation continue
    audio_text: Dans notre entreprise, on a longtemps pensé qu’une formation d’accueil suffisait. Or les
      outils changent, les procédures aussi, et les nouveaux employés n’osent pas toujours poser leurs
      questions après la première semaine. Nous avons donc remplacé les longues sessions théoriques par
      des modules courts, réguliers, animés par des collègues qui connaissent le terrain. Ce qui compte,
      ce n’est pas seulement d’expliquer une fois, mais de suivre les équipes dans la durée. Quand l’accompagnement
      est concret, les erreurs diminuent et les salariés gagnent vite en autonomie. C’est cette logique
      que nous avons fini par adopter.
    prompt: Qu’a compris l’entreprise ?
    options:
    - La théorie suffit
    - Il faut recruter davantage
    - La formation doit être suivie dans la durée
    - Le travail doit rester indépendant
    answer: 2
    explanation: Le texte dit explicitement qu’il ne faut pas seulement « expliquer une fois », mais «
      suivre les équipes dans la durée ». Les autres réponses contredisent cette évolution.
