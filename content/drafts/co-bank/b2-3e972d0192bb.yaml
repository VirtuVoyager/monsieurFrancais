  item:
    slug: co-b2-colocation-intergenerationnelle
    cefr: B2
    origin: generated
    focus: attitude nuancée
    audio_text: 'Dans plusieurs villes, la colocation intergénérationnelle séduit des étudiants et des
      retraités. Le principe est simple : un senior propose une chambre à prix modéré, et en échange,
      le jeune rend de petits services ou partage des moments de vie. Sur le papier, l’idée paraît idéale,
      mais elle ne convient pas à tout le monde. Il faut accepter des rythmes différents, parler franchement
      des règles et ne pas attendre une relation familiale. Les associations qui accompagnent ces binômes
      insistent d’ailleurs sur ce point : quand l’entente est réelle, chacun y gagne, mais sans médiation
      au départ, les malentendus sont fréquents. Pour moi, ce type de logement mérite d’être encouragé,
      à condition de rester lucide sur ses limites.'
    prompt: Quel est le point de vue de la locutrice ?
    options:
    - Favorable, mais prudente
    - Entièrement enthousiaste
    - Très critique
    - Sans opinion
    answer: 0
    explanation: 'Elle dit clairement qu’il faut l’encourager, « à condition de rester lucide sur ses
      limites ». Les autres réponses contredisent cette nuance : elle n’est ni sans avis, ni opposée,
      ni totalement enthousiaste.'
