    cefr: B2
    origin: generated
    focus: raison de l'abonnement
    audio_text: |-
      - Vous utilisez ce service de paniers avec les ingrédients déjà dosés. Qu'est-ce qui vous a convaincus ?
      - D'abord, la facilité. En semaine, on rentre tard, on n'a pas l'énergie de chercher une idée ni de refaire des courses.
      - Pourtant, vous aimez cuisiner, non ?
      - Oui, quand on a du temps. Là, il s'agit surtout de garder un repas maison sans y passer la soirée. Ce n'est pas une affaire de prestige culinaire ; c'est une manière d'éviter les improvisations de dernière minute et de manger correctement malgré les horaires. On sait à l'avance ce qu'on va cuisiner, ce qui enlève beaucoup de stress.
    prompt: Pourquoi ont-ils choisi ce service ?
    options:
    - Pour cuisiner des plats raffinés.
    - Pour suivre un régime strict.
    - Pour gagner du temps le soir.
    - Pour faire baisser leurs factures.
    answer: 2
    explanation: 'Ils disent que le service leur évite de chercher une idée, de faire des courses et d''y
      passer la soirée : la raison principale est donc le gain de temps. Les autres réponses ne sont pas
      mentionnées ou sont secondaires.'
