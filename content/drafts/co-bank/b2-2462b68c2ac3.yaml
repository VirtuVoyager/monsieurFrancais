  item:
    slug: co-b2-garde-des-enfants
    cefr: B2
    origin: generated
    focus: rôle des grands-parents
    audio_text: |-
      - Chez nous, les grands-parents gardent les enfants deux après-midi par semaine. C'est une chance, non ?
      - Bien sûr, et beaucoup de familles tiennent grâce à cela. Mais il ne faut pas transformer cette aide en norme invisible.
      - Vous pensez aux parents qui n'ont personne près d'eux ?
      - Oui, et aussi à ceux qui culpabilisent parce qu'ils ne peuvent pas compter sur la famille. L'aide des aînés est précieuse quand elle existe, mais elle ne devrait pas masquer le besoin de solutions plus larges pour la garde et les horaires de travail. Il faut penser aussi aux crèches, aux horaires flexibles et aux aides de proximité. On ne peut pas construire une politique familiale sur la seule disponibilité des grands-parents.
    prompt: Que sous-entend le locuteur ?
    options:
    - L'aide familiale est utile, mais elle ne remplace pas tout.
    - Les grands-parents doivent garder les enfants chaque semaine.
    - Les parents devraient refuser l'aide des aînés.
    - Les horaires de travail ne posent aucun problème.
    answer: 0
    explanation: Le locuteur reconnaît la valeur de l'aide des grands-parents, tout en disant qu'elle
      ne doit pas masquer le besoin d'autres solutions. Les autres réponses déforment son propos ou l'exagèrent.
