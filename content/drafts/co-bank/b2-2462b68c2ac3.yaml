  item:
    slug: co-b2-menu-vegetarien
    cefr: B2
    origin: generated
    focus: intention du projet
    audio_text: |-
      - Vous avez introduit un menu végétarien une fois par semaine dans les cantines du réseau. Pourquoi avoir choisi cette formule ?
      - Parce que nous voulions avancer sans brusquer les habitudes. Si l'on impose trop vite, on suscite du rejet ; si l'on propose un plat pensé pour être bon, les gens acceptent plus volontiers.
      - Certains disent pourtant que c'est une mesure surtout symbolique.
      - Je préfère parler d'essai concret. Nous observons les retours, nous ajustons les recettes, et nous regardons aussi le gaspillage. Notre objectif n'est pas de donner des leçons, mais de faire évoluer les pratiques de façon durable. Nous préférons vérifier ce qui fonctionne sur le terrain plutôt que lancer une réforme spectaculaire.
    prompt: Quel est l'objectif de cette mesure, selon le locuteur ?
    options:
    - Imposer une nouvelle règle à tout le monde.
    - Tester un changement progressif et accepté.
    - Réduire uniquement le coût des repas.
    - Satisfaire d'abord des militants.
    answer: 1
    explanation: Le locuteur insiste sur une démarche d'« essai concret », progressive et adaptable. Il
      refuse l'idée d'une imposition, d'une simple économie ou d'une opération militante.
