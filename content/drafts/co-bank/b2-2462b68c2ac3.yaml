  item:
    slug: co-b2-budget-alimentaire
    cefr: B2
    origin: generated
    focus: réaction aux prix
    audio_text: Quand le budget alimentaire se resserre, beaucoup de foyers ne renoncent pas à bien manger
      ; ils changent de stratégie. On prépare davantage à la maison, on planifie les repas, on achète
      moins de produits prêts à consommer. Ce n'est pas un retour en arrière, plutôt une forme d'adaptation.
      Les familles qui y parviennent ne sont pas celles qui se privent le plus, mais celles qui anticipent.
      Autrement dit, la hausse des prix oblige à être plus attentif, plus organisé, parfois plus inventif,
      sans pour autant transformer chaque repas en sacrifice. Cela demande un peu d'organisation, mais
      pas un renoncement. Au contraire, on garde une alimentation correcte tout en s'adaptant.
    prompt: Quelle est l'attitude du locuteur face à cette situation ?
    options:
    - Il la juge dramatique et sans issue.
    - Il regrette le temps des produits industriels.
    - Il la présente comme une adaptation possible.
    - Il pense que rien ne doit changer.
    answer: 2
    explanation: Le locuteur insiste sur l'« adaptation » et sur l'inventivité des familles face aux prix.
      Les autres réponses ajoutent soit du pessimisme, soit de la nostalgie, soit un refus du changement
      qui ne figurent pas dans le document.
