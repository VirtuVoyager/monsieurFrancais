  item:
    slug: co-b2-courses-en-famille
    cefr: B2
    origin: generated
    focus: partage des tâches
    audio_text: 'On dit souvent que les familles mangent moins bien parce qu''elles manquent de temps.
      C''est partiellement vrai, mais ce n''est pas toute l''histoire. Dans beaucoup de foyers, une seule
      personne pense au menu, fait les courses, vérifie ce qu''il reste, puis improvise le soir. À ce
      stade, le problème n''est plus seulement l''emploi du temps : c''est la répartition des tâches.
      Quand tout repose sur la même personne, elle choisit naturellement les solutions les plus rapides,
      pas forcément les plus équilibrées. Parler d''alimentation, c''est donc aussi parler de partage
      et d''organisation collective. Sinon, on parle d''équilibre alimentaire sans regarder qui porte
      réellement la charge. C''est là que les habitudes se jouent.'
    prompt: Selon le locuteur, quel est le vrai problème ?
    options:
    - Le manque de magasins près du domicile.
    - L'absence de recettes simples.
    - Le prix des produits surgelés.
    - La répartition inégale des tâches.
    answer: 3
    explanation: Le locuteur dit clairement que le problème dépasse le manque de temps et tient surtout
      au fait qu'une seule personne assume tout. Les autres options ne sont pas le centre de son argument.
