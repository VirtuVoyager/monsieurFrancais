  item:
    slug: co-b2-diner-familial
    cefr: B2
    origin: generated
    focus: point de vue
    audio_text: 'On aimerait croire qu''un dîner en famille règle tout : les tensions, la fatigue, les
      écrans. En réalité, le repas partagé n''est pas un rituel sacré ; c''est un espace possible parmi
      d''autres. Dans certaines maisons, on se voit chaque soir ; dans d''autres, le dimanche suffit,
      et cela peut aussi nourrir les liens. Ce qui compte, ce n''est pas la fréquence idéale, mais le
      moment où l''on se parle sans être interrompus. Il faut donc cesser d''opposer les familles « exemplaires
      » aux autres. Le lien se construit aussi dans des formes plus souples, plus ordinaires, et parfois
      moins visibles.'
    prompt: Quelle est l'idée principale de la locutrice ?
    options:
    - Il faut dîner ensemble tous les soirs.
    - Le dîner familial n'a plus aucune valeur.
    - Seuls les dimanches comptent vraiment.
    - Le repas partagé reste utile, mais sans modèle unique.
    answer: 3
    explanation: La locutrice dit que le repas partagé est un « espace possible » et qu'il n'existe pas
      de fréquence idéale, donc elle défend une pratique utile mais flexible. Les autres réponses sont
      trop absolues ou réduisent son propos à un seul jour.
