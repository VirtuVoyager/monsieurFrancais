    audio_text: 'Dans ce centre de quartier, on vient cuisiner ensemble une soupe, un plat complet ou
      un dessert simple. Certains participants repartent avec un repas, d''autres le laissent à des voisins
      âgés ou à des familles isolées. L''animatrice, elle, insiste sur un point : le succès du lieu ne
      se mesure pas seulement aux portions distribuées. Depuis l''ouverture, des personnes qui ne se parlaient
      jamais échangent des recettes, des astuces et parfois des nouvelles du quartier. Une retraitée raconte
      qu''elle n''osait plus inviter personne chez elle ; aujourd''hui, elle a repris l''habitude de recevoir.
      Ici, manger sert aussi à recréer des liens.'
    prompt: Quel est le but principal de ce centre, d'après le reportage ?
    options:
    - Distribuer des repas gratuits.
    - Apprendre la grande cuisine.
    - Créer du lien entre les habitants.
    - Vendre des plats faits maison.
    answer: 2
    explanation: Le reportage explique que le lieu ne sert pas seulement à donner à manger, mais à faire
      se rencontrer les habitants et à rompre l'isolement. Les autres options ne correspondent qu'à une
      partie secondaire ou sont fausses.
