  item:
    slug: co-b2-etiquettes-alimentaires
    cefr: B2
    origin: generated
    focus: attitude envers les labels
    audio_text: |-
      - Vous regardez encore tous ces labels sur les emballages ?
      - De moins en moins. J'ai l'impression qu'on me demande surtout de faire confiance à des logos, alors que je préfère comprendre ce que j'achète.
      - Donc vous ne faites plus attention à la qualité ?
      - Au contraire. Je lis la liste des ingrédients, je compare, et je me méfie quand l'étiquette promet trop. Un produit peut être très correct sans être couvert de sigles rassurants. Ce qui m'intéresse, c'est la composition réelle, pas le discours autour de l'emballage. Je préfère acheter moins, mais mieux, et garder un regard critique sur les promesses trop belles. Un logo rassurant ne remplace pas une vraie lecture.
    prompt: Quelle est l'attitude de la femme envers les labels ?
    options:
    - Elle les trouve indispensables.
    - Elle les collectionne par principe.
    - Elle ne lit jamais les ingrédients.
    - Elle s'en méfie un peu.
    answer: 3
    explanation: La femme dit qu'elle se méfie des logos et qu'elle préfère vérifier la composition réelle.
      Les autres propositions contredisent directement ses paroles ou caricaturent sa position.
