  item:
    slug: co-b1-espace-de-coworking
    cefr: B1
    origin: generated
    focus: opinion
    audio_text: Quand j’ai commencé chez Norel, j’étais souvent distrait dans le grand plateau du siège.
      Les conversations, les téléphones, tout me coupait dans mon travail. Mon responsable m’a proposé
      d’essayer un petit espace de coworking près de chez moi, deux jours par semaine. J’étais sceptique,
      mais j’y ai gagné en calme et en concentration. Je perds un peu le contact spontané avec l’équipe,
      bien sûr, mais pour les tâches qui demandent du silence, c’est vraiment efficace.
    prompt: Quelle opinion la personne exprime-t-elle ?
    options:
    - Il faut rester au bureau principal
    - Le travail en espace partagé est pratique
    - Il préfère travailler seul tout le temps
    - C'est trop loin pour être pratique
    answer: 1
    explanation: La personne conclut que cet espace est efficace pour travailler au calme, malgré une
      moindre spontanéité avec l’équipe. Les autres propositions contredisent son expérience ou ajoutent
      une idée absente du témoignage.
