    cefr: B1
    origin: generated
    focus: intention
    audio_text: |-
      - Vous êtes propriétaire d’un petit immeuble ancien. Pourquoi les travaux prennent-ils plus de temps que prévu ?
      - Parce qu’en ouvrant les murs, on a découvert des dégâts sur les canalisations. Je sais que les locataires s’impatientent, mais je préfère réparer correctement plutôt que de masquer le problème.
      - Vous avez prévenu les habitants ?
      - Oui, bien sûr. Nous avons déjà sécurisé l’entrée et envoyé un courrier à chacun. Si tout se passe bien, les appartements du deuxième étage seront terminés avant la fin du mois.
      - Dans ce cas, il faut surtout rester patient.
    prompt: Quel est le but de cet échange ?
    options:
    - Mettre les appartements en vente
    - Demander une augmentation du loyer
    - Plaindre les locataires
    - Expliquer le retard des travaux
    answer: 3
    explanation: Le propriétaire explique pourquoi le chantier prend du retard et précise les mesures
      prises pour les habitants. Il ne parle ni de vente, ni de hausse de loyer, ni de reproches aux locataires.
