    cefr: B1
    origin: generated
    focus: intention
    audio_text: |-
      - Tu as remarqué comme on se concentre mal depuis que l’équipe marketing a rejoint l’étage ?
      - Oui, surtout l’après-midi. Entre les appels et les réunions improvisées, j’ai du mal à finir les dossiers.
      - Justement, j’ai pensé demander à Nadia si on pouvait tester des horaires légèrement décalés pendant deux semaines.
      - Tu veux dire arriver plus tôt, ou plus tard ?
      - Plus tôt pour moi, par exemple. L’idée n’est pas de bouleverser tout le service, seulement de voir si ça réduit le bruit aux heures de pointe.
      - Franchement, ça mérite d’être essayé.
    prompt: Que proposent-ils de faire ?
    options:
    - Quitter le bâtiment
    - Changer leurs horaires
    - Supprimer les réunions
    - Passer en télétravail
    answer: 1
    explanation: Ils parlent clairement de tester des horaires légèrement décalés pendant deux semaines.
      Quitter le bâtiment, supprimer les réunions ou passer en télétravail ne sont jamais proposés.
