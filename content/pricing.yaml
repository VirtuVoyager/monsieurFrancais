# Azure list prices in USD (Global Standard). Verify against the Azure pricing pages
# before relying on them; bump `version` whenever a rate changes.
version: "2026-10-10"
verified_as_of: "2026-09-28"

models:
  gpt-5.4-mini:
    service: openai
    rates:
      input_tokens: {usd: 0.75, per: 1000000}
      cached_input_tokens: {usd: 0.075, per: 1000000}
      output_tokens: {usd: 4.50, per: 1000000}

  # Azure Global Standard rates, confirmed 2026-09-30. Image input is unused.
  gpt-realtime-2.1-mini:
    service: openai
    rates:
      text_input_tokens: {usd: 0.60, per: 1000000}
      cached_text_input_tokens: {usd: 0.06, per: 1000000}
      audio_input_tokens: {usd: 10.00, per: 1000000}
      cached_audio_input_tokens: {usd: 0.30, per: 1000000}
      text_output_tokens: {usd: 2.40, per: 1000000}
      audio_output_tokens: {usd: 20.00, per: 1000000}

  gpt-realtime-mini:
    service: openai
    rates:
      text_input_tokens: {usd: 0.60, per: 1000000}
      audio_input_tokens: {usd: 10.00, per: 1000000}
      cached_audio_input_tokens: {usd: 0.30, per: 1000000}
      text_output_tokens: {usd: 2.40, per: 1000000}
      audio_output_tokens: {usd: 20.00, per: 1000000}

  text-embedding-3-small:
    service: openai
    rates:
      input_tokens: {usd: 0.02, per: 1000000}

  # Also used for fast transcription of speaking answers; verify it bills at the same rate.
  azure-speech-stt:
    service: speech
    rates:
      audio_seconds: {usd: 1.00, per: 3600}
    free_monthly:
      audio_seconds: 18000

  # Billed as speech-to-text plus the pronunciation add-on (1.00 + 0.30 per hour). The free STT
  # hours are not counted here, so this overstates cost slightly rather than understating it.
  azure-speech-pronunciation:
    service: speech
    rates:
      audio_seconds: {usd: 1.30, per: 3600}

  azure-speech-tts:
    service: speech
    rates:
      characters: {usd: 16.00, per: 1000000}
    free_monthly:
      characters: 500000

  # Development only: the fake providers meter through the same path at zero cost.
  fake-text:
    service: openai
    rates:
      input_tokens: {usd: 0, per: 1000000}
      cached_input_tokens: {usd: 0, per: 1000000}
      output_tokens: {usd: 0, per: 1000000}

  fake-embedding:
    service: openai
    rates:
      input_tokens: {usd: 0, per: 1000000}

  fake-speech:
    service: speech
    rates:
      characters: {usd: 0, per: 1000000}

  fake-stt:
    service: speech
    rates:
      audio_seconds: {usd: 0, per: 3600}

  fake-realtime:
    service: openai
    rates:
      text_input_tokens: {usd: 0, per: 1000000}
      cached_text_input_tokens: {usd: 0, per: 1000000}
      audio_input_tokens: {usd: 0, per: 1000000}
      cached_audio_input_tokens: {usd: 0, per: 1000000}
      text_output_tokens: {usd: 0, per: 1000000}
      audio_output_tokens: {usd: 0, per: 1000000}
